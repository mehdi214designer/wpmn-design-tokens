<!-- WPMN Section: Animated Bento Showcase — a fluid em-scaled bento of feature cards with living micro-scenes: a payment-pill carousel, a floating coin cluster, a tilted product-image stack, and a typing secure-checkout field, around a center phone (from an HTML reference, the em-scaling engine + verbatim keyframes/timings kept, fully tokenized) -->
<section class="wpmn-sec-animated-bento-showcase">
  <style>
    .wpmn-sec-animated-bento-showcase{
      /* the reference scales EVERYTHING in em off a fluid root — kept as the layout engine */
      --abs-root:clamp(13px, 1.652vw, 28.55px);
      --abs-page:color-mix(in srgb, var(--btn-bg-enable) 6%, var(--color-surface-primary));
      --abs-tint-1:color-mix(in srgb, var(--btn-bg-enable) 16%, var(--color-surface-primary));
      --abs-tint-2:color-mix(in srgb, var(--btn-bg-enable) 26%, var(--color-surface-primary));
      --abs-coin-strong:color-mix(in srgb, var(--btn-bg-enable) 45%, var(--color-surface-primary));
      --abs-coin-soft:color-mix(in srgb, var(--btn-bg-enable) 30%, var(--color-surface-primary));
      --abs-skeleton:color-mix(in srgb, var(--color-text-primary) 8%, var(--color-surface-primary));
      --abs-dot-dark:color-mix(in srgb, var(--color-text-primary) 32%, transparent);
      --abs-dot-invert:color-mix(in srgb, var(--color-text-primary-invert) 32%, transparent);
      background:var(--abs-page);
      font-family:var(--font-family-base);
      color:var(--color-text-primary);
      font-size:var(--abs-root);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:2em 1em;gap:1.5em;
    }
    .wpmn-sec-animated-bento-showcase *{box-sizing:border-box}

    .wpmn-sec-animated-bento-showcase .grid{display:grid;grid-template-columns:14em 16.5em 14em;gap:0.667em 1.333em;align-items:center}
    .wpmn-sec-animated-bento-showcase .col{display:flex;flex-direction:column;gap:0.667em}

    .wpmn-sec-animated-bento-showcase .card{position:relative;width:14em;height:11.32em;border-radius:var(--radius-xsm);overflow:hidden;display:flex;flex-direction:column}
    .wpmn-sec-animated-bento-showcase .card h2{position:relative;z-index:2;margin:1.333em 1.333em 0;font-family:var(--font-family-base);font-size:1em;line-height:1;font-weight:var(--font-weight-medium);letter-spacing:-0.01em}

    /* ---- connect: payment-pill carousel (dark card) ---- */
    .wpmn-sec-animated-bento-showcase .card--connect{background:var(--color-surface-secondary)}
    .wpmn-sec-animated-bento-showcase .card--connect h2{color:var(--color-text-primary-invert);max-width:9.1em}
    .wpmn-sec-animated-bento-showcase .connect__stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-top:1.2em}
    .wpmn-sec-animated-bento-showcase .connect__slide{position:absolute;display:flex;align-items:center;gap:0.9em;height:3.1em;padding:0.5em 0.833em;background:var(--color-surface-primary);border-radius:1.875em;box-shadow:var(--shadow-hard-400);opacity:0;white-space:nowrap}
    .wpmn-sec-animated-bento-showcase .connect__slide .glyph{width:1.41em;height:1.41em;flex:none;color:var(--color-text-secondary)}
    .wpmn-sec-animated-bento-showcase .connect__slide .glyph svg{width:100%;height:100%;display:block}
    .wpmn-sec-animated-bento-showcase .connect__slide span{font-family:var(--font-family-base);font-size:0.583em;font-weight:var(--font-weight-medium);letter-spacing:0.04em;text-transform:uppercase;color:var(--color-text-secondary)}
    @keyframes wpmn-abs-pill-in{0%{transform:translate3d(0,200%,0)}100%{transform:translateZ(0)}}
    @keyframes wpmn-abs-pill-out{0%{transform:translateZ(0);opacity:1}100%{transform:translate3d(0,0.8em,0);opacity:0}}
    .wpmn-sec-animated-bento-showcase .connect__slide.is-in{opacity:1;animation:wpmn-abs-pill-in 0.5s cubic-bezier(0.2,0.7,0.3,1) both}
    .wpmn-sec-animated-bento-showcase .connect__slide.is-out{animation:wpmn-abs-pill-out 0.4s ease both}
    .wpmn-sec-animated-bento-showcase .connect__dots{position:absolute;bottom:0.85em;left:50%;transform:translateX(-50%);display:flex;gap:0.167em;align-items:center}
    .wpmn-sec-animated-bento-showcase .connect__dots i{width:0.167em;height:0.167em;border-radius:999px;background:var(--abs-dot-invert);transition:width 0.3s,background 0.3s}
    .wpmn-sec-animated-bento-showcase .connect__dots i.is-active{width:0.84em;background:var(--color-text-primary-invert)}

    /* ---- account: floating coin cluster (light tint card) ---- */
    .wpmn-sec-animated-bento-showcase .card--account{background:var(--abs-tint-1)}
    .wpmn-sec-animated-bento-showcase .card--account h2{color:var(--color-text-primary);max-width:11.3em}
    .wpmn-sec-animated-bento-showcase .acct{position:absolute;border-radius:999px;display:flex;align-items:center;justify-content:center}

    .wpmn-sec-animated-bento-showcase .acct--blue{width:3.29em;height:3.29em;background:var(--abs-coin-strong);color:var(--color-text-primary);left:8.2em;top:6.2em;animation:wpmn-abs-bob 4.6s 0.4s ease-in-out infinite}
    .wpmn-sec-animated-bento-showcase .acct--lav{width:2.77em;height:2.77em;background:var(--abs-coin-soft);color:var(--color-text-primary);left:3.4em;top:8.4em;animation:wpmn-abs-bob 4.2s 0.9s ease-in-out infinite}
    .wpmn-sec-animated-bento-showcase .acct--white{width:3.29em;height:3.29em;background:var(--color-surface-primary);color:var(--color-text-primary);left:2.2em;top:5.3em;transform:rotate(-17deg);animation:wpmn-abs-bob 5s 0.6s ease-in-out infinite}
    @keyframes wpmn-abs-bob{0%,100%{translate:0 0}50%{translate:0 -0.35em}}

    /* ---- collect: product image stack (dark card) ---- */
    .wpmn-sec-animated-bento-showcase .card--collect{background:var(--color-surface-secondary)}
    .wpmn-sec-animated-bento-showcase .card--collect h2{color:var(--color-text-primary-invert);max-width:9.1em}
    .wpmn-sec-animated-bento-showcase .nft{position:absolute;border-radius:0.333em;overflow:visible;animation:wpmn-abs-sway 6s ease-in-out infinite}
    .wpmn-sec-animated-bento-showcase .nft img{width:100%;height:100%;object-fit:cover;border-radius:0.333em;display:block}
    .wpmn-sec-animated-bento-showcase .nft__tag{position:absolute;top:0.45em;right:0.4em;padding:0.23em 0.32em;border-radius:0.125em;font-family:var(--font-family-base);font-size:0.333em;font-weight:var(--font-weight-medium);letter-spacing:0.06em}
    .wpmn-sec-animated-bento-showcase .tag-dark{background:var(--color-surface-secondary);color:var(--color-text-primary-invert)}

    .wpmn-sec-animated-bento-showcase .nft--1{width:6.625em;height:6.625em;left:3.25em;top:5.5em;rotate:-11.6deg}
    .wpmn-sec-animated-bento-showcase .nft--2{width:4.5em;height:4.5em;left:7em;top:7.4em;rotate:11.8deg;animation-delay:0.8s}
    .wpmn-sec-animated-bento-showcase .nft--3{width:5.17em;height:5.17em;left:2.2em;top:8.4em;rotate:-25.1deg;animation-delay:1.6s}
    .wpmn-sec-animated-bento-showcase .nft--s1{width:2.417em;height:2.417em;left:8.33em;top:12.5em}
    .wpmn-sec-animated-bento-showcase .nft--s2{width:2.417em;height:2.417em;left:5em;top:12.5em}
    @keyframes wpmn-abs-sway{0%,100%{translate:0 0}50%{translate:0 -0.2em}}

    /* ---- privacy: brand wedge + typing checkout field (light tint card) ---- */
    .wpmn-sec-animated-bento-showcase .card--privacy{background:var(--abs-tint-2)}
    .wpmn-sec-animated-bento-showcase .card--privacy h2{color:var(--color-text-primary);max-width:11.25em}
    .wpmn-sec-animated-bento-showcase .privacy__wedge{position:absolute;right:0;bottom:-1.25em;width:2.54em;height:9.62em;color:var(--btn-bg-enable)}
    .wpmn-sec-animated-bento-showcase .privacy__wedge svg{width:100%;height:100%;display:block}
    .wpmn-sec-animated-bento-showcase .privacy__input{position:absolute;left:3.83em;bottom:2.17em;width:14.58em;height:3.19em;background:var(--color-surface-primary);color:var(--color-text-primary);border-radius:0.41em;display:flex;align-items:center;gap:0.667em;padding-left:1em;box-shadow:var(--shadow-soft-300)}
    .wpmn-sec-animated-bento-showcase .privacy__input svg{width:0.958em;height:1em;flex-shrink:0;display:block}
    .wpmn-sec-animated-bento-showcase .privacy__caret{width:0.125em;height:1.458em;background:var(--color-text-primary);animation:wpmn-abs-blink 1.1s steps(1) infinite}

    .wpmn-sec-animated-bento-showcase .privacy__dots{display:flex;gap:0.208em;align-items:center}
    .wpmn-sec-animated-bento-showcase .privacy__dots i{width:0.604em;height:0.604em;border-radius:999px;background:var(--color-text-primary);transform:scale(0);transition:transform 0.15s}
    .wpmn-sec-animated-bento-showcase .privacy__dots i.is-on{transform:scale(1)}

    /* ---- center phone (rebuilt from screenshot) ---- */
    .wpmn-sec-animated-bento-showcase .phone{width:16.5em;height:27em;background:var(--color-surface-primary);border-radius:0.85em;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-soft-500)}
    .wpmn-sec-animated-bento-showcase .phone__skeleton{position:absolute;inset:0;padding:1.2em;opacity:0.55}
    .wpmn-sec-animated-bento-showcase .phone__skeleton i{display:block;background:var(--abs-skeleton);border-radius:0.3em}
    .wpmn-sec-animated-bento-showcase .sk-head{width:38%;height:1.4em;margin-bottom:0.5em}
    .wpmn-sec-animated-bento-showcase .sk-row{width:76%;height:0.85em;margin-bottom:0.45em}
    .wpmn-sec-animated-bento-showcase .sk-avatars{display:flex;gap:0.55em;margin:1.2em 0}
    .wpmn-sec-animated-bento-showcase .sk-avatars i{width:1.9em;height:1.9em;border-radius:999px}
    .wpmn-sec-animated-bento-showcase .sk-block{width:100%;height:1.65em;margin-bottom:0.55em;border-radius:0.45em}
    .wpmn-sec-animated-bento-showcase .phone__headline{position:relative;z-index:2;font-family:var(--font-family-base);font-size:1.7em;line-height:1.04;font-weight:var(--font-weight-bold);text-align:center;text-transform:uppercase;color:var(--color-text-primary);letter-spacing:0.01em}

    /* ---- pagination ---- */
    .wpmn-sec-animated-bento-showcase .pagination{display:flex;gap:0.167em;align-items:center;background:var(--color-surface-primary);border-radius:999px;padding:0.583em 0.75em;box-shadow:var(--shadow-soft-200)}
    .wpmn-sec-animated-bento-showcase .pagination i{width:0.167em;height:0.167em;border-radius:999px;background:var(--abs-dot-dark);transition:width 0.3s}
    .wpmn-sec-animated-bento-showcase .pagination i.is-active{width:0.84em;background:var(--btn-bg-enable)}

    @media (max-width:900px){
      .wpmn-sec-animated-bento-showcase{--abs-root:16px}
      .wpmn-sec-animated-bento-showcase .grid{grid-template-columns:repeat(2,minmax(0,14em))}
      .wpmn-sec-animated-bento-showcase .phone{display:none}
    }
    @media (max-width:540px){
      .wpmn-sec-animated-bento-showcase .grid{grid-template-columns:minmax(0,14em)}
    }
    @media (prefers-reduced-motion:reduce){
      .wpmn-sec-animated-bento-showcase .connect__slide,
      .wpmn-sec-animated-bento-showcase .acct,
      .wpmn-sec-animated-bento-showcase .nft,
      .wpmn-sec-animated-bento-showcase .privacy__caret,
      .wpmn-sec-animated-bento-showcase .privacy__dots i,
      .wpmn-sec-animated-bento-showcase .connect__dots i,
      .wpmn-sec-animated-bento-showcase .pagination i{animation:none;transition:none}
      .wpmn-sec-animated-bento-showcase .connect__slide.is-in{opacity:1}
      .wpmn-sec-animated-bento-showcase .privacy__dots i{transform:scale(1)}
    }
  </style>

  <script>
    // Idle motion kept verbatim from the reference (the capture had zero scroll — it is all
    // time-based): the payment-pill carousel and the checkout password-dot typing both run off a
    // shared tick (rAF + a 1s interval so hidden tabs still advance). Re-scoped to this section
    // root; class-based selectors so multiple instances coexist.
    (function () {
      var sec = document.currentScript ? document.currentScript.parentElement : document.querySelector('.wpmn-sec-animated-bento-showcase');
      if (!sec) return;
      var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

      var CARD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg>';
      var BANK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9l8-5 8 5M5 9v9M19 9v9M9 9v9M15 9v9M3 19h18"/></svg>';
      var WALLET = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h13a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/><circle cx="16" cy="13" r="1.2"/></svg>';
      var GLOBE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18"/></svg>';
      var BOLT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3 5 13h6l-1 8 8-11h-6z"/></svg>';

      var SLIDES = [
        { glyph: CARD,   label: 'Card payments' },
        { glyph: WALLET, label: 'Digital wallets' },
        { glyph: BANK,   label: 'Bank transfer' },
        { glyph: GLOBE,  label: 'Local methods' },
        { glyph: BOLT,   label: 'One-tap pay' }
      ];
      var PILL_MS = 2600;
      var PW_MS = 420;
      var PW_COUNT = 8;

      var stage = sec.querySelector('[data-stage]');
      var pdots = sec.querySelector('[data-pdots]');
      var pwWrap = sec.querySelector('[data-pwdots]');

      stage.innerHTML = SLIDES.map(function (s, i) {
        return '<div class="connect__slide' + (i === 0 ? ' is-in' : '') + '"><span class="glyph">' + s.glyph + '</span><span>' + s.label + '</span></div>';
      }).join('');
      pdots.innerHTML = SLIDES.map(function (_, i) { return '<i' + (i === 0 ? ' class="is-active"' : '') + '></i>'; }).join('');
      pwWrap.innerHTML = new Array(PW_COUNT + 1).join('<i></i>');

      var slides = [].slice.call(stage.children);
      var dots = [].slice.call(pdots.children);
      var pwDots = [].slice.call(pwWrap.children);

      if (reduced) {
        slides.forEach(function (s, i) { s.classList.toggle('is-in', i === 0); });
        pwDots.forEach(function (d) { d.classList.add('is-on'); });
        return;
      }

      var pill = 0, lastPill = 0, lastPw = 0, pw = 0;

      function tick(now) {
        if (now - lastPill >= PILL_MS) {
          lastPill = now;
          var prev = pill;
          pill = (pill + 1) % slides.length;
          slides[prev].classList.remove('is-in');
          slides[prev].classList.add('is-out');
          slides[pill].classList.remove('is-out');
          slides[pill].classList.add('is-in');
          dots.forEach(function (d, i) { d.classList.toggle('is-active', i === pill); });
        }
        if (now - lastPw >= PW_MS) {
          lastPw = now;
          pw = (pw + 1) % (PW_COUNT + 4);
          pwDots.forEach(function (d, i) { d.classList.toggle('is-on', i < pw); });
        }
      }

      (function loop() { tick(performance.now()); requestAnimationFrame(loop); })();
      setInterval(function () { tick(performance.now()); }, 1000);
    })();
  </script>
</section>
