<!-- WPMN Section: Feature Color Autocycle — 4 feature cards beside one tall panel that auto-advances through brand-tinted states, crossfading mockups, with a per-card progress bar (from an HTML reference, auto-cycle/click interactions kept verbatim, fully tokenized) -->
<section class="wpmn-sec-feature-color-autocycle">
  <style>
    .wpmn-sec-feature-color-autocycle{
      background:var(--color-surface-primary);
      color:var(--color-text-primary);
      font-family:var(--font-family-base);
      padding:var(--primitive-space-96) var(--primitive-space-32);
      --fcac-dur:4500ms;
      /* brand-tinted active card states (re-skin per data-brand) */
      --fcac-card-idle:color-mix(in srgb, var(--color-text-primary) 4%, var(--color-surface-primary));
      --fcac-card-hover:color-mix(in srgb, var(--color-text-primary) 8%, var(--color-surface-primary));
      --fcac-tint-0:color-mix(in srgb, var(--btn-bg-enable) 14%, var(--color-surface-primary));
      --fcac-tint-1:color-mix(in srgb, var(--btn-bg-enable) 22%, var(--color-surface-primary));
      --fcac-tint-2:color-mix(in srgb, var(--btn-bg-enable) 30%, var(--color-surface-primary));
      --fcac-tint-3:color-mix(in srgb, var(--btn-bg-enable) 38%, var(--color-surface-primary));
      /* panel fills (decorative, no text) */
      --fcac-panel-0:color-mix(in srgb, var(--btn-bg-enable) 30%, var(--color-surface-primary));
      --fcac-panel-1:color-mix(in srgb, var(--btn-bg-enable) 45%, var(--color-surface-primary));
      --fcac-panel-2:color-mix(in srgb, var(--btn-bg-enable) 60%, var(--color-surface-primary));
      --fcac-panel-3:color-mix(in srgb, var(--btn-bg-enable) 75%, var(--color-surface-primary));
      --fcac-bar-track:color-mix(in srgb, var(--color-text-primary) 12%, transparent);
      --fcac-bar-fill:color-mix(in srgb, var(--color-text-primary) 45%, transparent);
    }
    .wpmn-sec-feature-color-autocycle .wrap{max-width:1200px;margin:0 auto}
    .wpmn-sec-feature-color-autocycle .grid{display:grid;grid-template-columns:1fr 2fr;grid-template-rows:repeat(4,1fr);gap:var(--primitive-space-16)}

    /* feature cards (left) */
    .wpmn-sec-feature-color-autocycle .card{grid-column:1;display:flex;flex-direction:column;gap:var(--primitive-space-8);padding:var(--primitive-space-16);border-radius:var(--radius-sm);background:var(--fcac-card-idle);font:inherit;color:inherit;text-align:left;border:0;cursor:pointer;transition:background-color .5s ease;min-height:150px}
    .wpmn-sec-feature-color-autocycle .card:not(.is-active):hover{background:var(--fcac-card-hover)}
    .wpmn-sec-feature-color-autocycle .card.is-active[data-i="0"]{background:var(--fcac-tint-0)}
    .wpmn-sec-feature-color-autocycle .card.is-active[data-i="1"]{background:var(--fcac-tint-1)}
    .wpmn-sec-feature-color-autocycle .card.is-active[data-i="2"]{background:var(--fcac-tint-2)}
    .wpmn-sec-feature-color-autocycle .card.is-active[data-i="3"]{background:var(--fcac-tint-3)}
    .wpmn-sec-feature-color-autocycle .card .ico{width:var(--spacing-icon-size-lg);height:var(--spacing-icon-size-lg);display:block;color:var(--color-text-primary)}
    .wpmn-sec-feature-color-autocycle .card .ico svg{width:100%;height:100%;display:block}
    .wpmn-sec-feature-color-autocycle .card p{font-size:var(--font-size-body-base);line-height:var(--font-lh-body-base);max-width:34ch}
    .wpmn-sec-feature-color-autocycle .card p b{font-weight:var(--font-weight-bold)}

    /* progress bar */
    .wpmn-sec-feature-color-autocycle .bar{height:3px;border-radius:999px;background:var(--fcac-bar-track);overflow:hidden;margin-top:auto}
    .wpmn-sec-feature-color-autocycle .bar i{display:block;height:100%;width:100%;background:var(--fcac-bar-fill);transform:scaleX(0);transform-origin:left}
    .wpmn-sec-feature-color-autocycle .card.is-active .bar i{animation:wpmn-fcac-fill var(--fcac-dur, 4500ms) linear forwards}
    @keyframes wpmn-fcac-fill{to{transform:scaleX(1)}}

    /* sticky panel (right, spans all rows) */
    .wpmn-sec-feature-color-autocycle .panel{grid-column:2;grid-row:1 / -1;position:sticky;top:var(--primitive-space-24);align-self:start;aspect-ratio:5 / 4;border-radius:var(--radius-sm);overflow:hidden;background:var(--fcac-panel-0);transition:background-color .6s ease}
    .wpmn-sec-feature-color-autocycle .panel[data-active="0"]{background:var(--fcac-panel-0)}
    .wpmn-sec-feature-color-autocycle .panel[data-active="1"]{background:var(--fcac-panel-1)}
    .wpmn-sec-feature-color-autocycle .panel[data-active="2"]{background:var(--fcac-panel-2)}
    .wpmn-sec-feature-color-autocycle .panel[data-active="3"]{background:var(--fcac-panel-3)}
    .wpmn-sec-feature-color-autocycle .layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:6%;opacity:0;transition:opacity .5s ease;pointer-events:none}
    .wpmn-sec-feature-color-autocycle .layer.is-active{opacity:1}
    .wpmn-sec-feature-color-autocycle .layer img{width:100%;height:100%;object-fit:cover;border-radius:var(--radius-xsm);display:block;box-shadow:var(--shadow-soft-400)}

    @media (max-width:768px){
      .wpmn-sec-feature-color-autocycle{padding:var(--primitive-space-64) var(--primitive-space-20)}
      .wpmn-sec-feature-color-autocycle .grid{grid-template-columns:1fr;grid-template-rows:none}
      .wpmn-sec-feature-color-autocycle .card{grid-column:1;min-height:0}
      .wpmn-sec-feature-color-autocycle .bar{display:none}
      .wpmn-sec-feature-color-autocycle .panel{grid-column:1;grid-row:auto;position:static;order:-1}
    }
    @media (prefers-reduced-motion:reduce){
      .wpmn-sec-feature-color-autocycle .card,
      .wpmn-sec-feature-color-autocycle .panel,
      .wpmn-sec-feature-color-autocycle .layer{transition:none}
      .wpmn-sec-feature-color-autocycle .card.is-active .bar i{animation:none;transform:scaleX(1)}
    }
  </style>

  <div class="wrap">
    <div class="grid">

      <button class="card is-active" data-i="0" type="button">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 19c0-2.8-2.7-5-6-5s-6 2.2-6 5"/><circle cx="10" cy="7.5" r="3.5"/><path d="M17 13.6c2.3.5 4 2.3 4 4.4"/><path d="M16.4 5.3a3.3 3.3 0 0 1 0 6"/></svg></span>
        <p><b>Grow your list</b> with forms, landing pages, and opt-ins that turn visitors into subscribers.</p>
        <span class="bar"><i></i></span>
      </button>

      <button class="card" data-i="1" type="button">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M4 7.5l8 5.5 8-5.5"/></svg></span>
        <p><b>Send emails that get opened</b> with a drag-and-drop builder and clean, reliable delivery.</p>
        <span class="bar"><i></i></span>
      </button>

      <button class="card" data-i="2" type="button">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9a4 4 0 0 1 0 8H7"/><path d="M7 4 4 7l3 3"/><path d="M17 20l3-3-3-3"/></svg></span>
        <p><b>Automate every follow-up</b> with visual sequences that run the moment a contact qualifies.</p>
        <span class="bar"><i></i></span>
      </button>

      <button class="card" data-i="3" type="button">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6.5" rx="7" ry="3"/><path d="M5 6.5v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/><path d="M5 11.5v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/></svg></span>
        <p><b>Turn contacts into revenue</b> with smart tags, segments, and campaigns that pay off.</p>
        <span class="bar"><i></i></span>
      </button>

      <div class="panel" data-active="0">
        <div class="layer is-active" data-i="0"><img src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=1400&q=80" alt="List growth dashboard"></div>
        <div class="layer" data-i="1"><img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1400&q=80" alt="Email performance charts"></div>
        <div class="layer" data-i="2"><img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1400&q=80" alt="Automation sequence editor"></div>
        <div class="layer" data-i="3"><img src="https://images.unsplash.com/photo-1486312338219-ce68d2c6f44d?auto=format&fit=crop&w=1400&q=80" alt="Revenue from campaigns"></div>
      </div>

    </div>
  </div>

  <script>
    // Auto-advancing tab cycle kept verbatim from the reference: a shared interval advances
    // the active card every 4500ms, crossfading the matching panel layer and tweening the
    // panel fill; clicking a card jumps to it and restarts the timer; hovering the grid pauses;
    // an IntersectionObserver only runs the cycle while the section is in view. Re-scoped to
    // this section root, no raw colors in JS (state is driven by data attributes + CSS tokens).
    (function () {
      var sec = document.currentScript ? document.currentScript.parentElement : document.querySelector('.wpmn-sec-feature-color-autocycle');
      if (!sec) return;
      var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      var DUR = 4500;
      var grid = sec.querySelector('.grid');
      var panel = sec.querySelector('.panel');
      var cards = [].slice.call(sec.querySelectorAll('.card'));
      var layers = [].slice.call(sec.querySelectorAll('.layer'));
      var active = 0, timer = null;

      function show(i) {
        active = i;
        cards.forEach(function (c, j) { c.classList.toggle('is-active', j === i); });
        layers.forEach(function (l, j) { l.classList.toggle('is-active', j === i); });
        panel.setAttribute('data-active', String(i));
        var bar = cards[i].querySelector('.bar i');
        if (bar) { bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = ''; }
      }

      function start() { if (reduced) return; stop(); timer = setInterval(function () { show((active + 1) % cards.length); }, DUR); }
      function stop() { if (timer) { clearInterval(timer); timer = null; } }

      cards.forEach(function (c, i) { c.addEventListener('click', function () { show(i); start(); }); });
      grid.addEventListener('mouseenter', stop);
      grid.addEventListener('mouseleave', start);

      if (window.IntersectionObserver) {
        var io = new IntersectionObserver(function (es) { es[0].isIntersecting ? start() : stop(); }, { threshold: 0.25 });
        io.observe(grid);
      } else { start(); }

      show(0);
    })();
  </script>
</section>
