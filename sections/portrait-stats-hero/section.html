<!-- WPMN Section: Portrait Stats Hero — badge, display heading, paired CTAs, logo row, portrait with floating stat cards (image mode, tokenized) -->
<section class="wpmn-sec-portrait-stats-hero">
  <style>
    .wpmn-sec-portrait-stats-hero{background:var(--color-surface-primary);color:var(--color-text-primary);font-family:var(--font-family-base);padding:96px 32px;--psh-soft:color-mix(in srgb,var(--color-text-primary) 3%,var(--color-surface-primary));--psh-border:color-mix(in srgb,var(--color-text-primary) 12%,transparent);--psh-glow:color-mix(in srgb,var(--btn-bg-enable) 10%,var(--color-surface-primary))}
    .wpmn-sec-portrait-stats-hero .wrap{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:center}
    .wpmn-sec-portrait-stats-hero .badge{display:inline-flex;padding:8px 16px;border:1px solid var(--psh-border);border-radius:999px;font-size:var(--font-size-body-label);line-height:var(--font-lh-body-label);font-weight:var(--font-weight-medium);color:var(--color-text-secondary);margin-bottom:24px}
    .wpmn-sec-portrait-stats-hero h1{font-size:var(--font-size-h1);line-height:var(--font-lh-h1);font-weight:var(--font-weight-bold);letter-spacing:-0.02em;color:var(--color-text-primary);margin:0 0 20px;max-width:560px}
    .wpmn-sec-portrait-stats-hero .sub{font-size:var(--font-size-body-medium);line-height:var(--font-lh-body-medium);color:var(--color-text-secondary);max-width:480px;margin:0 0 32px}
    .wpmn-sec-portrait-stats-hero .ctas{display:flex;align-items:center;gap:12px;margin-bottom:56px}
    .wpmn-sec-portrait-stats-hero .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:var(--radius-xsm);font-size:var(--font-size-btn-md);line-height:var(--font-lh-btn-md);font-weight:var(--font-weight-medium);text-decoration:none;transition:background-color 120ms ease,box-shadow 120ms ease}
    .wpmn-sec-portrait-stats-hero .btn--primary{background:var(--btn-bg-enable);color:var(--color-text-primary-invert);box-shadow:inset 3px 4px 4px 0 var(--btn-bg-glow, rgba(255,255,255,0.3))}
    .wpmn-sec-portrait-stats-hero .btn--primary:hover{background:var(--btn-bg-hovered)}
    .wpmn-sec-portrait-stats-hero .btn--primary:active{background:var(--btn-bg-pressed)}
    .wpmn-sec-portrait-stats-hero .btn--light{background:var(--color-surface-primary);color:var(--color-text-primary);box-shadow:0 0 0 1px var(--psh-border)}
    .wpmn-sec-portrait-stats-hero .btn--light:hover{box-shadow:0 0 0 1px var(--psh-border),var(--shadow-soft-300)}
    .wpmn-sec-portrait-stats-hero .btn svg{width:16px;height:16px}
    .wpmn-sec-portrait-stats-hero .trusted{font-size:var(--font-size-h6);line-height:var(--font-lh-h6);font-weight:var(--font-weight-semibold);color:var(--color-text-primary);margin:0 0 20px}
    .wpmn-sec-portrait-stats-hero .logos{display:flex;align-items:center;gap:36px;flex-wrap:wrap}
    .wpmn-sec-portrait-stats-hero .logos span{font-size:var(--font-size-h6);font-weight:var(--font-weight-bold);letter-spacing:-0.01em;color:color-mix(in srgb,var(--color-text-primary) 32%,transparent);white-space:nowrap}
    .wpmn-sec-portrait-stats-hero .visual{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:20px;position:relative}
    .wpmn-sec-portrait-stats-hero .stat{background:var(--psh-soft);border-radius:var(--radius-md);padding:28px 24px;text-align:center;opacity:0;transform:translateY(16px);transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1)}
    .wpmn-sec-portrait-stats-hero.in-view .stat{opacity:1;transform:none}
    .wpmn-sec-portrait-stats-hero .stat .num{display:flex;align-items:center;justify-content:center;gap:8px;font-size:var(--font-size-h2);line-height:var(--font-lh-h2);font-weight:var(--font-weight-bold);color:var(--color-text-primary)}
    .wpmn-sec-portrait-stats-hero .stat .num svg{width:22px;height:22px;color:var(--color-warning-primary)}
    .wpmn-sec-portrait-stats-hero .stat .lbl{font-size:var(--font-size-body-base);line-height:var(--font-lh-body-base);color:var(--color-text-secondary);margin-top:6px}
    .wpmn-sec-portrait-stats-hero .stat .delta{display:inline-flex;align-items:center;gap:6px;font-size:var(--font-size-body-base);line-height:var(--font-lh-body-base);font-weight:var(--font-weight-semibold);color:var(--color-success-primary);margin-top:8px}
    .wpmn-sec-portrait-stats-hero .stat .delta svg{width:12px;height:12px}
    .wpmn-sec-portrait-stats-hero .photo{grid-column:1/3;position:relative;border-radius:var(--radius-md);overflow:hidden;background:var(--psh-soft);min-height:420px}
    .wpmn-sec-portrait-stats-hero .photo::before{content:"";position:absolute;left:50%;top:55%;width:520px;height:520px;transform:translate(-50%,-50%);border-radius:999px;background:radial-gradient(circle,var(--psh-glow) 0%,transparent 70%)}
    .wpmn-sec-portrait-stats-hero .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
    @media(max-width:1199px){
      .wpmn-sec-portrait-stats-hero{padding:96px 40px}
      .wpmn-sec-portrait-stats-hero .wrap{gap:40px}
    }
    @media(max-width:900px){
      .wpmn-sec-portrait-stats-hero .wrap{grid-template-columns:1fr}
      .wpmn-sec-portrait-stats-hero .ctas{margin-bottom:40px}
      .wpmn-sec-portrait-stats-hero .photo{min-height:340px}
    }
    @media(max-width:768px){
      .wpmn-sec-portrait-stats-hero{padding:64px 20px}
      .wpmn-sec-portrait-stats-hero .logos{gap:24px}
    }
    @media(prefers-reduced-motion:reduce){
      .wpmn-sec-portrait-stats-hero .stat{opacity:1;transform:none;transition:none}
      .wpmn-sec-portrait-stats-hero .btn{transition:none}
    }
  </style>
  <div class="wrap">
    <div class="copy">
      <span class="badge">Bold Brand</span>
      <h1>Make Your Brand Unmissable</h1>
      <p class="sub">At WPManageNinja, we create data-backed, creatively-led marketing tools that elevate your brand and accelerate growth.</p>
      <div class="ctas">
        <a class="btn btn--primary" href="#" onclick="return false">Let&rsquo;s Talk
          <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M6 8h4m0 0L8.5 6.5M10 8l-1.5 1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a class="btn btn--light" href="#" onclick="return false">Our Work</a>
      </div>
      <p class="trusted">Trusted by the Best</p>
      <div class="logos"><span>asana</span><span>hopin</span><span>maze</span><span>HBO max</span><span>aws</span></div>
    </div>
    <div class="visual">
      <div class="stat">
        <div class="num"><span data-count="80" data-suffix="K">0K</span></div>
        <div class="lbl">New Users</div>
        <div class="delta"><svg viewBox="0 0 12 12"><path d="M6 1 11 9H1Z" fill="currentColor"/></svg>+120%</div>
      </div>
      <div class="stat">
        <div class="num"><span data-count="4.9" data-decimals="1">0.0</span>
          <svg viewBox="0 0 22 22" fill="none"><path d="M11 2.5 13.6 8l5.9.6-4.4 4 1.2 5.8L11 15.5l-5.3 2.9 1.2-5.8-4.4-4L8.4 8Z" fill="currentColor"/></svg>
        </div>
        <div class="lbl">10K+ Happy Clients</div>
      </div>
      <div class="photo">
        <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=1000&q=80" alt="Smiling team member with a tablet" loading="lazy">
      </div>
    </div>
  </div>
  <script>
    // Motion (image mode, my call): stat tiles rise in staggered on first view,
    // numbers count up once; buttons follow design-system states.
    (function () {
      var sec = document.currentScript ? document.currentScript.parentElement : document.querySelector('.wpmn-sec-portrait-stats-hero');
      if (!sec) return;
      var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

      sec.querySelectorAll('.stat').forEach(function (s, i) { s.style.transitionDelay = (i * 120) + 'ms'; });

      function countUp(el) {
        var target = parseFloat(el.dataset.count);
        var decimals = parseInt(el.dataset.decimals || '0', 10);
        var suffix = el.dataset.suffix || '';
        var t0 = null, DUR = 900;
        function frame(t) {
          if (!t0) t0 = t;
          var p = Math.min((t - t0) / DUR, 1);
          var e = 1 - Math.pow(1 - p, 3);
          el.textContent = (target * e).toFixed(decimals) + suffix;
          if (p < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }

      function reveal() {
        sec.classList.add('in-view');
        sec.querySelectorAll('[data-count]').forEach(function (el) {
          if (reduced) {
            el.textContent = parseFloat(el.dataset.count).toFixed(parseInt(el.dataset.decimals || '0', 10)) + (el.dataset.suffix || '');
          } else {
            countUp(el);
          }
        });
      }

      if (reduced || !('IntersectionObserver' in window)) { reveal(); return; }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { reveal(); io.disconnect(); }
        });
      }, { threshold: 0.3 });
      io.observe(sec);
    })();
  </script>
</section>
