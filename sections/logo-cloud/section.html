<!-- WPMN Section: Logo Cloud — trust strip of client/press logos (placeholder wordmarks, swap with real SVGs) -->
<section class="wpmn-sec-logo-cloud">
  <style>
    .wpmn-sec-logo-cloud { padding:var(--primitive-space-96) 0; background: var(--color-surface-primary); font-family: var(--font-family-base); }
    .wpmn-sec-logo-cloud .lc-container { max-width: 1200px; margin: 0 auto; text-align: center; }
    .wpmn-sec-logo-cloud .lc-label { margin:0 0 var(--primitive-space-32); font-size: var(--font-size-body-base); line-height: var(--font-lh-body-base); color: var(--color-text-secondary); }
    .wpmn-sec-logo-cloud .lc-grid { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap:var(--primitive-space-16) var(--primitive-space-48); }
    .wpmn-sec-logo-cloud .lc-logo { display: inline-flex; align-items: center; gap:var(--primitive-space-8); padding:var(--primitive-space-12) var(--primitive-space-8); font-size: var(--font-size-h6); font-weight: var(--font-weight-bold); letter-spacing: -0.01em; color: var(--color-text-secondary); opacity: 0.65; transition: opacity 120ms ease, color 120ms ease; cursor: default; }
    .wpmn-sec-logo-cloud .lc-logo:hover { opacity: 1; color: var(--color-text-primary); }
    .wpmn-sec-logo-cloud .lc-logo svg { flex-shrink: 0; }
    @media (max-width: 1199px) { .wpmn-sec-logo-cloud .lc-container { padding:0 var(--primitive-space-40); } }
    @media (max-width: 768px) { .wpmn-sec-logo-cloud { padding:var(--primitive-space-64) 0; } .wpmn-sec-logo-cloud .lc-container { padding:0 var(--primitive-space-20); } .wpmn-sec-logo-cloud .lc-grid { gap:var(--primitive-space-8) 28px; } }
  </style>
  <div class="lc-container">
    <p class="lc-label">Powering 300,000+ websites, from solo creators to enterprise teams</p>
    <div class="lc-grid">
      <span class="lc-logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="5" fill="currentColor"/></svg>Acme Co</span>
      <span class="lc-logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="currentColor"/></svg>Globex</span>
      <span class="lc-logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3l9 18H3l9-18z" fill="currentColor"/></svg>Vertex</span>
      <span class="lc-logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="18" rx="2" fill="currentColor"/><rect x="13" y="9" width="8" height="12" rx="2" fill="currentColor"/></svg>Initech</span>
      <span class="lc-logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="8" cy="12" r="5" fill="currentColor"/><circle cx="16" cy="12" r="5" fill="currentColor" opacity="0.6"/></svg>Umbrella</span>
      <span class="lc-logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 17L12 4l9 13H3z" fill="currentColor"/><rect x="9" y="17" width="6" height="4" fill="currentColor"/></svg>Northwind</span>
    </div>
  </div>
</section>
