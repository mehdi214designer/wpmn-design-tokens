<!-- WPMN Section: Product Library Hero — a centered hero (pill, bold heading, sub, primary button) over a three-row band of app tiles that fades at both edges, with a glowing brand tile at the center, and a muted "trusted by" row of placeholder wordmarks. Built from a screenshot, tokenized, motion added. Tiles and wordmarks are generic placeholders (content swapped on use) — no images, no third-party logos. Classes are plh-prefixed so host/demo rules can't leak in. -->
<section class="wpmn-sec-product-library-hero">
  <style>
@keyframes wpmn-plh-up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes wpmn-plh-pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes wpmn-plh-glow{0%,100%{box-shadow:0 10px 30px color-mix(in srgb, var(--btn-bg-enable) 40%, transparent)}50%{box-shadow:0 14px 44px color-mix(in srgb, var(--btn-bg-enable) 70%, transparent)}}
    .wpmn-sec-product-library-hero{
      background:var(--color-surface-primary);color:var(--color-text-primary);
      font-family:var(--font-family-base);
      padding:var(--primitive-space-96) var(--primitive-space-32);text-align:center;
      --plh-tile:var(--color-surface-primary);
      --plh-line:color-mix(in srgb, var(--color-text-primary) 8%, transparent);
      --plh-soft:color-mix(in srgb, var(--color-text-primary) 4%, var(--color-surface-primary));
    }
    .wpmn-sec-product-library-hero *{box-sizing:border-box}
    .wpmn-sec-product-library-hero .plh-wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;align-items:center}

    .wpmn-sec-product-library-hero .plh-pill{display:inline-flex;align-items:center;padding:6px var(--primitive-space-16);border-radius:999px;background:color-mix(in srgb, var(--btn-bg-enable) 12%, var(--color-surface-primary));color:var(--btn-bg-enable);font-size:var(--font-size-body-small);line-height:var(--font-lh-body-small);font-weight:var(--font-weight-semibold)}
    .wpmn-sec-product-library-hero h2{font-size:var(--font-size-h1);line-height:var(--font-lh-h1);font-weight:var(--font-weight-bold);letter-spacing:-.02em;color:var(--color-text-primary);margin:var(--primitive-space-24) 0 var(--primitive-space-16);max-width:16ch}
    .wpmn-sec-product-library-hero .plh-sub{font-size:var(--font-size-body-medium);line-height:var(--font-lh-body-medium);color:var(--color-text-secondary);margin:0 0 var(--primitive-space-32);max-width:46ch}
    .wpmn-sec-product-library-hero .plh-btn{display:inline-flex;align-items:center;gap:var(--primitive-space-8);height:50px;padding:0 var(--primitive-space-24);border-radius:var(--radius-xsm);background:var(--btn-bg-enable);color:var(--color-text-primary-invert);font-size:var(--font-size-body-base);line-height:var(--font-lh-body-base);font-weight:var(--font-weight-semibold);text-decoration:none;box-shadow:inset 3px 4px 4px 0 var(--btn-bg-glow, rgba(255,255,255,0.3));transition:background-color .18s ease}
    .wpmn-sec-product-library-hero .plh-btn:hover{background:var(--btn-bg-hovered)}
    .wpmn-sec-product-library-hero .plh-btn svg{width:18px;height:18px}

    .wpmn-sec-product-library-hero .plh-band{width:100%;margin-top:56px;-webkit-mask-image:linear-gradient(to right, transparent, black 16%, black 84%, transparent);mask-image:linear-gradient(to right, transparent, black 16%, black 84%, transparent)}
    .wpmn-sec-product-library-hero .plh-row{display:flex;gap:var(--primitive-space-16);justify-content:center;margin-bottom:var(--primitive-space-16)}
    .wpmn-sec-product-library-hero .plh-tile{width:64px;height:64px;flex:none;border-radius:var(--radius-md);background:var(--plh-tile);border:1px solid var(--plh-line);box-shadow:var(--shadow-soft-300);display:flex;align-items:center;justify-content:center;color:var(--plh-ic);opacity:0}
    .wpmn-sec-product-library-hero.is-inview .plh-tile{animation:wpmn-plh-pop .5s cubic-bezier(.22,1,.36,1) both}
    .wpmn-sec-product-library-hero .plh-tile svg{width:44%;height:44%}
    .wpmn-sec-product-library-hero .plh-tile.plh-hero{background:linear-gradient(150deg, var(--btn-bg-enable), color-mix(in srgb, var(--btn-bg-enable) 60%, var(--color-surface-secondary)));border-color:transparent;color:var(--color-text-primary-invert)}
    .wpmn-sec-product-library-hero.is-inview .plh-tile.plh-hero{animation:wpmn-plh-pop .5s cubic-bezier(.22,1,.36,1) both, wpmn-plh-glow 3s ease-in-out 1s infinite}

    .wpmn-sec-product-library-hero .plh-trust{margin-top:56px;display:flex;flex-direction:column;align-items:center;gap:var(--primitive-space-24)}
    .wpmn-sec-product-library-hero .plh-trustlabel{font-size:var(--font-size-body-small);line-height:var(--font-lh-body-small);color:var(--color-text-secondary)}
    .wpmn-sec-product-library-hero .plh-logos{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:var(--primitive-space-40)}
    .wpmn-sec-product-library-hero .plh-logo{font-size:var(--font-size-h6);line-height:var(--font-lh-h6);font-weight:var(--font-weight-bold);letter-spacing:.02em;color:color-mix(in srgb, var(--color-text-primary) 42%, transparent)}

    @media (max-width:768px){
      .wpmn-sec-product-library-hero{padding:64px var(--primitive-space-24)}
      .wpmn-sec-product-library-hero .plh-tile{width:54px;height:54px}
      .wpmn-sec-product-library-hero .plh-logos{gap:var(--primitive-space-24)}
    }
    @media (prefers-reduced-motion:reduce){
      .wpmn-sec-product-library-hero .plh-tile{opacity:1 !important;animation:none !important}
    }
  </style>

  <div class="plh-wrap">
    <span class="plh-pill">Create Your Best Score</span>
    <h2>Get instant access to our growing product library</h2>
    <p class="plh-sub">Get everything at once. You will not have to pay for updates and new products produced by our team.</p>
    <a class="plh-btn" href="#" onclick="return false">Discover Products
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>

    <div class="plh-band"></div>

    <div class="plh-trust">
      <span class="plh-trustlabel">Trusted by teams building on WordPress</span>
      <div class="plh-logos"></div>
    </div>
  </div>

  <script>
  (function(){
    var sec = document.currentScript.parentElement;
    var glyphs = [
      '<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="2" fill="currentColor"/><rect x="13" y="3" width="8" height="8" rx="2" fill="currentColor" opacity="0.6"/><rect x="3" y="13" width="8" height="8" rx="2" fill="currentColor" opacity="0.6"/><rect x="13" y="13" width="8" height="8" rx="2" fill="currentColor"/></svg>',
      '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3l7 4v6c0 4-3 6-7 8-4-2-7-4-7-8V7z" fill="currentColor"/></svg>',
      '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>',
      '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.6 5.9 20.4l1.4-6.8L2.2 9l6.9-.7z"/></svg>',
      '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3v18M3 12h18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>',
      '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>',
      '<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="5" fill="currentColor"/></svg>',
      '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.4"/><path d="M8 12h8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>'
    ];
    var hero = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.6L19.5 9l-4.7 2 .5 6-3.3-4.4L8.7 19l.5-6L4.5 11l5.7-1.4z"/></svg>';
    var tints = ['var(--btn-bg-enable)','var(--color-success-primary)','var(--color-warning-primary)','var(--color-error-primary)',
      'color-mix(in srgb, var(--btn-bg-enable), var(--color-warning-primary))',
      'color-mix(in srgb, var(--color-success-primary), var(--btn-bg-enable))'];
    var band = sec.querySelector('.plh-band');
    var rows = 3, cols = 11, mid = Math.floor(rows/2)*cols + Math.floor(cols/2), idx = 0, html = '', g = 0;
    for(var r=0;r<rows;r++){
      html += '<div class="plh-row">';
      for(var c=0;c<cols;c++){
        var isHero = idx === mid;
        var delay = (Math.abs(c-Math.floor(cols/2)) + r) * 45;
        if(isHero){
          html += '<div class="plh-tile plh-hero" style="animation-delay:' + delay + 'ms">' + hero + '</div>';
        } else {
          html += '<div class="plh-tile" style="--plh-ic:' + tints[g%tints.length] + ';animation-delay:' + delay + 'ms">' + glyphs[g%glyphs.length] + '</div>';
          g++;
        }
        idx++;
      }
      html += '</div>';
    }
    band.innerHTML = html;

    var logos = ['Meridian','Cobalt','Northwind','Harbor','Brightleaf','Fernway'];
    sec.querySelector('.plh-logos').innerHTML = logos.map(function(n){ return '<span class="plh-logo">' + n + '</span>'; }).join('');

    if('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ sec.classList.add('is-inview'); io.disconnect(); } }); }, {threshold:0.12});
      io.observe(sec);
    } else { sec.classList.add('is-inview'); }
  })();
  </script>
</section>
