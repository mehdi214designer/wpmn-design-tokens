<!-- WPMN Section: Team Grid — people cards with roles and socials -->
<section class="wpmn-sec-team-grid">
  <style>
    .wpmn-sec-team-grid{padding:var(--primitive-space-96) 0;background:var(--color-surface-primary);font-family:var(--font-family-base)}
    .wpmn-sec-team-grid .tm-c{max-width:1200px;margin:0 auto}
    .wpmn-sec-team-grid .tm-head{text-align:center;margin-bottom:var(--primitive-space-48)}
    .wpmn-sec-team-grid .tm-badge{display:inline-flex;align-items:center;gap:var(--primitive-space-8);font-size:var(--font-size-body-label);font-weight:var(--font-weight-medium);letter-spacing:.08em;text-transform:uppercase;color:var(--btn-bg-enable);margin-bottom:var(--primitive-space-12)}
    .wpmn-sec-team-grid .tm-badge::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--btn-bg-enable)}
    .wpmn-sec-team-grid .tm-heading{max-width:800px;margin:0 auto;font-size:var(--font-size-h2);line-height:var(--font-lh-h2);font-weight:var(--font-weight-semibold);color:var(--color-text-primary)}
    .wpmn-sec-team-grid .tm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--primitive-space-24)}
    .wpmn-sec-team-grid .tm-card{border:1.5px solid var(--color-border-primary);border-radius:var(--radius-md);padding:var(--primitive-space-24);text-align:center;transition:box-shadow 120ms ease}
    .wpmn-sec-team-grid .tm-card:hover{box-shadow:var(--shadow-soft-300)}
    .wpmn-sec-team-grid .tm-photo{width:96px;height:96px;border-radius:50%;margin:0 auto;background:var(--btn-bg-focused);color:var(--btn-bg-hovered);display:flex;align-items:center;justify-content:center;font-size:var(--font-size-h5);font-weight:var(--font-weight-semibold)}
    .wpmn-sec-team-grid h3{margin:var(--primitive-space-16) 0 0;font-size:var(--font-size-h6);font-weight:var(--font-weight-semibold);color:var(--color-text-primary)}
    .wpmn-sec-team-grid .tm-role{margin:var(--primitive-space-4) 0 0;font-size:var(--font-size-body-small);color:var(--color-text-secondary)}
    .wpmn-sec-team-grid .tm-social{display:flex;justify-content:center;gap:var(--primitive-space-12);margin-top:var(--primitive-space-12);color:var(--color-text-secondary)}
    .wpmn-sec-team-grid .tm-social a{color:inherit;display:flex;transition:color 120ms ease}
    .wpmn-sec-team-grid .tm-social a:hover{color:var(--btn-bg-enable)}
    @media(max-width:1199px){.wpmn-sec-team-grid .tm-c{padding:0 var(--primitive-space-40)}}
    @media(max-width:900px){.wpmn-sec-team-grid .tm-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:768px){.wpmn-sec-team-grid{padding:var(--primitive-space-64) 0}.wpmn-sec-team-grid .tm-c{padding:0 var(--primitive-space-20)}}
    @media(max-width:480px){.wpmn-sec-team-grid .tm-grid{grid-template-columns:1fr}}
  </style>
  <div class="tm-c">
    <div class="tm-head"><span class="tm-badge">Team</span><h2 class="tm-heading">The people shipping it</h2></div>
    <div class="tm-grid">
      <div class="tm-card"><div class="tm-photo">NH</div><h3>Nadia H.</h3><p class="tm-role">Founder & CEO</p><div class="tm-social"><a href="#" aria-label="X"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 4l16 16M20 4L4 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></a><a href="#" aria-label="LinkedIn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="4" stroke="currentColor" stroke-width="2"/><path d="M8 11v5M8 8v.01M12 16v-3a2 2 0 014 0v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></a></div></div>
      <div class="tm-card"><div class="tm-photo">RB</div><h3>Rafi B.</h3><p class="tm-role">Head of Engineering</p><div class="tm-social"><a href="#" aria-label="X"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 4l16 16M20 4L4 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></a><a href="#" aria-label="LinkedIn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="4" stroke="currentColor" stroke-width="2"/><path d="M8 11v5M8 8v.01M12 16v-3a2 2 0 014 0v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></a></div></div>

  </div>
</section>
