<!-- WPMN Section: Standard Hero — badge + heading + subtext + CTA pair + mockup in surface container -->
<section class="wpmn-sec-hero-standard">
  <style>
    .wpmn-sec-hero-standard { padding: 96px 0; background: var(--color-surface-primary); font-family: var(--font-family-base); }
    .wpmn-sec-hero-standard .hs-container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .wpmn-sec-hero-standard .hs-badge { display: inline-flex; align-items: center; gap: 8px; font-size: var(--font-size-body-label); line-height: var(--font-lh-body-label); font-weight: var(--font-weight-medium); letter-spacing: 0.08em; text-transform: uppercase; color: var(--btn-bg-enable); margin-bottom: 12px; }
    .wpmn-sec-hero-standard .hs-badge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--btn-bg-enable); }
    .wpmn-sec-hero-standard .hs-heading { max-width: 800px; margin: 0; font-size: var(--font-size-h1); line-height: var(--font-lh-h1); font-weight: var(--font-weight-semibold); color: var(--color-text-primary); }
    .wpmn-sec-hero-standard .hs-heading em { font-style: normal; color: var(--btn-bg-enable); }
    .wpmn-sec-hero-standard .hs-subtext { max-width: 800px; margin: 16px 0 0; font-size: var(--font-size-body-large); line-height: var(--font-lh-body-large); color: var(--color-text-secondary); }
    .wpmn-sec-hero-standard .hs-ctas { display: flex; gap: 16px; margin-top: 32px; flex-wrap: wrap; justify-content: center; }
    .wpmn-sec-hero-standard .hs-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 56px; padding: 0 32px; border-radius: var(--radius-xsm); font-size: var(--font-size-btn-lg); line-height: var(--font-lh-btn-lg); font-weight: var(--font-weight-semibold); font-family: inherit; text-decoration: none; cursor: pointer; transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; border: 1.5px solid transparent; }
    .wpmn-sec-hero-standard .hs-btn--primary { background: var(--btn-bg-enable); color: var(--color-text-primary-invert); box-shadow: inset 3px 4px 4px 0 rgba(255,255,255,0.3); }
    .wpmn-sec-hero-standard .hs-btn--primary:hover { background: var(--btn-bg-hovered); }
    .wpmn-sec-hero-standard .hs-btn--secondary { background: transparent; color: var(--btn-bg-enable); border-color: var(--btn-bg-enable); }
    .wpmn-sec-hero-standard .hs-btn--secondary:hover { background: var(--btn-bg-enable); color: var(--color-text-primary-invert); }
    .wpmn-sec-hero-standard .hs-showcase { width: 100%; margin-top: 48px; padding: 48px; border-radius: var(--radius-lg); background: var(--color-brand-surface); }
    .wpmn-sec-hero-standard .hs-mockup { width: 100%; aspect-ratio: 16 / 9; border-radius: var(--radius-md); border: 1px solid var(--color-border-primary); box-shadow: var(--shadow-soft-400); background: var(--color-surface-primary); display: flex; align-items: center; justify-content: center; color: var(--color-text-secondary); font-size: var(--font-size-body-base); }
    @media (max-width: 1199px) { .wpmn-sec-hero-standard .hs-container { padding: 0 40px; } }
    @media (max-width: 768px) {
      .wpmn-sec-hero-standard { padding: 64px 0; }
      .wpmn-sec-hero-standard .hs-container { padding: 0 20px; }
      .wpmn-sec-hero-standard .hs-showcase { padding: 20px; }
    }
  </style>
  <div class="hs-container">
    <span class="hs-badge">Form Builder</span>
    <h1 class="hs-heading">The Fastest <em>Form Builder</em> for WordPress</h1>
    <p class="hs-subtext">Build beautiful forms in minutes with drag and drop. No code, no bloat, just conversions.</p>
    <div class="hs-ctas">
      <a class="hs-btn hs-btn--primary" href="#">Get Started Free</a>
      <a class="hs-btn hs-btn--secondary" href="#">See Live Demo</a>
    </div>
    <div class="hs-showcase">
      <div class="hs-mockup">Product screenshot / mockup goes here (16:9)</div>
    </div>
  </div>
</section>
