<!-- WPMN Section: Before/After Slider — draggable handle reveals two states -->
<section class="wpmn-sec-before-after-slider">
  <style>
    .wpmn-sec-before-after-slider{padding:96px 0;background:var(--color-surface-primary);font-family:var(--font-family-base)}
    .wpmn-sec-before-after-slider .ba-c{max-width:1200px;margin:0 auto;text-align:center}
    .wpmn-sec-before-after-slider .ba-heading{max-width:800px;margin:0 auto;font-size:var(--font-size-h2);line-height:var(--font-lh-h2);font-weight:var(--font-weight-semibold);color:var(--color-text-primary)}
    .wpmn-sec-before-after-slider .ba-sub{max-width:800px;margin:16px auto 0;font-size:var(--font-size-body-medium);line-height:var(--font-lh-body-medium);color:var(--color-text-secondary)}
    .wpmn-sec-before-after-slider .ba-frame{position:relative;margin:48px auto 0;max-width:900px;aspect-ratio:16/9;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--color-border-primary);box-shadow:var(--shadow-soft-400);user-select:none;touch-action:none}
    .wpmn-sec-before-after-slider .ba-side{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:var(--font-size-h4);font-weight:var(--font-weight-semibold)}
    .wpmn-sec-before-after-slider .ba-before{background:var(--color-surface-secondary);color:var(--color-text-secondary-invert)}
    .wpmn-sec-before-after-slider .ba-after{background:var(--color-brand-surface);color:var(--color-text-primary-invert);clip-path:inset(0 0 0 50%)}
    .wpmn-sec-before-after-slider .ba-tag{position:absolute;top:16px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 12px;border-radius:99px;background:rgba(0,0,0,.45);color:#fff}
    .wpmn-sec-before-after-slider .ba-before .ba-tag{left:16px}
    .wpmn-sec-before-after-slider .ba-after .ba-tag{right:16px}
    .wpmn-sec-before-after-slider .ba-handle{position:absolute;top:0;bottom:0;left:50%;width:3px;background:var(--color-surface-primary);cursor:ew-resize;transform:translateX(-50%)}
    .wpmn-sec-before-after-slider .ba-knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:var(--color-surface-primary);border:1.5px solid var(--color-border-primary);box-shadow:var(--shadow-hard-400);display:flex;align-items:center;justify-content:center;color:var(--color-text-primary);pointer-events:none}
    @media(max-width:1199px){.wpmn-sec-before-after-slider .ba-c{padding:0 40px}}
    @media(max-width:768px){.wpmn-sec-before-after-slider{padding:64px 0}.wpmn-sec-before-after-slider .ba-c{padding:0 20px}}
  </style>
  <div class="ba-c">
    <h2 class="ba-heading">Before and after</h2>
    <p class="ba-sub">Drag the handle to compare. Swap the two panels for real screenshots.</p>
    <div class="ba-frame">
      <div class="ba-side ba-before"><span class="ba-tag">Before</span>Old design</div>
      <div class="ba-side ba-after"><span class="ba-tag">After</span>New design</div>
      <div class="ba-handle"><div class="ba-knob"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 6l-4 6 4 6M15 6l4 6-4 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
    </div>
  </div>
  <script>
    (function(){
      var s=document.currentScript?document.currentScript.parentElement:document.querySelector('.wpmn-sec-before-after-slider');if(!s)return;
      var frame=s.querySelector('.ba-frame'),after=s.querySelector('.ba-after'),handle=s.querySelector('.ba-handle'),drag=false;
      function setPos(clientX){
        var r=frame.getBoundingClientRect();
        var p=Math.min(Math.max((clientX-r.left)/r.width,0.05),0.95)*100;
        after.style.clipPath='inset(0 0 0 '+p+'%)';
        handle.style.left=p+'%';
      }
      frame.addEventListener('pointerdown',function(e){drag=true;frame.setPointerCapture(e.pointerId);setPos(e.clientX)});
      frame.addEventListener('pointermove',function(e){if(drag)setPos(e.clientX)});
      frame.addEventListener('pointerup',function(){drag=false});
      frame.addEventListener('pointercancel',function(){drag=false});
    })();
  </script>
</section>
