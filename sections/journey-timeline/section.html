<!-- WPMN Section: Journey Timeline — a sticky stage pinned over a long runway: as you scroll, a horizontal track of year slides scrubs sideways, a centered photo card crossfades through five images, a giant faint "Journey" word sits behind, and a bottom timeline marker grows across the years. HTML import: the scroll-linked scrub engine (pin progress, track translate, per-fifth image crossfade, marker width, appear-on-enter, scroll + rAF drive, __sectionUpdate hook) is kept verbatim and re-scoped; the brand font is replaced with the base family, colors are tokenized, and images are verified Unsplash (content swapped on use). Classes are aj-prefixed so host/demo rules can't leak in. -->
<section class="wpmn-sec-journey-timeline">
  <style>
    .wpmn-sec-journey-timeline{
      background:var(--color-surface-primary);color:var(--color-text-primary);
      font-family:var(--font-family-base);
      --aj-line:color-mix(in srgb, var(--color-text-primary) 14%, transparent);
      --aj-ease:cubic-bezier(0.21,0.61,0.35,1);
      --aj-stage-h:780px;
    }
    .wpmn-sec-journey-timeline *{box-sizing:border-box;margin:0}
    .wpmn-sec-journey-timeline .aj-section{position:relative;height:calc(var(--aj-stage-h) + 2914px)}
    .wpmn-sec-journey-timeline .aj-stage{position:sticky;top:max(0px, 50vh - 390px);height:var(--aj-stage-h);overflow:hidden;background:var(--color-surface-primary)}

    .wpmn-sec-journey-timeline .aj-journey{position:absolute;left:0;right:0;top:6%;text-align:center;white-space:nowrap;pointer-events:none;z-index:0;font-size:var(--font-size-h1);font-weight:var(--font-weight-medium);font-style:italic;line-height:1;color:color-mix(in srgb, var(--color-text-primary) 10%, transparent);transform:scale(4);transform-origin:top center}

    .wpmn-sec-journey-timeline .aj-trackwrap{position:absolute;inset:0;display:flex;align-items:center;z-index:1}
    .wpmn-sec-journey-timeline .aj-track{display:flex;align-items:center;gap:38vw;padding:0 80px;will-change:transform}
    .wpmn-sec-journey-timeline .aj-lead{flex:0 0 auto;width:calc(100vw - 160px)}
    .wpmn-sec-journey-timeline .aj-tail{flex:0 0 auto;width:45vw}
    .wpmn-sec-journey-timeline .aj-slide{display:flex;flex-direction:column;gap:18px;width:480px;flex:0 0 480px}
    .wpmn-sec-journey-timeline .aj-slabel{display:flex;align-items:center;gap:10px}
    .wpmn-sec-journey-timeline .aj-slabel i{width:8px;height:8px;background:var(--color-text-primary);display:block}
    .wpmn-sec-journey-timeline .aj-slabel span{font-size:var(--font-size-body-small);font-weight:var(--font-weight-medium);letter-spacing:.05em;text-transform:uppercase}
    .wpmn-sec-journey-timeline .aj-slide h3{font-size:var(--font-size-h4);font-weight:var(--font-weight-medium);letter-spacing:-.03em;line-height:1.2;color:var(--color-text-primary)}
    .wpmn-sec-journey-timeline .aj-slide p{font-size:var(--font-size-body-base);font-weight:var(--font-weight-regular);letter-spacing:-.01em;line-height:1.65;color:var(--color-text-secondary)}

    .wpmn-sec-journey-timeline .aj-photo{position:absolute;left:50%;top:16%;transform:translateX(-50%);width:380px;height:501px;border-radius:var(--radius-lg);overflow:hidden;z-index:2;background:var(--color-surface-secondary)}
    .wpmn-sec-journey-timeline .aj-img{position:absolute;inset:0;background-size:cover;background-position:50% 50%;opacity:0;transition:opacity 700ms var(--aj-ease)}
    .wpmn-sec-journey-timeline .aj-img.aj-on{opacity:1}

    .wpmn-sec-journey-timeline .aj-timeline{position:absolute;left:0;right:0;bottom:48px;padding:0 80px;z-index:3}
    .wpmn-sec-journey-timeline .aj-years{display:flex;justify-content:space-between;margin-bottom:14px}
    .wpmn-sec-journey-timeline .aj-years span{font-size:var(--font-size-body-base)}
    .wpmn-sec-journey-timeline .aj-lineel{position:relative;height:1px;background:var(--aj-line)}
    .wpmn-sec-journey-timeline .aj-marker{position:absolute;left:0;top:-1px;height:2px;width:1.5%;background:var(--color-text-primary)}

    .wpmn-sec-journey-timeline .aj-appear{opacity:0;transform:translateY(24px);transition:opacity 700ms var(--aj-ease),transform 700ms var(--aj-ease)}
    .wpmn-sec-journey-timeline .aj-stage.aj-in .aj-appear{opacity:1;transform:translateY(0)}
    .wpmn-sec-journey-timeline .aj-stage.aj-in .aj-photo.aj-appear{transform:translateX(-50%) translateY(0)}
    .wpmn-sec-journey-timeline .aj-photo.aj-appear{transform:translateX(-50%) translateY(24px)}
    .wpmn-sec-journey-timeline .aj-appear.aj-d1{transition-delay:.28s}
    .wpmn-sec-journey-timeline .aj-appear.aj-d2{transition-delay:.56s}

    @media (max-width:809px){
      .wpmn-sec-journey-timeline{--aj-stage-h:640px}
      .wpmn-sec-journey-timeline .aj-section{height:calc(var(--aj-stage-h) + 2000px)}
      .wpmn-sec-journey-timeline .aj-journey{transform:scale(2.4);transform-origin:top center}
      .wpmn-sec-journey-timeline .aj-photo{width:62vw;height:82vw}
      .wpmn-sec-journey-timeline .aj-track{padding:0 20px}
      .wpmn-sec-journey-timeline .aj-slide{width:78vw;flex:0 0 78vw}
      .wpmn-sec-journey-timeline .aj-timeline{padding:0 20px;bottom:28px}
    }
    @media (prefers-reduced-motion:reduce){
      .wpmn-sec-journey-timeline .aj-appear{opacity:1;transform:none;transition:none}
      .wpmn-sec-journey-timeline .aj-photo.aj-appear{transform:translateX(-50%)}
      .wpmn-sec-journey-timeline .aj-img{transition:none}
    }
  </style>

  <div class="aj-section">
    <div class="aj-stage">
      <div class="aj-journey">Journey</div>
      <div class="aj-trackwrap aj-appear aj-d2">
        <div class="aj-track"><div class="aj-lead"></div><div class="aj-tail"></div></div>
      </div>
      <div class="aj-photo aj-appear aj-d1"></div>
      <div class="aj-timeline aj-appear aj-d2">
        <div class="aj-years"></div>
        <div class="aj-lineel"><div class="aj-marker"></div></div>
      </div>
    </div>
  </div>

  <script>
  (function(){
    var sec = document.currentScript.parentElement;
    var SLIDES = [
      {year:'1996',img:'photo-1522202176988-66273c2fd55f',h:'A conversation, not a valuation',p:'We start with what you actually want from the move, the street, the light, the school run. No guesswork, no number pulled out of the air.'},
      {year:'2001',img:'photo-1517180102446-f3ece451e9d8',h:'We read the street before the survey',p:'Every shortlist starts on the pavement at the hour you would come home. Traffic, light and noise never survive a photograph, so we go and stand in it.'},
      {year:'2008',img:'photo-1497366216548-37526070297c',h:'Evidence on the table before an offer',p:'Comparables, survey findings and chain risk are argued through before a number is. It is the only way to hold that number when the pressure arrives.'},
      {year:'2018',img:'photo-1486312338219-ce68d2c6f44d',h:'The hard thing, said early',p:'If a house is wrong you hear it from us before you hear it from a surveyor, even when saying so costs us the fee. Fewer sales, better ones.'},
      {year:'2025',img:'photo-1506905925346-21bda4d32df4',h:'Chased all the way to the keys',p:'Solicitors, lenders and the chain are chased daily, and you get one short written update every week until the day you are handed the keys.'}
    ];
    var section = sec.querySelector('.aj-section');
    var stage = sec.querySelector('.aj-stage');
    var track = sec.querySelector('.aj-track');
    var photo = sec.querySelector('.aj-photo');
    var years = sec.querySelector('.aj-years');
    var marker = sec.querySelector('.aj-marker');
    var tail = track.querySelector('.aj-tail');
    SLIDES.forEach(function(s){
      var el = document.createElement('div'); el.className = 'aj-slide';
      el.innerHTML = '<div class="aj-slabel"><i></i><span>' + s.year + '</span></div><h3>' + s.h + '</h3><p>' + s.p + '</p>';
      track.insertBefore(el, tail);
      var layer = document.createElement('div'); layer.className = 'aj-img';
      layer.style.backgroundImage = 'url("https://images.unsplash.com/' + s.img + '?auto=format&fit=crop&w=760&q=80")';
      photo.appendChild(layer);
      var y = document.createElement('span'); y.textContent = s.year; years.appendChild(y);
    });
    var layers = [].slice.call(photo.children);
    layers[0].classList.add('aj-on');

    function clamp01(x){ return Math.max(0, Math.min(1, x)); }
    function stageH(){ return stage.offsetHeight; }
    function update(){
      var vh = window.innerHeight;
      var pinStart = Math.max(0, vh/2 - stageH()/2);
      var rect = section.getBoundingClientRect();
      var pinLen = section.offsetHeight - stageH();
      var p = clamp01((pinStart - rect.top) / pinLen);
      var travel = track.scrollWidth - stage.clientWidth;
      track.style.transform = 'translate3d(' + (-p * travel).toFixed(2) + 'px, 0, 0)';
      var idx = Math.min(SLIDES.length - 1, Math.floor(p * SLIDES.length));
      layers.forEach(function(l,i){ l.classList.toggle('aj-on', i === idx); });
      marker.style.width = Math.max(1.5, p * 100).toFixed(2) + '%';
      if(rect.top < vh * 0.75 && !stage.classList.contains('aj-in')) stage.classList.add('aj-in');
    }
    window.addEventListener('scroll', update, {passive:true});
    window.addEventListener('resize', update);
    (function frame(){ update(); requestAnimationFrame(frame); })();
    window.__sectionUpdate = update;
    update();
  })();
  </script>
</section>
