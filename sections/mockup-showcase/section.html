<!-- WPMN Section: Mockup Showcase — browser-framed screenshot per guideline rules -->
<section class="wpmn-sec-mockup-showcase">
  <style>
    .wpmn-sec-mockup-showcase{padding:96px 0;background:var(--color-surface-primary);font-family:var(--font-family-base)}
    .wpmn-sec-mockup-showcase .ms-c{max-width:1200px;margin:0 auto;text-align:center}
    .wpmn-sec-mockup-showcase .ms-badge{display:inline-flex;align-items:center;gap:8px;font-size:var(--font-size-body-label);font-weight:var(--font-weight-medium);letter-spacing:.08em;text-transform:uppercase;color:var(--btn-bg-enable);margin-bottom:12px}
    .wpmn-sec-mockup-showcase .ms-badge::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--btn-bg-enable)}
    .wpmn-sec-mockup-showcase .ms-heading{max-width:800px;margin:0 auto;font-size:var(--font-size-h2);line-height:var(--font-lh-h2);font-weight:var(--font-weight-semibold);color:var(--color-text-primary)}
    .wpmn-sec-mockup-showcase .ms-stage{margin-top:48px;padding:64px;border-radius:var(--radius-lg);background:var(--color-surface-secondary)}
    .wpmn-sec-mockup-showcase .ms-browser{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--color-border-primary);box-shadow:var(--shadow-soft-500);background:var(--color-surface-primary);text-align:left}
    .wpmn-sec-mockup-showcase .ms-chrome{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--color-border-primary)}
    .wpmn-sec-mockup-showcase .ms-dot{width:10px;height:10px;border-radius:50%;background:var(--color-border-primary)}
    .wpmn-sec-mockup-showcase .ms-url{flex:1;max-width:320px;margin-left:8px;height:24px;border-radius:6px;background:color-mix(in srgb,var(--color-text-primary) 5%,transparent);display:flex;align-items:center;padding:0 12px;font-size:11px;color:var(--color-text-secondary)}
    .wpmn-sec-mockup-showcase .ms-body{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:var(--color-text-secondary);font-size:var(--font-size-body-medium)}
    @media(max-width:1199px){.wpmn-sec-mockup-showcase .ms-c{padding:0 40px}}
    @media(max-width:768px){.wpmn-sec-mockup-showcase{padding:64px 0}.wpmn-sec-mockup-showcase .ms-c{padding:0 20px}.wpmn-sec-mockup-showcase .ms-stage{padding:20px}}
  </style>
  <div class="ms-c">
    <span class="ms-badge">Product</span>
    <h2 class="ms-heading">See the dashboard up close</h2>
    <div class="ms-stage">
      <div class="ms-browser">
        <div class="ms-chrome"><span class="ms-dot"></span><span class="ms-dot"></span><span class="ms-dot"></span><span class="ms-url">app.yoursite.com/dashboard</span></div>
        <div class="ms-body">Product screenshot goes here (16:9)</div>
      </div>
    </div>
  </div>
</section>
