<!-- WPMN Section: CTA Impact Banner — high-contrast dark block, single main action -->
<section class="wpmn-sec-cta-banner">
  <style>
    .wpmn-sec-cta-banner { padding: 96px 0; background: var(--color-surface-primary); font-family: var(--font-family-base); }
    .wpmn-sec-cta-banner .cb-container { max-width: 1200px; margin: 0 auto; }
    .wpmn-sec-cta-banner .cb-panel { background: var(--color-surface-secondary); border-radius: var(--radius-lg); padding: 96px 48px; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .wpmn-sec-cta-banner .cb-heading { max-width: 800px; margin: 0; font-size: var(--font-size-h2); line-height: var(--font-lh-h2); font-weight: var(--font-weight-semibold); color: var(--color-text-primary-invert); }
    .wpmn-sec-cta-banner .cb-subtext { max-width: 800px; margin: 16px 0 0; font-size: var(--font-size-body-large); line-height: var(--font-lh-body-large); color: var(--color-text-secondary-invert); }
    .wpmn-sec-cta-banner .cb-ctas { display: flex; gap: 16px; margin-top: 32px; flex-wrap: wrap; justify-content: center; }
    .wpmn-sec-cta-banner .cb-btn { display: inline-flex; align-items: center; justify-content: center; height: 56px; padding: 0 32px; border-radius: var(--radius-xsm); font-size: var(--font-size-btn-lg); line-height: var(--font-lh-btn-lg); font-weight: var(--font-weight-semibold); font-family: inherit; text-decoration: none; cursor: pointer; transition: background-color 120ms ease, color 120ms ease; border: 1.5px solid transparent; }
    .wpmn-sec-cta-banner .cb-btn--primary { background: var(--btn-bg-enable); color: var(--color-text-primary-invert); box-shadow: inset 3px 4px 4px 0 rgba(255,255,255,0.3); }
    .wpmn-sec-cta-banner .cb-btn--primary:hover { background: var(--btn-bg-hovered); }
    .wpmn-sec-cta-banner .cb-btn--ghost { background: transparent; color: var(--color-text-primary-invert); border-color: var(--color-border-primary-invert); }
    .wpmn-sec-cta-banner .cb-btn--ghost:hover { border-color: var(--color-text-primary-invert); }
    .wpmn-sec-cta-banner .cb-note { margin: 20px 0 0; font-size: var(--font-size-body-small); line-height: var(--font-lh-body-small); color: var(--color-text-secondary-invert); }
    @media (max-width: 1199px) { .wpmn-sec-cta-banner .cb-container { padding: 0 40px; } }
    @media (max-width: 768px) {
      .wpmn-sec-cta-banner { padding: 64px 0; }
      .wpmn-sec-cta-banner .cb-container { padding: 0 20px; }
      .wpmn-sec-cta-banner .cb-panel { padding: 64px 24px; }
    }
  </style>
  <div class="cb-container">
    <div class="cb-panel">
      <h2 class="cb-heading">Ready to grow your business?</h2>
      <p class="cb-subtext">Join 300,000+ websites already using our plugins. Set up in under five minutes.</p>
      <div class="cb-ctas">
        <a class="cb-btn cb-btn--primary" href="#">Get Started Now</a>
        <a class="cb-btn cb-btn--ghost" href="#">Talk to Sales</a>
      </div>
      <p class="cb-note">14-day money-back guarantee. No questions asked.</p>
    </div>
  </div>
</section>
