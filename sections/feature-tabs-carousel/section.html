<!-- WPMN Section: Feature Tabs Carousel — auto-advancing tabbed panel, expanding pills, drifting gradient (imported, tokenized) -->
<section class="wpmn-sec-feature-tabs-carousel">
  <style>
@keyframes wpmn-ftc-bg-drift {
  from { background-position: 0% 100%, 100% 0%, 50% 50%, 0% 0%; }
  to   { background-position: 30% 60%, 70% 30%, 40% 70%, 100% 100%; }
}
    .wpmn-sec-feature-tabs-carousel{background:var(--color-surface-primary);color:var(--color-text-primary);font-family:var(--font-family-base);padding:96px 20px;--ftc-a:color-mix(in srgb,var(--btn-bg-enable) 30%,var(--color-surface-primary));--ftc-b:color-mix(in srgb,var(--btn-bg-enable) 14%,var(--color-surface-primary));--ftc-c:color-mix(in srgb,var(--btn-bg-enable) 22%,var(--color-surface-primary))}
    .wpmn-sec-feature-tabs-carousel .ftc{width:min(1120px,100%);margin:0 auto;position:relative}
    .wpmn-sec-feature-tabs-carousel .panel{position:relative;height:560px;border-radius:var(--radius-md);overflow:clip}
    .wpmn-sec-feature-tabs-carousel .bg{position:absolute;inset:0;z-index:0;border-radius:var(--radius-md);overflow:hidden;background:radial-gradient(90% 110% at 18% 78%,var(--ftc-a) 0%,transparent 60%),radial-gradient(80% 100% at 85% 10%,var(--ftc-b) 0%,transparent 55%),radial-gradient(70% 90% at 60% 60%,var(--ftc-c) 0%,transparent 70%),linear-gradient(120deg,var(--ftc-b) 0%,var(--ftc-c) 45%,var(--ftc-a) 100%);background-size:160% 160%;animation:wpmn-ftc-bg-drift 16s ease-in-out infinite alternate}
    .wpmn-sec-feature-tabs-carousel .notch{position:absolute;top:0;left:0;z-index:2;background:var(--color-surface-primary);border-radius:0 0 var(--radius-md) 0;padding:0 16px 8px 0}
    .wpmn-sec-feature-tabs-carousel .notch::before,.wpmn-sec-feature-tabs-carousel .notch::after{content:"";position:absolute;width:16px;height:16px;background:radial-gradient(circle at 100% 100%,transparent 16px,var(--color-surface-primary) 16px)}
    .wpmn-sec-feature-tabs-carousel .notch::before{top:0;right:-16px}
    .wpmn-sec-feature-tabs-carousel .notch::after{bottom:-16px;left:0}
    .wpmn-sec-feature-tabs-carousel .strip{display:flex;gap:8px}
    .wpmn-sec-feature-tabs-carousel .pill{display:flex;align-items:center;padding:12px;background:color-mix(in srgb,var(--color-text-primary) 4%,var(--color-surface-primary));border:none;border-radius:var(--radius-xsm);font-family:var(--font-family-base);font-size:var(--font-size-body-base);line-height:1;color:var(--color-text-secondary);cursor:pointer;transition:color .4s ease;white-space:nowrap}
    .wpmn-sec-feature-tabs-carousel .pill .label{display:inline-block;max-width:0;opacity:0;overflow:hidden;padding-left:0;transition:max-width .4s ease,opacity .4s ease,padding-left .4s ease}
    .wpmn-sec-feature-tabs-carousel .pill.is-active{color:var(--color-text-primary)}
    .wpmn-sec-feature-tabs-carousel .pill.is-active .label{max-width:180px;opacity:1;padding-left:20px}
    .wpmn-sec-feature-tabs-carousel .slide{position:relative;z-index:1;height:100%;padding:80px 40px 40px;display:flex;flex-direction:column;justify-content:space-between;max-width:516px}
    .wpmn-sec-feature-tabs-carousel .eyebrow{display:flex;align-items:center;gap:8px;font-size:var(--font-size-body-base);line-height:var(--font-lh-body-base);color:var(--color-text-primary)}
    .wpmn-sec-feature-tabs-carousel .eyebrow svg{width:24px;height:24px;color:var(--color-text-primary)}
    .wpmn-sec-feature-tabs-carousel .eyebrow span{transition:opacity .4s ease}
    .wpmn-sec-feature-tabs-carousel .eyebrow.is-switching span{opacity:0}
    .wpmn-sec-feature-tabs-carousel .heading{font-size:var(--font-size-h3);line-height:var(--font-lh-h3);font-weight:var(--font-weight-semibold);letter-spacing:-0.01em;color:var(--color-text-primary);margin-top:18px}
    .wpmn-sec-feature-tabs-carousel .copy{font-size:var(--font-size-body-base);line-height:var(--font-lh-body-base);color:var(--color-text-primary);max-width:476px;margin-top:16px}
    .wpmn-sec-feature-tabs-carousel .cta{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;margin-top:32px;padding:10px 16px;background:color-mix(in srgb,var(--color-surface-primary) 24%,transparent);border-radius:var(--radius-xsm);box-shadow:inset 0 0 10.4px 0 color-mix(in srgb,var(--color-surface-primary) 80%,transparent),0 2px 10px 0 color-mix(in srgb,var(--color-text-primary) 8%,transparent);font-size:var(--font-size-btn-md);line-height:var(--font-lh-btn-md);font-weight:var(--font-weight-medium);color:var(--color-text-primary);text-decoration:none;transition:background .3s ease}
    .wpmn-sec-feature-tabs-carousel .cta:hover{background:color-mix(in srgb,var(--color-surface-primary) 40%,transparent)}
    .wpmn-sec-feature-tabs-carousel .cta svg{display:block;color:var(--color-text-secondary)}
    .wpmn-sec-feature-tabs-carousel .feats{margin-top:auto;display:flex;flex-direction:column;gap:8px}
    .wpmn-sec-feature-tabs-carousel .feat{display:flex;align-items:center;gap:8px;font-size:var(--font-size-body-base);line-height:var(--font-lh-body-base);color:var(--color-text-primary)}
    .wpmn-sec-feature-tabs-carousel .feat svg{width:24px;height:24px;color:var(--color-text-primary)}
    .wpmn-sec-feature-tabs-carousel .shots{position:absolute;top:80px;left:49.6%;width:1100px;height:659px;z-index:1;pointer-events:none}
    .wpmn-sec-feature-tabs-carousel .shot{position:absolute;inset:0;width:100%;border-radius:var(--radius-sm);border:1px solid color-mix(in srgb,var(--color-text-primary) 6%,transparent);box-shadow:var(--shadow-soft-500);opacity:0;transform:translateY(12px);transition:opacity .7s ease .05s,transform .7s ease .05s;object-fit:cover}
    .wpmn-sec-feature-tabs-carousel .shot.is-active{opacity:1;transform:translateY(0)}
    @media(max-width:1099px){
      .wpmn-sec-feature-tabs-carousel .panel{height:auto;min-height:560px}
      .wpmn-sec-feature-tabs-carousel .slide{max-width:100%;padding-bottom:56%}
      .wpmn-sec-feature-tabs-carousel .shots{top:auto;bottom:-10%;left:10%;width:100%;height:auto}
      .wpmn-sec-feature-tabs-carousel .shot{position:absolute;height:auto}
      .wpmn-sec-feature-tabs-carousel .feats{margin-top:40px}
    }
    @media(max-width:639px){
      .wpmn-sec-feature-tabs-carousel{padding:64px 20px}
      .wpmn-sec-feature-tabs-carousel .pill.is-active .label{max-width:120px;padding-left:12px}
    }
    @media(prefers-reduced-motion:reduce){
      .wpmn-sec-feature-tabs-carousel .bg{animation:none}
      .wpmn-sec-feature-tabs-carousel .pill,.wpmn-sec-feature-tabs-carousel .pill .label,.wpmn-sec-feature-tabs-carousel .shot,.wpmn-sec-feature-tabs-carousel .eyebrow span,.wpmn-sec-feature-tabs-carousel .cta{transition:none}
    }
  </style>
  <div class="ftc">
    <div class="panel">
      <div class="bg" aria-hidden="true"></div>
      <div class="notch">
        <div class="strip" role="tablist" aria-label="Product features">
          <button class="pill is-active" role="tab" aria-selected="true" data-tab="0"><span class="num">01</span><span class="label">Form Builder</span></button>
          <button class="pill" role="tab" aria-selected="false" data-tab="1"><span class="num">02</span><span class="label">Email Automation</span></button>
          <button class="pill" role="tab" aria-selected="false" data-tab="2"><span class="num">03</span><span class="label">Helpdesk</span></button>
        </div>
      </div>
      <div class="slide">
        <div>
          <div class="eyebrow">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/><path d="M8.5 12.5 11 15l4.5-5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="eyebrow-text">Forms</span>
          </div>
          <h2 class="heading">Natural Drag &amp; Drop Building</h2>
          <p class="copy">Build any form with a visual editor that supports every field type, not just the basics. Conditional logic, multi-step flows, and payments handled out of the box.</p>
          <a class="cta" href="#" onclick="return false">
            Get Started
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7h10m0 0L8.5 3.5M12 7l-3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </div>
        <div class="feats">
          <div class="feat"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="14" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M8 10h8M8 14h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Conditional Logic</div>
          <div class="feat"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>30+ Integrations</div>
        </div>
      </div>
      <div class="shots" aria-hidden="true">
        <img class="shot is-active" src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1400&q=80" alt="" loading="eager">
        <img class="shot" src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=1400&q=80" alt="" loading="lazy">
        <img class="shot" src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1400&q=80" alt="" loading="lazy">
      </div>
    </div>
  </div>
  <script>
    // Imported as-is, scoped: auto-advance every 6s, pause on hover, cycle only
    // while on screen (IntersectionObserver), pill labels expand, shots crossfade.
    (function () {
      var sec = document.currentScript ? document.currentScript.parentElement : document.querySelector('.wpmn-sec-feature-tabs-carousel');
      if (!sec) return;

      var EYEBROWS = ['Forms', 'Email Automation', 'Helpdesk'];
      var pills = Array.prototype.slice.call(sec.querySelectorAll('.pill'));
      var shots = Array.prototype.slice.call(sec.querySelectorAll('.shot'));
      var eyebrowWrap = sec.querySelector('.eyebrow');
      var eyebrowText = sec.querySelector('.eyebrow-text');
      var panel = sec.querySelector('.panel');
      var ADVANCE = 6000;
      var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

      var current = 0;
      var timer = null;

      function setTab(i, fromUser) {
        if (i === current) return;
        current = i;
        pills.forEach(function (p, j) {
          p.classList.toggle('is-active', j === i);
          p.setAttribute('aria-selected', j === i ? 'true' : 'false');
        });
        shots.forEach(function (s, j) { s.classList.toggle('is-active', j === i); });
        eyebrowWrap.classList.add('is-switching');
        setTimeout(function () {
          eyebrowText.textContent = EYEBROWS[i];
          eyebrowWrap.classList.remove('is-switching');
        }, 200);
        if (fromUser) restartTimer();
      }

      function restartTimer() {
        clearInterval(timer);
        if (reduced) return;
        timer = setInterval(function () { setTab((current + 1) % pills.length); }, ADVANCE);
      }

      pills.forEach(function (p, i) { p.addEventListener('click', function () { setTab(i, true); }); });

      panel.addEventListener('mouseenter', function () { clearInterval(timer); });
      panel.addEventListener('mouseleave', restartTimer);

      if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (entries) {
          if (entries[0].isIntersecting) restartTimer();
          else clearInterval(timer);
        }, { threshold: 0.3 });
        io.observe(panel);
      }
      restartTimer();
    })();
  </script>
</section>
