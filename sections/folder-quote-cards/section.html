<!-- WPMN Section: Folder Quote Cards — folder-tab outlines, scanline art, damped entrance (imported, tokenized) -->
<section class="wpmn-sec-folder-quote-cards">
  <style>
    .wpmn-sec-folder-quote-cards{background:var(--color-surface-primary);color:var(--color-text-primary);font-family:var(--font-family-base);padding:var(--primitive-space-96) var(--primitive-space-32)}
    .wpmn-sec-folder-quote-cards .fqc-wrap{max-width:1200px;margin:0 auto;display:grid;gap:var(--primitive-space-64)}
    .wpmn-sec-folder-quote-cards .fqc-header{max-width:820px;display:grid;gap:var(--primitive-space-8)}
    .wpmn-sec-folder-quote-cards .kicker{display:flex;align-items:center;gap:var(--primitive-space-8);margin-bottom:var(--primitive-space-16)}
    .wpmn-sec-folder-quote-cards .kicker svg rect{fill:var(--btn-bg-enable)}
    .wpmn-sec-folder-quote-cards .kicker h3{font-size:var(--font-size-body-base);line-height:var(--font-lh-body-base);font-weight:var(--font-weight-medium);color:var(--color-text-secondary);margin:0}
    .wpmn-sec-folder-quote-cards .fqc-header h2{font-size:var(--font-size-h2);line-height:var(--font-lh-h2);font-weight:var(--font-weight-regular);letter-spacing:-0.01em;color:var(--color-text-primary);margin:0 0 var(--primitive-space-8)}
    .wpmn-sec-folder-quote-cards .fqc-header h2 em{font-style:normal;font-weight:var(--font-weight-semibold)}
    .wpmn-sec-folder-quote-cards .fqc-header .sub{font-size:var(--font-size-body-base);line-height:var(--font-lh-body-base);color:var(--color-text-secondary);max-width:560px;margin:0}
    .wpmn-sec-folder-quote-cards .fqc-cards{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--primitive-space-16)}
    .wpmn-sec-folder-quote-cards .card-anim{will-change:transform,opacity}
    .wpmn-sec-folder-quote-cards .card{position:relative;isolation:isolate;display:flex;flex-direction:column;gap:var(--primitive-space-16);padding:var(--primitive-space-20);height:100%;border-radius:var(--radius-xsm)}
    .wpmn-sec-folder-quote-cards .card > svg.tab-outline{position:absolute;inset:0;width:100%;height:100%;z-index:-1;display:block}
    .wpmn-sec-folder-quote-cards .tab-outline .tab-fill{fill:var(--color-surface-primary)}
    .wpmn-sec-folder-quote-cards .tab-outline .tab-stroke{stroke:color-mix(in srgb,var(--color-text-primary) 20%,transparent)}
    .wpmn-sec-folder-quote-cards .card h3{font-size:var(--font-size-h5);line-height:var(--font-lh-h5);font-weight:var(--font-weight-semibold);color:var(--color-text-primary);margin:0}
    .wpmn-sec-folder-quote-cards .dotted{border-top:1px dotted color-mix(in srgb,var(--color-text-primary) 40%,transparent);height:1px}
    .wpmn-sec-folder-quote-cards .art{height:240px;border-radius:var(--radius-xsm);overflow:hidden;background:var(--color-surface-primary)}
    .wpmn-sec-folder-quote-cards .art canvas{display:block;width:100%;height:100%}
    .wpmn-sec-folder-quote-cards .card-body{flex:1;display:flex;flex-direction:column;gap:var(--primitive-space-16)}
    .wpmn-sec-folder-quote-cards .quote{font-size:var(--font-size-body-base);line-height:var(--font-lh-body-base);color:var(--color-text-secondary);margin:0}
    .wpmn-sec-folder-quote-cards .card footer{margin-top:auto;display:grid;grid-template-columns:auto 1px auto 1fr;gap:var(--primitive-space-8);align-items:center;height:40px}
    .wpmn-sec-folder-quote-cards .card footer .role,.wpmn-sec-folder-quote-cards .card footer .org{font-size:var(--font-size-body-small);line-height:var(--font-lh-body-small);margin:0}
    .wpmn-sec-folder-quote-cards .card footer .role{font-weight:var(--font-weight-medium);color:var(--color-text-primary)}
    .wpmn-sec-folder-quote-cards .card footer .org{color:var(--color-text-secondary)}
    .wpmn-sec-folder-quote-cards .card footer .vline{width:1px;height:21px;background:color-mix(in srgb,var(--color-text-primary) 40%,transparent)}
    .wpmn-sec-folder-quote-cards .arrow-btn{justify-self:end;position:relative;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;color:var(--color-text-primary);overflow:hidden;transition:color .2s ease,transform .2s cubic-bezier(.2,.8,.2,1)}
    .wpmn-sec-folder-quote-cards .arrow-btn:hover{transform:scale(1.05)}
    .wpmn-sec-folder-quote-cards .arrow-btn:active{transform:scale(0.96)}
    .wpmn-sec-folder-quote-cards .arrow-btn .pill,.wpmn-sec-folder-quote-cards .arrow-btn .fill{position:absolute;inset:0}
    .wpmn-sec-folder-quote-cards .arrow-btn .pill path{stroke:color-mix(in srgb,var(--color-text-primary) 20%,transparent)}
    .wpmn-sec-folder-quote-cards .arrow-btn .fill{opacity:.05;transform:translateX(-56px);transition:transform .26s cubic-bezier(.22,1,.36,1)}
    .wpmn-sec-folder-quote-cards .arrow-btn:hover .fill{transform:translateX(0)}
    .wpmn-sec-folder-quote-cards .arrow-btn .arr{position:relative;z-index:1;display:flex}
    @media(max-width:920px){
      .wpmn-sec-folder-quote-cards{padding:var(--primitive-space-64) var(--primitive-space-20)}
      .wpmn-sec-folder-quote-cards .fqc-wrap{gap:var(--primitive-space-48)}
            .wpmn-sec-folder-quote-cards .fqc-cards{grid-auto-flow:row;grid-auto-columns:unset}
    }
    @media(prefers-reduced-motion:reduce){
      .wpmn-sec-folder-quote-cards .arrow-btn,.wpmn-sec-folder-quote-cards .arrow-btn .fill{transition:none}
    }
  </style>
  <div class="fqc-wrap">
    <header class="fqc-header">
      <div class="kicker">
        <svg width="14" height="7" viewBox="0 0 14 7" fill="none"><rect width="14" height="7" rx="1"/></svg>
        <h3>Stop settling for trade-offs.</h3>
      </div>
      <h2><em>Build, iterate and grow on WordPress,</em> without the platform tax</h2>
      <p class="sub">Compose your marketing stack with plugins that share one data layer and one design language.</p>
    </header>
    <div class="fqc-cards"></div>
  </div>
  <script>
    // Folder-tab quote cards (imported as-is, scoped): scanline dither canvas art,
    // notched arrow pill with slide-in fill, scroll-linked damped stagger entrance.
    (function () {
      var sec = document.currentScript ? document.currentScript.parentElement : document.querySelector('.wpmn-sec-folder-quote-cards');
      if (!sec) return;

      var CARDS = [
        { title: 'Production grade quality', glyph: '💎',
          quote: 'An agency replaced four separate SaaS tools with the Fluent suite and shipped client sites with the data model, permissions, and automations they would otherwise have rebuilt themselves.',
          role: 'VP of Engineering', org: 'W3 Studio' },
        { title: 'Automation for rapid iterations', glyph: '⚡',
          quote: 'A membership business compressed what would typically be weeks of migration work into something a single person could oversee in an afternoon.',
          role: 'Principal and Founder', org: 'Alternative Partners' },
        { title: 'Control without drag', glyph: '🔒',
          quote: 'A training company moved to self-hosted email and CRM with no vendor risk, no forced migration, and tooling costs reduced by more than 90%.',
          role: 'Operations Lead', org: 'AC&T Education' },
      ];

      /* folder-tab outline — geometry kept verbatim from reference (viewBox 0 0 443 494) */
      var TAB_OUTLINE =
        '<svg class="tab-outline" viewBox="0 0 443 494" fill="none" preserveAspectRatio="none">' +
          '<path class="tab-fill" d="M0 490V4a4 4 0 0 1 4-4h288.23c.932 0 1.856.163 2.731.48l60.814 22.09c.875.318 1.8.48 2.731.48H439a4 4 0 0 1 4 4V490a4 4 0 0 1-4 4H4a4 4 0 0 1-4-4"/>' +
          '<path class="tab-stroke" fill="none" d="M4 .5h288.23c.874 0 1.74.152 2.561.45l60.813 22.09c.931.338 1.912.51 2.902.51H439a3.5 3.5 0 0 1 3.5 3.5V490a3.5 3.5 0 0 1-3.5 3.5H4A3.5 3.5 0 0 1 .5 490V4A3.5 3.5 0 0 1 4 .5Z"/>' +
        '</svg>';

      var PILL_PATH = 'M4 .5h32a3.5 3.5 0 0 1 3.5 3.5v20.523a5.5 5.5 0 0 1-1.416 3.684l-8.547 9.477a5.5 5.5 0 0 1-4.084 1.816H4A3.5 3.5 0 0 1 .5 36V4A3.5 3.5 0 0 1 4 .5Z';
      var ARROW_BTN =
        '<a class="arrow-btn" href="#" onclick="return false" aria-label="Read case study">' +
          '<svg class="pill" width="40" height="40" viewBox="0 0 40 40" fill="none"><path d="' + PILL_PATH + '" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '<span class="fill"><svg width="40" height="40" viewBox="0 0 40 40"><path d="' + PILL_PATH + '" fill="currentColor"/></svg></span>' +
          '<span class="arr"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></svg></span>' +
        '</a>';

      var cardsEl = sec.querySelector('.fqc-cards');
      CARDS.forEach(function (c) {
        var wrap = document.createElement('div');
        wrap.className = 'card-anim';
        wrap.innerHTML =
          '<article class="card">' + TAB_OUTLINE +
            '<h3>' + c.title + '</h3>' +
            '<div class="dotted"></div>' +
            '<div class="art"><canvas></canvas></div>' +
            '<div class="dotted"></div>' +
            '<div class="card-body">' +
              '<p class="quote">' + c.quote + '</p>' +
              '<footer><p class="role">' + c.role + '</p><span class="vline"></span><p class="org">' + c.org + '</p>' + ARROW_BTN + '</footer>' +
            '</div>' +
          '</article>';
        cardsEl.appendChild(wrap);
      });

      /* Scanline dither renderer — fill color resolved from the brand token at runtime */
      function renderDither(canvas, glyph) {
        var W = canvas.clientWidth || 410, H = canvas.clientHeight || 240;
        var dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = W * dpr; canvas.height = H * dpr;
        var ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);

        var off = document.createElement('canvas');
        off.width = W; off.height = H;
        var octx = off.getContext('2d', { willReadFrequently: true });
        octx.font = (H * 0.78) + 'px serif';
        octx.textAlign = 'center'; octx.textBaseline = 'middle';
        octx.fillText(glyph, W / 2, H / 2 + H * 0.04);
        var px = octx.getImageData(0, 0, W, H).data;

        var seed = 13;
        var rnd = function () { return (seed = (seed * 16807) % 2147483647) / 2147483647; };

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = getComputedStyle(sec).getPropertyValue('--btn-bg-enable').trim() || getComputedStyle(sec).color;
        var step = 4;
        for (var y = 0; y < H; y += step) {
          var jitter = (rnd() - 0.5) * 3;
          var runStart = -1;
          for (var x = 0; x <= W; x++) {
            var a = x < W ? px[(y * W + x) * 4 + 3] : 0;
            var lum = x < W ? (px[(y * W + x) * 4] + px[(y * W + x) * 4 + 1] + px[(y * W + x) * 4 + 2]) / 765 : 1;
            var onPx = a > 60 && lum < 0.82;
            if (onPx && runStart < 0) runStart = x;
            if (!onPx && runStart >= 0) {
              var th = 1 + rnd() * 1.6;
              ctx.fillRect(runStart + jitter, y, x - runStart, th);
              runStart = -1;
            }
          }
        }
      }

      function renderAll() {
        sec.querySelectorAll('.art canvas').forEach(function (cv, i) {
          renderDither(cv, CARDS[i].glyph);
        });
      }
      requestAnimationFrame(renderAll);
      setTimeout(renderAll, 300); /* fallback: rAF can be dead in hidden docs */

      /* re-render art when brand or theme changes, so the token color follows */
      if ('MutationObserver' in window) {
        new MutationObserver(renderAll).observe(document.documentElement, {
          attributes: true, attributeFilter: ['data-brand', 'data-theme']
        });
      }

      /* Entrance: scroll-linked, staggered, damped (kept verbatim) */
      var clamp = function (v, a, b) { return Math.min(b, Math.max(a, v)); };
      var animEls = Array.prototype.slice.call(sec.querySelectorAll('.card-anim'));
      var state = animEls.map(function () { return 0; });
      var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

      function update() {
        if (reduced) {
          animEls.forEach(function (el) { el.style.transform = 'none'; el.style.opacity = 1; });
          return;
        }
        var r = cardsEl.getBoundingClientRect();
        var raw = clamp((innerHeight - r.top) / (innerHeight * 0.72), 0, 1.5);
        animEls.forEach(function (el, i) {
          var target = clamp(raw - i * 0.18, 0, 1);
          state[i] += (target - state[i]) * 0.14;
          var p = state[i] < 0.999 ? state[i] : 1;
          var e = 1 - Math.pow(1 - p, 2);
          el.style.transform = 'translateY(' + ((1 - e) * 200) + 'px) scale(' + (0.88 + 0.12 * e) + ')';
          el.style.opacity = e;
        });
      }

      addEventListener('scroll', update, { passive: true });
      addEventListener('resize', update);
      (function tick() { update(); requestAnimationFrame(tick); })();
      update();
    })();
  </script>
</section>
