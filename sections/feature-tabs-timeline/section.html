<!-- WPMN Section: Feature Tabs Timeline — three feature tabs, each driving a 5-step vertical timeline (dot + auto-filling track, 7s per step) that swaps a big tinted card with title, copy, two buttons, and a floating product mock. HTML import: the tab/step/auto-advance/fill/card-swap engine is kept verbatim and re-scoped; the brand font and hotlinked screenshots are replaced with the base family and a token-SVG skeleton mock (content swapped on use), no images and no third-party logos. Buttons use the button tokens at --radius-xsm. Classes are wsf-prefixed and keyframes wpmn-wsf-prefixed so host/demo rules can't leak in. -->
<section class="wpmn-sec-feature-tabs-timeline">
  <style>
@keyframes wpmn-wsf-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
@keyframes wpmn-wsf-fadeShot{from{opacity:0;transform:translateY(-50%) scale(.97)}to{opacity:1;transform:translateY(-50%) scale(1)}}
    .wpmn-sec-feature-tabs-timeline{
      background:var(--color-surface-primary);color:var(--color-text-primary);
      font-family:var(--font-family-base);
      --wsf-learn:color-mix(in srgb, var(--btn-bg-enable) 15%, var(--color-surface-primary));
      --wsf-line:color-mix(in srgb, var(--color-text-primary) 10%, transparent);
      --wsf-line2:color-mix(in srgb, var(--color-text-primary) 9%, transparent);
      --wsf-dotline:color-mix(in srgb, var(--color-text-primary) 22%, transparent);
      --wsf-sk:color-mix(in srgb, var(--color-text-primary) 8%, var(--color-surface-primary));
      --auto:7s;
    }
    .wpmn-sec-feature-tabs-timeline *{box-sizing:border-box;margin:0}
    .wpmn-sec-feature-tabs-timeline .wsf-wrap{max-width:1240px;margin:0 auto;padding:64px var(--primitive-space-24) 96px}
    .wpmn-sec-feature-tabs-timeline .wsf-head{text-align:center;margin-bottom:40px}
    .wpmn-sec-feature-tabs-timeline .wsf-head h2{font-size:var(--font-size-h2);line-height:var(--font-lh-h2);font-weight:var(--font-weight-semibold);letter-spacing:-.5px;color:var(--color-text-primary);max-width:820px;margin:0 auto 16px}
    .wpmn-sec-feature-tabs-timeline .wsf-head p{font-size:var(--font-size-body-medium);line-height:var(--font-lh-body-medium);color:var(--color-text-secondary);font-weight:var(--font-weight-regular)}

    .wpmn-sec-feature-tabs-timeline .wsf-tabs{display:flex;justify-content:center;gap:0;border-bottom:1px solid var(--wsf-line2);margin-bottom:48px}
    .wpmn-sec-feature-tabs-timeline .wsf-tab{flex:0 1 33%;max-width:380px;text-align:center;padding:16px 8px;background:none;border:0;cursor:pointer;font-family:inherit;font-size:var(--font-size-h5);line-height:var(--font-lh-h5);font-weight:var(--font-weight-semibold);color:var(--color-text-secondary);position:relative;transition:color .2s}
    .wpmn-sec-feature-tabs-timeline .wsf-tab.wsf-on{color:var(--btn-bg-enable)}
    .wpmn-sec-feature-tabs-timeline .wsf-tab.wsf-on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--btn-bg-enable);border-radius:999px}

    .wpmn-sec-feature-tabs-timeline .wsf-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:56px;align-items:stretch}
    .wpmn-sec-feature-tabs-timeline .wsf-card{position:relative;overflow:visible;background:var(--wsf-card, color-mix(in srgb, var(--btn-bg-enable) 10%, var(--color-surface-primary)));border-radius:var(--radius-lg);padding:56px 48px;display:flex;flex-direction:column;justify-content:center;min-height:520px}
    .wpmn-sec-feature-tabs-timeline .wsf-text{max-width:50%}
    .wpmn-sec-feature-tabs-timeline .wsf-card h3{font-size:var(--font-size-h3);line-height:var(--font-lh-h3);font-weight:var(--font-weight-semibold);color:var(--color-text-primary);margin-bottom:14px}
    .wpmn-sec-feature-tabs-timeline .wsf-card .wsf-desc{font-size:var(--font-size-body-base);line-height:var(--font-lh-body-base);color:var(--color-text-secondary);font-weight:var(--font-weight-regular);margin-bottom:28px}
    .wpmn-sec-feature-tabs-timeline .wsf-cta{display:flex;gap:14px;flex-wrap:wrap}
    .wpmn-sec-feature-tabs-timeline .wsf-btn{display:inline-flex;align-items:center;gap:var(--primitive-space-8);height:48px;padding:0 22px;border-radius:var(--radius-xsm);font-family:inherit;font-size:var(--font-size-body-base);line-height:var(--font-lh-body-base);font-weight:var(--font-weight-medium);text-decoration:none;cursor:pointer;border:0;transition:filter .2s,transform .05s}
    .wpmn-sec-feature-tabs-timeline .wsf-btn.wsf-pri{background:var(--btn-bg-enable);color:var(--color-text-primary-invert);box-shadow:inset 3px 4px 4px 0 var(--btn-bg-glow, rgba(255,255,255,0.3))}
    .wpmn-sec-feature-tabs-timeline .wsf-btn.wsf-pri svg{width:16px;height:16px;transition:transform .2s}
    .wpmn-sec-feature-tabs-timeline .wsf-btn.wsf-pri:hover{background:var(--btn-bg-hovered)}
    .wpmn-sec-feature-tabs-timeline .wsf-btn.wsf-pri:hover svg{transform:translateX(4px)}
    .wpmn-sec-feature-tabs-timeline .wsf-btn.wsf-sec{background:var(--wsf-learn);color:var(--color-text-primary)}
    .wpmn-sec-feature-tabs-timeline .wsf-btn.wsf-sec:hover{filter:brightness(.97)}

    /* floating token mock (replaces the screenshot) */
    .wpmn-sec-feature-tabs-timeline .wsf-shot{position:absolute;right:-4%;top:50%;transform:translateY(-50%);width:48%;aspect-ratio:4/5;background:var(--color-surface-primary);border-radius:var(--radius-md);overflow:hidden;filter:drop-shadow(0 24px 44px color-mix(in srgb, var(--color-text-primary) 20%, transparent));pointer-events:none;display:flex;flex-direction:column}
    .wpmn-sec-feature-tabs-timeline .wsf-sk-head{display:flex;align-items:center;gap:6px;padding:14px 16px;border-bottom:1px solid var(--wsf-line2)}
    .wpmn-sec-feature-tabs-timeline .wsf-sk-head i{width:8px;height:8px;border-radius:999px;background:var(--wsf-sk)}
    .wpmn-sec-feature-tabs-timeline .wsf-sk-body{flex:1;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
    .wpmn-sec-feature-tabs-timeline .wsf-sk-block{height:38%;border-radius:var(--radius-sm);background:var(--wsf-accent, color-mix(in srgb, var(--btn-bg-enable) 22%, var(--color-surface-primary)))}
    .wpmn-sec-feature-tabs-timeline .wsf-sk-row{height:10px;border-radius:999px;background:var(--wsf-sk)}
    .wpmn-sec-feature-tabs-timeline .wsf-sk-row.s2{width:80%}
    .wpmn-sec-feature-tabs-timeline .wsf-sk-row.s3{width:55%}
    .wpmn-sec-feature-tabs-timeline .wsf-card.wsf-swap .wsf-text{animation:wpmn-wsf-fade .4s ease}
    .wpmn-sec-feature-tabs-timeline .wsf-card.wsf-swap .wsf-shot{animation:wpmn-wsf-fadeShot .45s ease}

    .wpmn-sec-feature-tabs-timeline .wsf-steps{display:flex;flex-direction:column}
    .wpmn-sec-feature-tabs-timeline .wsf-step{display:grid;grid-template-columns:28px 1fr;gap:var(--primitive-space-16);cursor:pointer;padding-bottom:4px}
    .wpmn-sec-feature-tabs-timeline .wsf-rail{position:relative;display:flex;flex-direction:column;align-items:center}
    .wpmn-sec-feature-tabs-timeline .wsf-dot{width:15px;height:15px;border-radius:999px;border:2px solid var(--wsf-dotline);background:var(--color-surface-primary);flex:none;margin-top:3px;transition:.25s;z-index:1}
    .wpmn-sec-feature-tabs-timeline .wsf-step.wsf-on .wsf-dot{border-color:var(--btn-bg-enable);background:var(--btn-bg-enable);box-shadow:0 0 0 4px color-mix(in srgb, var(--btn-bg-enable) 16%, transparent)}
    .wpmn-sec-feature-tabs-timeline .wsf-track{width:2px;flex:1;background:var(--wsf-line);margin:6px 0;border-radius:999px;position:relative;overflow:hidden}
    .wpmn-sec-feature-tabs-timeline .wsf-fill{position:absolute;left:0;top:0;width:100%;height:0;background:var(--btn-bg-enable);border-radius:999px}
    .wpmn-sec-feature-tabs-timeline .wsf-step.wsf-on .wsf-fill{height:100%;transition:height var(--auto) linear}
    .wpmn-sec-feature-tabs-timeline .wsf-step:last-child .wsf-track{display:none}
    .wpmn-sec-feature-tabs-timeline .wsf-bodytx{padding-bottom:26px}
    .wpmn-sec-feature-tabs-timeline .wsf-bodytx h4{font-size:var(--font-size-h6);line-height:var(--font-lh-h6);font-weight:var(--font-weight-medium);color:var(--color-text-primary);margin-bottom:6px;transition:color .2s}
    .wpmn-sec-feature-tabs-timeline .wsf-bodytx p{font-size:var(--font-size-body-small);line-height:var(--font-lh-body-small);color:var(--color-text-secondary);font-weight:var(--font-weight-regular);max-width:360px}
    .wpmn-sec-feature-tabs-timeline .wsf-step.wsf-on .wsf-bodytx h4{font-weight:var(--font-weight-semibold)}

    @media (max-width:900px){
      .wpmn-sec-feature-tabs-timeline .wsf-wrap{padding:48px var(--primitive-space-16) 72px}
      .wpmn-sec-feature-tabs-timeline .wsf-tab{padding:12px 6px}
      .wpmn-sec-feature-tabs-timeline .wsf-grid{grid-template-columns:1fr;gap:32px}
      .wpmn-sec-feature-tabs-timeline .wsf-card{min-height:0;padding:36px 28px;text-align:left;align-items:flex-start}
      .wpmn-sec-feature-tabs-timeline .wsf-text{max-width:100%}
      .wpmn-sec-feature-tabs-timeline .wsf-shot{position:static;transform:none;width:100%;max-width:340px;aspect-ratio:4/5;margin:24px auto 0}
      .wpmn-sec-feature-tabs-timeline .wsf-card.wsf-swap .wsf-shot{animation:none}
    }
    @media (prefers-reduced-motion:reduce){
      .wpmn-sec-feature-tabs-timeline .wsf-card.wsf-swap .wsf-text,.wpmn-sec-feature-tabs-timeline .wsf-card.wsf-swap .wsf-shot{animation:none}
      .wpmn-sec-feature-tabs-timeline .wsf-step.wsf-on .wsf-fill{transition:none;height:100%}
    }
  </style>

  <div class="wsf-wrap">
    <div class="wsf-head">
      <h2>Dynamic features that fulfil all your social marketing needs</h2>
      <p>Struggling with multiple plugins for multiple solutions? We are here with our all-in-one solution.</p>
    </div>
    <div class="wsf-tabs"></div>
    <div class="wsf-grid">
      <div class="wsf-card"></div>
      <div class="wsf-steps"></div>
    </div>
  </div>

  <script>
  (function(){
    var sec = document.currentScript.parentElement;
    var TABS = [
      ["Social Feeds", [
        ["Multiple User Accounts","If you have multiple user accounts for a platform, bring them all and place them on a single feed."],
        ["Hashtag or Keywords","Filter your feeds by specific hashtags or keywords. Show or hide posts and display them automatically."],
        ["Popup Lightbox","Open your feed posts in a pop-up lightbox. Get an up-close view with all the info and comments."],
        ["Auto Sync","Keep social feeds updated in real time, automatically fetching the latest posts on your site."],
        ["Header Settings","Customize the business name, follow button, follower counts, and more on the front end."]
      ]],
      ["Business Reviews", [
        ["Filters by Minimum Rating","Not every rating is a 5-star one. Select the best ones you want to display to users on your site."],
        ["Uniform Dimension","Adjust the height of your reviews' text to match the design of your website."],
        ["Ask for More Reviews","A CTA button that encourages website visitors to leave an instant review."],
        ["Reviewer Name & Image","Control the visibility of your reviewers' identity. Show or hide the reviewer's name."],
        ["Content Length","Customize the content length so reviews sit perfectly aligned on your site."]
      ]],
      ["Social Chats", [
        ["Multiple Chat Widgets","Connect with a broader community and boost conversions with instant chat widgets."],
        ["Personalize Chatbox","Customize your social chat box to suit your brand with a fun editor panel."],
        ["Show Prompt","Enable a custom pop-up chat box to appear on any page of your website."],
        ["Schedule Time","Let visitors know when you are offline and when to catch up with your team."],
        ["Caption When Offline","Welcome your audience even when you're offline with preset caption text."]
      ]]
    ];
    var AUTO = 7000;
    var CARD_TINT = [
      'color-mix(in srgb, var(--color-success-primary) 12%, var(--color-surface-primary))',
      'color-mix(in srgb, var(--color-error-primary) 10%, var(--color-surface-primary))',
      'color-mix(in srgb, var(--btn-bg-enable) 12%, var(--color-surface-primary))'
    ];
    var ACCENT = [
      'color-mix(in srgb, var(--color-success-primary) 24%, var(--color-surface-primary))',
      'color-mix(in srgb, var(--color-error-primary) 22%, var(--color-surface-primary))',
      'color-mix(in srgb, var(--btn-bg-enable) 24%, var(--color-surface-primary))'
    ];
    var tab = 0, idx = 0, timer = null;
    var tabsEl = sec.querySelector('.wsf-tabs'), stepsEl = sec.querySelector('.wsf-steps'), cardEl = sec.querySelector('.wsf-card');

    tabsEl.innerHTML = TABS.map(function(t,i){ return '<button class="wsf-tab' + (i===0?' wsf-on':'') + '" data-t="' + i + '">' + t[0] + '</button>'; }).join('');
    window.__sectionStep = function(n){ setStep(n); };

    function renderSteps(){
      stepsEl.innerHTML = TABS[tab][1].map(function(f,i){
        return '<div class="wsf-step' + (i===idx?' wsf-on':'') + '" data-i="' + i + '"><div class="wsf-rail"><span class="wsf-dot"></span><span class="wsf-track"><span class="wsf-fill"></span></span></div><div class="wsf-bodytx"><h4>' + f[0] + '</h4><p>' + f[1] + '</p></div></div>';
      }).join('');
    }
    function renderCard(){
      var f = TABS[tab][1][idx];
      cardEl.style.setProperty('--wsf-card', CARD_TINT[tab]);
      cardEl.classList.remove('wsf-swap'); void cardEl.offsetWidth; cardEl.classList.add('wsf-swap');
      cardEl.innerHTML =
        '<div class="wsf-text"><h3>' + f[0] + '</h3><p class="wsf-desc">' + f[1] + '</p>' +
          '<div class="wsf-cta"><a class="wsf-btn wsf-pri" href="#" onclick="return false">Get Started ' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>' +
            '<a class="wsf-btn wsf-sec" href="#" onclick="return false">Learn More</a></div></div>' +
        '<div class="wsf-shot" style="--wsf-accent:' + ACCENT[tab] + '">' +
          '<div class="wsf-sk-head"><i></i><i></i><i></i></div>' +
          '<div class="wsf-sk-body"><div class="wsf-sk-block"></div><div class="wsf-sk-row"></div><div class="wsf-sk-row s2"></div><div class="wsf-sk-row s3"></div></div>' +
        '</div>';
    }
    function setStep(i){
      idx = (i+5) % 5;
      [].forEach.call(stepsEl.children, function(s,k){ s.classList.toggle('wsf-on', k===idx); });
      var fill = stepsEl.children[idx].querySelector('.wsf-fill');
      fill.style.transition = 'none'; fill.style.height = '0'; void fill.offsetWidth; fill.style.transition = ''; fill.style.height = '100%';
      renderCard(); auto();
    }
    function auto(){ clearTimeout(timer); timer = setTimeout(function(){ setStep(idx+1); }, AUTO); }
    tabsEl.querySelectorAll('.wsf-tab').forEach(function(b){ b.onclick = function(){
      tab = +b.dataset.t; idx = 0;
      tabsEl.querySelectorAll('.wsf-tab').forEach(function(x){ x.classList.toggle('wsf-on', x===b); });
      renderSteps(); setStep(0);
    }; });
    stepsEl.addEventListener('click', function(e){ var s = e.target.closest('.wsf-step'); if(s) setStep(+s.dataset.i); });
    renderSteps(); renderCard(); setStep(0);
  })();
  </script>
</section>
