<!-- WPMN Section: Typographic Hero — massive expressive type, no imagery -->
<section class="wpmn-sec-hero-typographic">
  <style>
    .wpmn-sec-hero-typographic { padding: 96px 0; background: var(--color-surface-primary); font-family: var(--font-family-base); }
    .wpmn-sec-hero-typographic .ht-container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .wpmn-sec-hero-typographic .ht-badge { display: inline-flex; align-items: center; gap: 8px; font-size: var(--font-size-body-label); line-height: var(--font-lh-body-label); font-weight: var(--font-weight-medium); letter-spacing: 0.08em; text-transform: uppercase; color: var(--btn-bg-enable); margin-bottom: 12px; }
    .wpmn-sec-hero-typographic .ht-badge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--btn-bg-enable); }
    .wpmn-sec-hero-typographic .ht-heading { margin: 0; font-size: clamp(48px, 8vw, 96px); line-height: 1.05; font-weight: var(--font-weight-bold); letter-spacing: -0.02em; color: var(--color-text-primary); }
    .wpmn-sec-hero-typographic .ht-heading em { font-style: normal; color: var(--btn-bg-enable); }
    .wpmn-sec-hero-typographic .ht-subtext { max-width: 800px; margin: 16px 0 0; font-size: var(--font-size-body-large); line-height: var(--font-lh-body-large); color: var(--color-text-secondary); }
    .wpmn-sec-hero-typographic .ht-ctas { display: flex; gap: 16px; margin-top: 32px; flex-wrap: wrap; justify-content: center; }
    .wpmn-sec-hero-typographic .ht-btn { display: inline-flex; align-items: center; justify-content: center; height: 56px; padding: 0 32px; border-radius: var(--radius-xsm); font-size: var(--font-size-btn-lg); line-height: var(--font-lh-btn-lg); font-weight: var(--font-weight-semibold); font-family: inherit; text-decoration: none; cursor: pointer; transition: background-color 120ms ease, color 120ms ease; border: 1.5px solid transparent; }
    .wpmn-sec-hero-typographic .ht-btn--primary { background: var(--btn-bg-enable); color: var(--color-text-primary-invert); box-shadow: inset 3px 4px 4px 0 rgba(255,255,255,0.3); }
    .wpmn-sec-hero-typographic .ht-btn--primary:hover { background: var(--btn-bg-hovered); }
    .wpmn-sec-hero-typographic .ht-btn--secondary { background: transparent; color: var(--btn-bg-enable); border-color: var(--btn-bg-enable); }
    .wpmn-sec-hero-typographic .ht-btn--secondary:hover { background: var(--btn-bg-enable); color: var(--color-text-primary-invert); }
    @media (max-width: 1199px) { .wpmn-sec-hero-typographic .ht-container { padding: 0 40px; } }
    @media (max-width: 768px) { .wpmn-sec-hero-typographic { padding: 64px 0; } .wpmn-sec-hero-typographic .ht-container { padding: 0 20px; } }
  </style>
  <div class="ht-container">
    <span class="ht-badge">Email Marketing</span>
    <h1 class="ht-heading">Marketing that<br><em>actually converts</em></h1>
    <p class="ht-subtext">Automation, segmentation, and campaigns inside WordPress. Your data stays yours.</p>
    <div class="ht-ctas">
      <a class="ht-btn ht-btn--primary" href="#">Start Free Trial</a>
      <a class="ht-btn ht-btn--secondary" href="#">Watch Overview</a>
    </div>
  </div>
</section>
