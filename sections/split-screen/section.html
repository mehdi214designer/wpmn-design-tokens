<!-- WPMN Section: Split Screen 50/50 — visual one side, text + form the other -->
<section class="wpmn-sec-split-screen">
  <style>
    .wpmn-sec-split-screen{padding:96px 0;background:var(--color-surface-primary);font-family:var(--font-family-base)}
    .wpmn-sec-split-screen .ss-c{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
    .wpmn-sec-split-screen .ss-visual{border-radius:var(--radius-lg);background:var(--color-brand-surface);min-height:440px;display:flex;align-items:center;justify-content:center;color:var(--color-text-primary-invert);font-size:var(--font-size-body-medium)}
    .wpmn-sec-split-screen .ss-badge{display:inline-flex;align-items:center;gap:8px;font-size:var(--font-size-body-label);font-weight:var(--font-weight-medium);letter-spacing:.08em;text-transform:uppercase;color:var(--btn-bg-enable);margin-bottom:12px}
    .wpmn-sec-split-screen .ss-badge::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--btn-bg-enable)}
    .wpmn-sec-split-screen h2{margin:0;font-size:var(--font-size-h2);line-height:var(--font-lh-h2);font-weight:var(--font-weight-semibold);color:var(--color-text-primary)}
    .wpmn-sec-split-screen .ss-sub{margin:16px 0 0;font-size:var(--font-size-body-medium);line-height:var(--font-lh-body-medium);color:var(--color-text-secondary)}
    .wpmn-sec-split-screen .ss-form{display:flex;gap:12px;margin-top:32px}
    .wpmn-sec-split-screen .ss-input{flex:1;height:48px;padding:0 16px;font-family:inherit;font-size:var(--font-size-body-small);color:var(--input-text-active);border:1px solid var(--input-stroke-default);border-radius:var(--radius-xsm);background:transparent;outline:none;transition:border-color 120ms ease}
    .wpmn-sec-split-screen .ss-input:focus{border-color:var(--input-stroke-active)}
    .wpmn-sec-split-screen .ss-input::placeholder{color:var(--input-text-default)}
    .wpmn-sec-split-screen .ss-btn{height:48px;padding:0 24px;border-radius:var(--radius-xsm);border:none;background:var(--btn-bg-enable);color:var(--color-text-primary-invert);font-family:inherit;font-size:var(--font-size-btn-md);font-weight:var(--font-weight-medium);cursor:pointer;box-shadow:inset 3px 4px 4px 0 var(--btn-bg-glow, rgba(255,255,255,0.3));transition:background-color 120ms ease;white-space:nowrap}
    .wpmn-sec-split-screen .ss-btn:hover{background:var(--btn-bg-hovered)}
    .wpmn-sec-split-screen .ss-note{margin:12px 0 0;font-size:var(--font-size-body-small);color:var(--color-text-secondary)}
    @media(max-width:1199px){.wpmn-sec-split-screen .ss-c{padding:0 40px}}
    @media(max-width:900px){.wpmn-sec-split-screen .ss-c{grid-template-columns:1fr;gap:32px}.wpmn-sec-split-screen .ss-visual{min-height:280px}}
    @media(max-width:768px){.wpmn-sec-split-screen{padding:64px 0}.wpmn-sec-split-screen .ss-c{padding:0 20px}.wpmn-sec-split-screen .ss-form{flex-direction:column}}
      .wpmn-sec-split-screen .ss-visual{overflow:hidden;padding:0}.wpmn-sec-split-screen .ss-visual img{display:block;width:100%;height:100%;object-fit:cover}
  </style>
  <div class="ss-c">
    <div class="ss-visual"><img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=80" alt="Product photo" loading="lazy"></div>
    <div>
      <span class="ss-badge">Early Access</span>
      <h2>Half visual, half action</h2>
      <p class="ss-sub">The 50/50 split puts a high-quality image on one side and the conversion moment on the other. Nothing competes for attention.</p>
      <div class="ss-form">
        <input class="ss-input" type="email" placeholder="you@company.com" aria-label="Email address">
        <button class="ss-btn" type="button">Join Waitlist</button>
      </div>
      <p class="ss-note">No spam. One email when we launch.</p>
    </div>
  </div>
</section>
