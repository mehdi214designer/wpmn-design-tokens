<!-- WPMN Section: Security Scan Hero — spinning brand mark, mono badge, big heading with inline tile, dual CTAs, auto-advancing feature tabs, and an animated app-scan window with a CSP-style warning (rebuilt from a scraped reference, fully tokenized) -->
<section class="wpmn-sec-security-scan-hero">
  <style>
@keyframes wpmn-ssh-spin { to { transform: rotate(360deg); } }
@keyframes wpmn-ssh-scan { 0% { transform: translateY(-213px); } 70%, 100% { transform: translateY(400px); } }
@keyframes wpmn-ssh-up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    .wpmn-sec-security-scan-hero{

      font-family:var(--font-family-base);
      padding:var(--primitive-space-96) var(--primitive-space-32) 0;
      background:
        radial-gradient(120% 78% at 50% 116%, var(--ssh-glow), transparent 62%),
        var(--color-surface-secondary);
      --ssh-glow:color-mix(in srgb, var(--btn-bg-enable) 34%, transparent);
      --ssh-app:color-mix(in srgb, var(--color-text-primary-invert) 4%, var(--color-surface-secondary));
      --ssh-fill6:color-mix(in srgb, var(--color-text-primary-invert) 6%, transparent);
      --ssh-fill8:color-mix(in srgb, var(--color-text-primary-invert) 8%, transparent);
      --ssh-fill12:color-mix(in srgb, var(--color-text-primary-invert) 12%, transparent);
      --ssh-line:color-mix(in srgb, var(--color-text-primary-invert) 8%, transparent);
      --ssh-dot:color-mix(in srgb, var(--color-text-primary-invert) 12%, transparent);
      --ssh-scan:linear-gradient(to bottom, transparent, color-mix(in srgb, var(--btn-bg-enable) 26%, transparent) 60%, transparent);
      --ssh-tile:linear-gradient(150deg, color-mix(in srgb, var(--btn-bg-enable) 92%, var(--color-text-primary-invert)), var(--btn-bg-enable));
    }
    .wpmn-sec-security-scan-hero .wrap{max-width:1000px;margin:0 auto;text-align:center}

    /* spinning brand mark */
    .wpmn-sec-security-scan-hero .mark{position:relative;width:64px;height:64px;margin:0 auto var(--primitive-space-40)}
    .wpmn-sec-security-scan-hero .mark .tile{position:absolute;inset:14px;border-radius:var(--radius-md);background:var(--ssh-tile);box-shadow:inset 2px 3px 4px 0 var(--btn-bg-glow, rgba(255,255,255,0.3))}
    .wpmn-sec-security-scan-hero .mark .glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--color-text-primary-invert)}
    .wpmn-sec-security-scan-hero .mark .glyph svg{width:22px;height:22px}
    .wpmn-sec-security-scan-hero .mark .ring{position:absolute;inset:0;animation:wpmn-ssh-spin 14s linear infinite}
    .wpmn-sec-security-scan-hero .mark .ring i{position:absolute;width:6px;height:6px;border-radius:999px;background:var(--color-text-primary-invert);top:-1px;left:50%;margin-left:-3px}
    .wpmn-sec-security-scan-hero .mark .ring i:last-child{top:auto;bottom:-1px;opacity:.5}

    /* badge */
    .wpmn-sec-security-scan-hero .badge{display:inline-flex;align-items:center;gap:var(--primitive-space-8);padding:var(--primitive-space-8) var(--primitive-space-16);border-radius:999px;background:var(--ssh-fill8);border:1px solid var(--ssh-line);margin-bottom:var(--primitive-space-32)}
    .wpmn-sec-security-scan-hero .badge svg{width:13px;height:13px;color:var(--btn-bg-enable)}
    .wpmn-sec-security-scan-hero .badge span{font-size:var(--font-size-body-label);line-height:var(--font-lh-body-label);font-weight:var(--font-weight-medium);letter-spacing:.14em;text-transform:uppercase;color:var(--color-text-secondary-invert)}

    /* heading + sub */
    .wpmn-sec-security-scan-hero h1{font-size:var(--font-size-h1);line-height:var(--font-lh-h1);font-weight:var(--font-weight-bold);letter-spacing:-0.02em;color:var(--color-text-primary-invert);margin:0 auto var(--primitive-space-16);max-width:16ch;display:flex;flex-wrap:wrap;gap:0 var(--primitive-space-12);align-items:center;justify-content:center}
    .wpmn-sec-security-scan-hero h1 .inline-tile{display:inline-flex;width:40px;height:40px;border-radius:var(--radius-sm);background:var(--ssh-tile);align-items:center;justify-content:center;box-shadow:inset 2px 3px 4px 0 var(--btn-bg-glow, rgba(255,255,255,0.3));vertical-align:middle}
    .wpmn-sec-security-scan-hero h1 .inline-tile svg{width:22px;height:22px;color:var(--color-text-primary-invert)}
    .wpmn-sec-security-scan-hero .sub{font-size:var(--font-size-body-medium);line-height:var(--font-lh-body-medium);color:var(--color-text-secondary-invert);margin:0 auto var(--primitive-space-40);max-width:44ch}

    /* CTAs */
    .wpmn-sec-security-scan-hero .ctas{display:flex;gap:var(--primitive-space-12);justify-content:center;margin-bottom:var(--primitive-space-64)}
    .wpmn-sec-security-scan-hero .btn{display:inline-flex;align-items:center;gap:var(--primitive-space-8);height:48px;padding:0 var(--primitive-space-24);border-radius:var(--radius-xsm);font-size:var(--font-size-btn-md);line-height:var(--font-lh-btn-md);font-weight:var(--font-weight-medium);text-decoration:none;border:1.5px solid transparent;cursor:pointer;transition:background-color 120ms ease, box-shadow 120ms ease}
    .wpmn-sec-security-scan-hero .btn svg{width:18px;height:18px}
    .wpmn-sec-security-scan-hero .btn-primary{background:var(--btn-bg-enable);color:var(--color-text-primary-invert);box-shadow:inset 3px 4px 4px 0 var(--btn-bg-glow, rgba(255,255,255,0.3))}
    .wpmn-sec-security-scan-hero .btn-primary:hover{background:var(--btn-bg-hovered)}
    .wpmn-sec-security-scan-hero .btn-primary:active{background:var(--btn-bg-pressed)}
    .wpmn-sec-security-scan-hero .btn-dark{background:var(--ssh-fill8);color:var(--color-text-primary-invert);border-color:var(--ssh-line)}
    .wpmn-sec-security-scan-hero .btn-dark:hover{background:var(--ssh-fill12)}
    .wpmn-sec-security-scan-hero .btn:focus-visible{outline:none;border-color:var(--btn-bg-focused)}

    /* feature tabs */
    .wpmn-sec-security-scan-hero .tabs{display:flex;max-width:780px;margin:0 auto var(--primitive-space-48)}
    .wpmn-sec-security-scan-hero .tab{flex:1;position:relative;padding:0 var(--primitive-space-24) var(--primitive-space-16);background:none;border:0;cursor:pointer;text-align:center;color:inherit;font-family:inherit}
    .wpmn-sec-security-scan-hero .tab + .tab{border-left:1px solid var(--ssh-line)}
    .wpmn-sec-security-scan-hero .tab .ico{width:44px;height:44px;margin:0 auto var(--primitive-space-16);border-radius:999px;background:var(--ssh-fill8);display:flex;align-items:center;justify-content:center;color:var(--color-text-primary-invert);transition:background-color 200ms ease}
    .wpmn-sec-security-scan-hero .tab .ico svg{width:20px;height:20px}
    .wpmn-sec-security-scan-hero .tab .body{opacity:.55;transition:opacity 200ms ease}
    .wpmn-sec-security-scan-hero .tab.is-active .body{opacity:1}
    .wpmn-sec-security-scan-hero .tab.is-active .ico{background:color-mix(in srgb, var(--btn-bg-enable) 24%, var(--ssh-fill8))}
    .wpmn-sec-security-scan-hero .tab .t{font-size:var(--font-size-body-base);line-height:var(--font-lh-body-base);font-weight:var(--font-weight-semibold);color:var(--color-text-primary-invert);margin-bottom:var(--primitive-space-4)}
    .wpmn-sec-security-scan-hero .tab .d{font-size:var(--font-size-body-base);line-height:var(--font-lh-body-base);color:var(--color-text-secondary-invert)}
    .wpmn-sec-security-scan-hero .ftrack{position:absolute;left:var(--primitive-space-24);right:var(--primitive-space-24);bottom:0;height:2px;border-radius:999px;background:var(--ssh-fill12);overflow:hidden}
    .wpmn-sec-security-scan-hero .ffill{position:absolute;inset:0 100% 0 0;background:var(--color-text-primary-invert);border-radius:999px}
    .wpmn-sec-security-scan-hero .tab.is-active .ffill{inset:0 0 0 0;transition:inset 4s linear}

    /* app scan window */
    .wpmn-sec-security-scan-hero .stage{max-width:960px;margin:0 auto;opacity:0}
    .wpmn-sec-security-scan-hero.in-view .stage{animation:wpmn-ssh-up .7s cubic-bezier(.22,1,.36,1) both}
    .wpmn-sec-security-scan-hero .app{position:relative;height:560px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;background:var(--ssh-app);border:1px solid var(--ssh-line);border-bottom:0;overflow:hidden}
    .wpmn-sec-security-scan-hero .menubar{position:relative;z-index:20;display:flex;align-items:center;gap:var(--primitive-space-16);height:40px;padding:0 var(--primitive-space-20);border-bottom:1px solid var(--ssh-line);font-size:var(--font-size-body-small);line-height:var(--font-lh-body-small);color:var(--color-text-secondary-invert)}
    .wpmn-sec-security-scan-hero .menubar .app-name{font-weight:var(--font-weight-semibold);color:var(--color-text-primary-invert)}
    .wpmn-sec-security-scan-hero .menubar .clock{margin-left:auto}
    .wpmn-sec-security-scan-hero .menubar .logo-dot{width:14px;height:14px;border-radius:var(--radius-xsm);background:var(--ssh-tile)}
    .wpmn-sec-security-scan-hero .grid{position:absolute;inset:40px 0 0;background-image:radial-gradient(var(--ssh-dot) 1px, transparent 1.5px);background-size:26px 26px;-webkit-mask-image:radial-gradient(120% 90% at 50% 30%, #000 40%, transparent 78%);mask-image:radial-gradient(120% 90% at 50% 30%, #000 40%, transparent 78%)}
    .wpmn-sec-security-scan-hero .guide{position:absolute;left:0;right:0;height:1px;background:var(--ssh-fill6)}
    .wpmn-sec-security-scan-hero .guide.g1{top:150px}
    .wpmn-sec-security-scan-hero .guide.g2{top:430px}
    .wpmn-sec-security-scan-hero .vguide{position:absolute;top:150px;bottom:0;width:1px;background:var(--ssh-fill6)}
    .wpmn-sec-security-scan-hero .vguide.v1{left:calc(50% - 248px)}
    .wpmn-sec-security-scan-hero .vguide.v2{left:calc(50% + 248px)}
    .wpmn-sec-security-scan-hero .node{position:absolute;width:15px;height:15px;border-radius:4px;background:var(--ssh-fill8);display:flex;align-items:center;justify-content:center}
    .wpmn-sec-security-scan-hero .node::after{content:"";width:5px;height:5px;border-radius:999px;background:color-mix(in srgb, var(--btn-bg-enable) 80%, var(--color-text-primary-invert))}
    .wpmn-sec-security-scan-hero .central{position:absolute;top:96px;left:50%;width:84px;height:84px;margin-left:-42px;border-radius:22px;background:var(--ssh-tile);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px -12px var(--ssh-glow), inset 2px 3px 6px 0 var(--btn-bg-glow, rgba(255,255,255,0.3));z-index:12}
    .wpmn-sec-security-scan-hero .central svg{width:34px;height:34px;color:var(--color-text-primary-invert)}
    .wpmn-sec-security-scan-hero .winmock{position:absolute;left:50%;top:230px;width:520px;margin-left:-260px;height:300px;border-radius:var(--radius-md) var(--radius-md) 0 0;background:color-mix(in srgb, var(--color-text-primary-invert) 3%, var(--color-surface-secondary));border:1px solid var(--ssh-line);border-bottom:0;overflow:hidden;z-index:10}
    .wpmn-sec-security-scan-hero .winmock .bar{display:flex;align-items:center;gap:var(--primitive-space-8);height:34px;padding:0 var(--primitive-space-16);border-bottom:1px solid var(--ssh-line)}
    .wpmn-sec-security-scan-hero .winmock .bar i{width:9px;height:9px;border-radius:999px;background:var(--ssh-fill12)}
    .wpmn-sec-security-scan-hero .winmock .bar span{margin-left:var(--primitive-space-8);font-size:var(--font-size-body-small);line-height:var(--font-lh-body-small);color:var(--color-text-secondary-invert)}
    .wpmn-sec-security-scan-hero .winmock .rows{padding:var(--primitive-space-16);display:flex;flex-direction:column;gap:var(--primitive-space-12)}
    .wpmn-sec-security-scan-hero .winmock .rows b{display:block;height:8px;border-radius:999px;background:var(--ssh-fill8)}
    .wpmn-sec-security-scan-hero .winmock .rows b:nth-child(1){width:70%}
    .wpmn-sec-security-scan-hero .winmock .rows b:nth-child(2){width:48%}
    .wpmn-sec-security-scan-hero .winmock .rows b:nth-child(3){width:84%}
    .wpmn-sec-security-scan-hero .winmock .rows b:nth-child(4){width:38%}
    .wpmn-sec-security-scan-hero .scan{position:absolute;left:0;right:0;top:0;height:213px;background:var(--ssh-scan);z-index:14;pointer-events:none;animation:wpmn-ssh-scan 5s ease-out infinite}
    .wpmn-sec-security-scan-hero .scan::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:color-mix(in srgb, var(--btn-bg-enable) 75%, var(--color-text-primary-invert))}
    .wpmn-sec-security-scan-hero .warn{position:absolute;top:188px;left:50%;transform:translateX(8%);z-index:16;display:inline-flex;align-items:center;gap:var(--primitive-space-8);padding:var(--primitive-space-8) var(--primitive-space-16);border-radius:999px;background:color-mix(in srgb, var(--color-text-primary-invert) 10%, var(--color-surface-secondary));border:1px solid var(--ssh-line);font-size:var(--font-size-body-small);line-height:var(--font-lh-body-small);color:var(--color-text-primary-invert);box-shadow:var(--shadow-soft-500)}
    .wpmn-sec-security-scan-hero .warn .x{width:16px;height:16px;border-radius:999px;background:var(--color-error-primary);display:flex;align-items:center;justify-content:center;color:var(--color-text-primary-invert)}
    .wpmn-sec-security-scan-hero .warn .x svg{width:9px;height:9px}
    .wpmn-sec-security-scan-hero .fade{position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(to top, var(--color-surface-secondary), transparent);z-index:18;pointer-events:none}

    /* responsive */
    @media(max-width:1199px){ .wpmn-sec-security-scan-hero{padding:var(--primitive-space-96) var(--primitive-space-40) 0} }
    @media(max-width:900px){
      .wpmn-sec-security-scan-hero .tabs{max-width:520px;flex-wrap:wrap;gap:var(--primitive-space-16)}
      .wpmn-sec-security-scan-hero .tab{flex:1 1 100%;border-left:0;padding-bottom:var(--primitive-space-24)}
      .wpmn-sec-security-scan-hero .tab + .tab{border-left:0}
      .wpmn-sec-security-scan-hero .app{height:480px}
      .wpmn-sec-security-scan-hero .winmock{width:88%;margin-left:0;left:6%}
    }
    @media(max-width:768px){
      .wpmn-sec-security-scan-hero{padding:var(--primitive-space-64) var(--primitive-space-20) 0}
      .wpmn-sec-security-scan-hero .ctas{flex-direction:column;align-items:stretch;max-width:300px;margin-left:auto;margin-right:auto}
      .wpmn-sec-security-scan-hero .btn{justify-content:center}
      .wpmn-sec-security-scan-hero .vguide{display:none}
    }
    @media(prefers-reduced-motion:reduce){
      .wpmn-sec-security-scan-hero .mark .ring{animation:none}
      .wpmn-sec-security-scan-hero .scan{animation:none;top:120px;opacity:.7}
      .wpmn-sec-security-scan-hero .stage{opacity:1;animation:none}
      .wpmn-sec-security-scan-hero .tab.is-active .ffill{transition:none}
    }
  </style>

  <script>
    // Interactions (ported intent): app-scan sweeps the window 5s ease-out infinite (verbatim keyframe);
    // brand mark orbits; feature tabs auto-advance with a filling progress track, click to jump.
    (function () {
      var sec = document.currentScript ? document.currentScript.parentElement : document.querySelector('.wpmn-sec-security-scan-hero');
      if (!sec) return;
      var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      var tabs = Array.prototype.slice.call(sec.querySelectorAll('.tab'));
      var i = 0, timer = null, CYCLE = 4000;

      function activate(n) {
        tabs.forEach(function (t, k) {
          t.classList.toggle('is-active', k === n);
          if (k === n) { var f = t.querySelector('.ffill'); if (f) { f.style.transition = 'none'; f.style.inset = '0 100% 0 0'; void f.offsetWidth; f.style.transition = ''; f.style.inset = ''; } }
        });
        i = n;
      }
      function cycle() { activate((i + 1) % tabs.length); }

      tabs.forEach(function (t, k) {
        t.addEventListener('click', function () { activate(k); if (timer) { clearInterval(timer); timer = setInterval(cycle, CYCLE); } });
      });

      // reveal the stage + start auto-advance once in view
      function start() {
        sec.classList.add('in-view');
        if (!reduced) { activate(0); timer = setInterval(cycle, CYCLE); }
      }
      if (reduced || !('IntersectionObserver' in window)) { sec.classList.add('in-view'); return; }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { if (e.isIntersecting) { start(); io.disconnect(); } });
      }, { threshold: 0.2 });
      io.observe(sec);
    })();
  </script>
