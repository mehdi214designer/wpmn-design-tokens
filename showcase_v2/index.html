<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPMN Design System — Dynamic Mirror</title>
    
    <!-- Core Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Global CSS -->
    <link rel="stylesheet" href="../index.css">
    <link rel="stylesheet" href="../components/Button/Button.css">
    <link rel="stylesheet" href="../components/Input/Input.css">
    <link rel="stylesheet" href="../components/Badge/Badge.css">
    <link rel="stylesheet" href="../components/NavBar/NavBar.css">

    <style>
        body { 
            margin: 0; 
            background: var(--color-surface-primary); 
            color: var(--color-text-primary); 
            font-family: 'Work Sans', sans-serif;
            transition: background 0.3s ease;
        }
        .system-loader { 
            position: fixed; inset: 0; background: white; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 9999; 
        }
        .spinner { width: 40px; height: 40px; border: 4px solid #eee; border-top-color: #0d5fff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .app-layout { display: flex; min-height: 100vh; }
        .app-sidebar { 
            width: 280px; 
            border-right: 1px solid var(--color-border-primary); 
            padding: 40px 24px; 
            position: sticky; top: 0; height: 100vh; 
            box-sizing: border-box;
            background: var(--color-surface-primary);
        }
        .app-content { flex: 1; padding: 60px 80px; }
        
        .nav-item { 
            padding: 12px 16px; border-radius: 8px; cursor: pointer; 
            color: var(--color-text-secondary); margin-bottom: 6px; 
            font-weight: 500; transition: all 0.2s;
        }
        .nav-item:hover { background: var(--color-border-primary); color: var(--color-text-primary); }
        .nav-item.active { background: #0d5fff; color: white; box-shadow: 0 4px 12px rgba(13, 95, 255, 0.2); }

        .demo-section { margin-bottom: 100px; }
        .demo-section-title { 
            margin-bottom: 40px; 
            border-bottom: 1px solid var(--color-border-primary); 
            padding-bottom: 16px; 
            font-size: 28px; font-weight: 800; 
            letter-spacing: -0.02em;
        }

        .spec-card {
            background: var(--color-surface-primary);
            border: 1px solid var(--color-border-primary);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            transition: transform 0.2s;
        }
        .spec-card:hover { transform: translateY(-2px); }

        .token-tag {
            font-size: 10px; font-weight: 900; 
            background: var(--primitive-primary-50); 
            color: var(--primitive-primary-600); 
            padding: 4px 8px; border-radius: 4px; 
            display: inline-block; margin-bottom: 16px;
        }

        .raw-spec { font-size: 11px; color: var(--color-text-secondary); }
        .raw-spec b { color: var(--color-text-primary); margin-left: 4px; }

        .spacing-indicator {
            border-left: 2px solid #0d5fff;
            margin: 12px 0;
            padding-left: 16px;
            display: flex;
            align-items: center;
        }
        .spacing-label {
            font-size: 9px; font-weight: 800;
            background: var(--primitive-primary-50);
            color: #0d5fff;
            padding: 4px 8px;
            border-radius: 4px;
            display: flex; gap: 8px;
        }

        [data-theme="dark"] .system-loader { background: #07090c; color: white; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Global Component Container
        window.DS = {};

        async function loadComponent(path, name) {
            const res = await fetch(path);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            let code = await res.text();
            
            code = code.replace(/import\s+[\s\S]*?from\s+['"].*?['"];?/g, '');
            code = code.replace(/import\s+['"].*?['"];?/g, '');
            const exportMatch = code.match(/export\s+default\s+(?:function|class)?\s*(\w+)/);
            const exportName = exportMatch ? exportMatch[1] : name;
            code = code.replace(/export\s+default\s+/g, '');
            code = code.replace(/export\s+/g, '');

            const wrap = `(function() {
                const { useState, useEffect, useId, useMemo, useCallback, useRef } = React;
                ${code}
                window.DS.${name} = ${exportName};
            })();`;

            const transformed = Babel.transform(wrap, { presets: ['react'] }).code;
            eval(transformed);
        }

        const App = () => {
            const [ready, setReady] = useState(false);
            const [activeTab, setActiveTab] = useState('typography');
            const [theme, setTheme] = useState('light');
            const [tokens, setTokens] = useState(null);

            useEffect(() => {
                const init = async () => {
                    try {
                        const [pRes, tRes] = await Promise.all([fetch('../primitives.css'), fetch('../tokens.css')]);
                        const pText = await pRes.text();
                        const tText = await tRes.text();
                        const parse = (text) => {
                            const map = {};
                            const matches = text.matchAll(/--([\w-]+):\s*(.*?);/g);
                            for (const m of matches) map[m[1]] = m[2].trim();
                            return map;
                        };
                        const raw = { ...parse(pText), ...parse(tText) };
                        const resolve = (v, i=0) => {
                            if (i > 10) return v;
                            const m = v.match(/var\(--([\w-]+)\)/);
                            if (m && raw[m[1]]) return resolve(v.replace(m[0], raw[m[1]]), i+1);
                            return v;
                        };

                        const groups = { primitives: {}, spacing: {} };
                        Object.keys(raw).forEach(k => {
                            const val = resolve(raw[k]);
                            if (k.startsWith('primitive-')) {
                                const c = k.split('-')[1] || 'base';
                                if (!groups.primitives[c]) groups.primitives[c] = [];
                                groups.primitives[c].push({k, val});
                            }
                        });
                        setTokens(groups);

                        const comps = ['Text', 'Button', 'Badge', 'Input', 'NavBar'];
                        for (const name of comps) await loadComponent(`../components/${name}/${name}.jsx`, name);
                        setReady(true);
                    } catch (e) { console.error(e); }
                };
                init();
            }, []);

            if (!ready) return <div className="system-loader"><div className="spinner"></div></div>;

            const Section = ({title, children}) => <div className="demo-section"><h2 className="demo-section-title">{title}</h2>{children}</div>;

            return (
                <div className="app-layout">
                    <div className="app-sidebar">
                        <div style={{fontSize:24, fontWeight:900, marginBottom:48, color:'#0d5fff', letterSpacing:'-0.03em'}}>WPMN.DS</div>
                        {['tokens', 'typography', 'components'].map(t => (
                            <div key={t} className={`nav-item ${activeTab === t ? 'active' : ''}`} onClick={() => setActiveTab(t)}>
                                {t.charAt(0).toUpperCase() + t.slice(1)}
                            </div>
                        ))}
                        <div style={{marginTop:'auto'}}>
                            <window.DS.Button type="tertiary" size="sm" fullWidth onClick={() => {
                                const nt = theme === 'light' ? 'dark' : 'light';
                                setTheme(nt);
                                document.documentElement.setAttribute('data-theme', nt);
                            }}>{theme === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode'}</window.DS.Button>
                        </div>
                    </div>

                    <div className="app-content">
                        {activeTab === 'tokens' && (
                            <Section title="Color Primitives">
                                <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(320px, 1fr))', gap:32}}>
                                    {Object.entries(tokens.primitives).map(([cat, list]) => (
                                        <div key={cat} style={{padding:24, background:'var(--color-surface-primary)', borderRadius:16, border:'1px solid var(--color-border-primary)'}}>
                                            <h4 style={{textTransform:'capitalize', marginBottom:20, fontSize:14}}>{cat} Scale</h4>
                                            <div style={{display:'grid', gridTemplateColumns:'repeat(5, 1fr)', gap:12}}>
                                                {list.map(t => <div key={t.k} style={{height:40, background:`var(--${t.k})`, borderRadius:8, border:'1px solid var(--color-border-primary)'}} title={t.val}></div>)}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </Section>
                        )}

                        {activeTab === 'typography' && (
                            <div>
                                <Section title="Typography Scale">
                                    <div style={{display:'flex', flexDirection:'column', gap:24}}>
                                        {[
                                            { h: 'h1', name: 'heading_xxlarge', size: '61px', weight: '700', lh: '73px' },
                                            { h: 'h2', name: 'heading_xlarge',  size: '49px', weight: '700', lh: '59px' },
                                            { h: 'h3', name: 'heading_large',   size: '39px', weight: '600', lh: '47px' },
                                            { h: 'h4', name: 'heading-medium',  size: '31px', weight: '600', lh: '37px' },
                                            { h: 'h5', name: 'heading_small',   size: '25px', weight: '500', lh: '30px' },
                                            { h: 'h6', name: 'heading_xsmall',  size: '20px', weight: '500', lh: '24px' }
                                        ].map(item => (
                                            <div key={item.h} className="spec-card" style={{display:'flex', gap:32}}>
                                                <div style={{minWidth:180, borderRight:'1px solid var(--color-border-primary)', paddingRight:32}}>
                                                    <div className="token-tag">{item.name}</div>
                                                    <div style={{display:'flex', flexDirection:'column', gap:6}}>
                                                        <div className="raw-spec">Size: <b>{item.size}</b></div>
                                                        <div className="raw-spec">Weight: <b>{item.weight}</b></div>
                                                        <div className="raw-spec">L-Height: <b>{item.lh}</b></div>
                                                    </div>
                                                </div>
                                                <div style={{flex:1}}><window.DS.Text variant={item.h}>Building Digital Experiences with Precision</window.DS.Text></div>
                                            </div>
                                        ))}
                                    </div>
                                </Section>

                                <Section title="Body Styles">
                                    <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(400px, 1fr))', gap:32}}>
                                        {[
                                            { b: 'body-large',  size: '20px', weight: '400', lh: '30px' },
                                            { b: 'body-medium', size: '18px', weight: '400', lh: '27px' },
                                            { b: 'body-base',   size: '16px', weight: '400', lh: '24px' },
                                            { b: 'body-small',  size: '14px', weight: '400', lh: '21px' },
                                            { b: 'body-label',  size: '13px', weight: '500', lh: '20px' },
                                            { b: 'body-mono',   size: '10px', weight: '400', lh: '15px' }
                                        ].map(item => (
                                            <div key={item.b} className="spec-card">
                                                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20, borderBottom:'1px solid var(--color-border-primary)', paddingBottom:12}}>
                                                    <div style={{fontSize:11, fontWeight:900, letterSpacing:'0.05em'}}>{item.b.toUpperCase()}</div>
                                                    <div style={{display:'flex', gap:12}}>
                                                        <div className="raw-spec"><b>{item.size}</b></div>
                                                        <div className="raw-spec"><b>{item.lh}</b></div>
                                                    </div>
                                                </div>
                                                <window.DS.Text variant={item.b}>WPManageNinja helps teams build better products by providing a robust design system and component library that scales with your needs.</window.DS.Text>
                                            </div>
                                        ))}
                                    </div>
                                </Section>

                                <Section title="Typography Rhythm (Combinations)">
                                    <div style={{display:'flex', flexDirection:'column', gap:64}}>
                                        {[
                                            { h: 'h1', b: 'body-large',  space: 'var(--spacing-h-xxl-to-large)', name: 'H1 + Body Large', val: '16px', hSize: '61px', bSize: '20px' },
                                            { h: 'h2', b: 'body-medium', space: 'var(--spacing-h-xl-to-medium)', name: 'H2 + Body Medium', val: '12px', hSize: '49px', bSize: '18px' },
                                            { h: 'h3', b: 'body-medium', space: 'var(--spacing-h-l-to-medium)',  name: 'H3 + Body Medium', val: '12px', hSize: '39px', bSize: '18px' },
                                            { h: 'h4', b: 'body-base',   space: 'var(--spacing-h-m-to-base)',    name: 'H4 + Body Base',   val: '8px',  hSize: '31px', bSize: '16px' },
                                            { h: 'h5', b: 'body-base',   space: 'var(--spacing-h-s-to-base)',    name: 'H5 + Body Base',   val: '8px',  hSize: '25px', bSize: '16px' },
                                            { h: 'h6', b: 'body-small',  space: 'var(--spacing-h-xs-to-small)',  name: 'H6 + Body Small',  val: '8px',  hSize: '20px', bSize: '14px' }
                                        ].map((pair, idx) => (
                                            <div key={idx} className="spec-card" style={{padding:48}}>
                                                <div style={{fontSize:12, fontWeight:800, marginBottom:32, opacity:0.3, letterSpacing:'0.1em'}}>{pair.name.toUpperCase()}</div>
                                                <div style={{fontSize:13, fontWeight:600, color:'var(--color-text-secondary)', marginBottom:8}}>{pair.hSize}</div>
                                                <window.DS.Text variant={pair.h} style={{marginTop:0}}>Precision Engineering for Modern Web Products</window.DS.Text>
                                                
                                                <div className="spacing-indicator" style={{height: pair.val === '16px' ? 32 : (pair.val === '12px' ? 24 : 16)}}>
                                                    <div className="spacing-label">
                                                        <span style={{opacity:0.6}}>{pair.space.replace('var(--','').replace(')','')}</span>
                                                        <span style={{borderLeft:'1px solid rgba(13,95,255,0.3)', paddingLeft:8}}>{pair.val}</span>
                                                    </div>
                                                </div>

                                                <div style={{fontSize:13, fontWeight:600, color:'var(--color-text-secondary)', marginBottom:8}}>{pair.bSize}</div>
                                                <window.DS.Text variant={pair.b} style={{marginTop:0}}>
                                                    Our design system is built with a focus on hierarchy and legibility. Every combination is carefully measured to ensure optimal reading experiences across all viewport sizes.
                                                </window.DS.Text>
                                            </div>
                                        ))}
                                    </div>
                                </Section>
                            </div>
                        )}

                        {activeTab === 'components' && (
                            <div style={{display:'flex', flexDirection:'column', gap:64}}>
                                <Section title="Interactive Buttons">
                                    <div className="spec-card">
                                        <div style={{display:'flex', gap:20, alignItems:'center', flexWrap:'wrap'}}>
                                            {['xl', 'lg', 'md', 'sm', 'xs'].map(s => <window.DS.Button key={s} size={s}>Button {s.toUpperCase()}</window.DS.Button>)}
                                            <window.DS.Button type="secondary">Secondary</window.DS.Button>
                                            <window.DS.Button type="tertiary">Tertiary</window.DS.Button>
                                            <window.DS.Button loading>Loading</window.DS.Button>
                                        </div>
                                    </div>
                                </Section>
                                <Section title="Form Inputs">
                                    <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(340px, 1fr))', gap:32}}>
                                        <div className="spec-card"><window.DS.Input label="Default View" placeholder="Search components..." /></div>
                                        <div className="spec-card"><window.DS.Input label="Success Validation" success="Component verified" value="Design System v2.0" /></div>
                                        <div className="spec-card"><window.DS.Input label="Error Validation" error="This field is required" /></div>
                                    </div>
                                </Section>
                                <Section title="Status Badges">
                                    <div className="spec-card" style={{display:'flex', gap:16, flexWrap:'wrap'}}>
                                        {['success', 'warning', 'error', 'info', 'neutral', 'brand'].map(v => <window.DS.Badge key={v} variant={v} dot>{v.toUpperCase()}</window.DS.Badge>)}
                                    </div>
                                </Section>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
