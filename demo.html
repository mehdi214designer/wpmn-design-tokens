      --input-hint-color: var(--color-text-secondary);

      /* Shadow tokens — Figma: Elevation (Shadows) node 39:12034 */
      --shadow-hard-100:  0px 1px  3px  0px rgba(0,0,0,0.20);
      --shadow-hard-200:  0px 2px  2px  0px rgba(0,0,0,0.17);
      --shadow-hard-300:  0px 3px  4px  0px rgba(0,0,0,0.17);
      --shadow-hard-400:  0px 4px  5px  0px rgba(0,0,0,0.15);
      --shadow-hard-500:  0px 6px  10px 0px rgba(0,0,0,0.10);
      --shadow-hard-600:  0px 8px  10px 0px rgba(0,0,0,0.10);
      --shadow-hard-700:  0px 9px  12px 0px rgba(0,0,0,0.10);
      --shadow-hard-800:  0px 12px 17px 0px rgba(0,0,0,0.10);
      --shadow-hard-900:  0px 16px 24px 0px rgba(0,0,0,0.10);
      --shadow-hard-1000: 0px 24px 38px 0px rgba(0,0,0,0.10);
      --shadow-soft-100: 0px  12px  12px -15px rgba(0,0,16,0.10);
      --shadow-soft-200: 0px  24px  12px -24px rgba(0,0,16,0.15);
      --shadow-soft-300: 0px  24px  24px -24px rgba(0,0,16,0.15);
      --shadow-soft-400: 0px  24px  48px -20px rgba(0,0,16,0.10);
      --shadow-soft-500: 30px 45px  84px -25px rgba(0,0,16,0.15);
      --shadow-soft-600: 0px  72px  72px -40px rgba(0,0,16,0.10);
      --shadow-soft-700: 0px  96px  96px -45px rgba(0,0,16,0.10);
      --shadow-soft-800: 0px  72px  96px -18px rgba(0,0,16,0.10);

      --font-family-base: 'Work Sans', sans-serif;
      --font-weight-regular: 400;
      --font-weight-medium: 500;
      --font-weight-semibold: 600;
      --font-weight-bold: 700;
      --font-size-h1: 61px; --font-size-h2: 49px; --font-size-h3: 39px;
      --font-size-h4: 31px; --font-size-h5: 25px; --font-size-h6: 20px;
      --font-size-body-large: 20px; --font-size-body-medium: 18px;
      --font-size-body-base: 16px; --font-size-body-small: 14px;
      --font-size-body-label: 13px; --font-size-body-mono: 10px;
      --font-lh-h1: 73px; --font-lh-h2: 59px; --font-lh-h3: 47px;
      --font-lh-h4: 37px; --font-lh-h5: 30px; --font-lh-h6: 24px;
      --font-lh-body-large: 30px; --font-lh-body-medium: 27px;
      --font-lh-body-base: 24px; --font-lh-body-small: 21px;
      --font-lh-body-label: 20px; --font-lh-body-mono: 15px;
      --font-size-btn-xl: 23px; --font-size-btn-lg: 20px;
      --font-size-btn-md: 18px; --font-size-btn-sm: 16px; --font-size-btn-xs: 13px;
      --font-lh-btn-xl: 28px; --font-lh-btn-lg: 24px;
      --font-lh-btn-md: 20px; --font-lh-btn-sm: 18px; --font-lh-btn-xs: 16px;
    }

    /* Dark Mode */
    [data-theme="dark"] {
      --color-text-primary: var(--primitive-light-0);
      --color-text-secondary: var(--primitive-light-100);
      --color-text-primary-invert: var(--primitive-dark-800);
      --color-text-secondary-invert: var(--primitive-dark-500);
      --color-text-brand: var(--primitive-accent-200);
      --color-surface-primary: var(--primitive-dark-800);
      --color-surface-secondary: var(--primitive-light-0);
      --color-surface-icon-primary: var(--primitive-light-0);
      --color-surface-icon-primary-invert: var(--primitive-dark-700);
      --color-brand-surface: var(--primitive-primary-200);
      --color-brand-surface-secondary: var(--primitive-accent-100);
      --color-border-primary: var(--primitive-dark-700);
      --color-border-primary-invert: var(--primitive-light-100);
      --color-success-primary: var(--primitive-success-400);
      --color-warning-primary: var(--primitive-warning-400);
      --color-error-primary: var(--primitive-error-500);
      --btn-bg-enable: var(--primitive-primary-100);
      --btn-bg-hovered: var(--primitive-primary-200);
      --btn-bg-pressed: var(--primitive-primary-300);
      --btn-bg-focused: var(--primitive-primary-600);
      --btn-bg-disabled: var(--primitive-primary-800);
      --input-stroke-default: #2e3748;
      --input-stroke-hover: #3d4f69;
      --input-stroke-active: #6d9fff;
      --input-stroke-error: #ff6666;
      --input-stroke-success: #55eb47;
      --input-stroke-disable: #2e3748;
      --input-text-default: #838da0;
      --input-text-hover: #dbdee4;
      --input-text-active: #ffffff;
      --input-text-disable: #4e5d78;
      --input-fill-default: #1d252e;
      --input-fill-hover: #2d3745;
      --input-fill-active: #07090c;
      --input-fill-disable: #151b24;
    }

    /* Typography classes */
    .text-h1 { font-family: var(--font-family-base); font-size: var(--font-size-h1); line-height: var(--font-lh-h1); font-weight: var(--font-weight-bold); }
    .text-h2 { font-family: var(--font-family-base); font-size: var(--font-size-h2); line-height: var(--font-lh-h2); font-weight: var(--font-weight-bold); }
    .text-h3 { font-family: var(--font-family-base); font-size: var(--font-size-h3); line-height: var(--font-lh-h3); font-weight: var(--font-weight-semibold); }
    .text-h4 { font-family: var(--font-family-base); font-size: var(--font-size-h4); line-height: var(--font-lh-h4); font-weight: var(--font-weight-semibold); }
    .text-h5 { font-family: var(--font-family-base); font-size: var(--font-size-h5); line-height: var(--font-lh-h5); font-weight: var(--font-weight-medium); }
    .text-h6 { font-family: var(--font-family-base); font-size: var(--font-size-h6); line-height: var(--font-lh-h6); font-weight: var(--font-weight-medium); }
    .text-body-large  { font-family: var(--font-family-base); font-size: var(--font-size-body-large);  line-height: var(--font-lh-body-large);  font-weight: var(--font-weight-regular); }
    .text-body-medium { font-family: var(--font-family-base); font-size: var(--font-size-body-medium); line-height: var(--font-lh-body-medium); font-weight: var(--font-weight-regular); }
    .text-body-base   { font-family: var(--font-family-base); font-size: var(--font-size-body-base);   line-height: var(--font-lh-body-base);   font-weight: var(--font-weight-regular); }
    .text-body-small  { font-family: var(--font-family-base); font-size: var(--font-size-body-small);  line-height: var(--font-lh-body-small);  font-weight: var(--font-weight-regular); }
    .text-body-label  { font-family: var(--font-family-base); font-size: var(--font-size-body-label);  line-height: var(--font-lh-body-label);  font-weight: var(--font-weight-medium); }
    .text-body-mono   { font-family: monospace;                font-size: var(--font-size-body-mono);   line-height: var(--font-lh-body-mono);   font-weight: var(--font-weight-regular); }

    /* Button */
    .wpmn-btn {
      position: relative; display: inline-flex; align-items: center; justify-content: center;
      overflow: hidden; background: transparent; cursor: pointer; text-decoration: none;
      white-space: nowrap; font-family: var(--font-family-base); outline: none;
      transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
      border: 1.5px solid transparent;
    }
    .wpmn-btn--xl { height: 64px; padding: 0 32px; gap: 8px; border-radius: var(--primitive-radius-xs); font-size: var(--font-size-btn-xl); line-height: var(--font-lh-btn-xl); font-weight: var(--font-weight-semibold); }
    .wpmn-btn--lg { height: 56px; padding: 0 32px; gap: 8px; border-radius: var(--primitive-radius-xs); font-size: var(--font-size-btn-lg); line-height: var(--font-lh-btn-lg); font-weight: var(--font-weight-semibold); }
    .wpmn-btn--md { height: 48px; padding: 0 24px; gap: 8px; border-radius: var(--primitive-radius-xs); font-size: var(--font-size-btn-md); line-height: var(--font-lh-btn-md); font-weight: var(--font-weight-medium); }
    .wpmn-btn--sm { height: 40px; padding: 0 20px; gap: 4px; border-radius: var(--primitive-radius-xs); font-size: var(--font-size-btn-sm); line-height: var(--font-lh-btn-sm); font-weight: var(--font-weight-medium); }
    .wpmn-btn--xs { height: 32px; padding: 0 16px; gap: 4px; border-radius: var(--primitive-radius-xxs); font-size: var(--font-size-btn-xs); line-height: var(--font-lh-btn-xs); font-weight: var(--font-weight-medium); }
    .wpmn-btn__icon-left  { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .wpmn-btn__icon-right { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .wpmn-btn--primary { background-color: var(--btn-bg-enable); color: var(--color-text-primary-invert); border-color: transparent; box-shadow: inset 3px 4px 4px 0px rgba(255,255,255,0.3); }
    .wpmn-btn--primary:hover:not(:disabled):not(.wpmn-btn--disabled) { background-color: var(--btn-bg-hovered); }
    .wpmn-btn--primary:active:not(:disabled):not(.wpmn-btn--disabled) { background-color: var(--btn-bg-pressed); }
    .wpmn-btn--secondary { background-color: transparent; color: var(--btn-bg-enable); border: 1.5px solid var(--btn-bg-enable); box-shadow: none; }
    .wpmn-btn--secondary:hover:not(:disabled):not(.wpmn-btn--disabled) { background-color: var(--btn-bg-enable); color: var(--color-text-primary-invert); }
    .wpmn-btn--secondary:active:not(:disabled):not(.wpmn-btn--disabled) { background-color: var(--btn-bg-hovered); border-color: var(--btn-bg-hovered); color: var(--color-text-primary-invert); }
    .wpmn-btn--tertiary { background-color: transparent; color: var(--btn-bg-enable); border-color: transparent; box-shadow: none; }
    .wpmn-btn--tertiary:hover:not(:disabled):not(.wpmn-btn--disabled) { background-color: var(--btn-bg-focused); }
    .wpmn-btn:disabled, .wpmn-btn--disabled { cursor: not-allowed; pointer-events: none; }
    .wpmn-btn--primary:disabled, .wpmn-btn--primary.wpmn-btn--disabled { background-color: var(--btn-bg-disabled); color: var(--color-text-primary-invert); border-color: transparent; box-shadow: none; }
    .wpmn-btn--secondary:disabled, .wpmn-btn--secondary.wpmn-btn--disabled { background-color: transparent; color: var(--btn-bg-disabled); border-color: var(--btn-bg-disabled); }
    .wpmn-btn--tertiary:disabled, .wpmn-btn--tertiary.wpmn-btn--disabled { color: var(--btn-bg-disabled); }
    .wpmn-btn--loading { cursor: wait; pointer-events: none; }
    .wpmn-btn__spinner { width: 1em; height: 1em; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: wpmn-spin 0.55s linear infinite; flex-shrink: 0; }
    .wpmn-btn__label { display: inline; }
    @keyframes wpmn-spin { to { transform: rotate(360deg); } }
    .wpmn-btn--full { width: 100%; }

    /* Badge — WPMN Design System (Figma: node 40:12056) */
    .wpmn-badge { display: inline-flex; align-items: center; width: fit-content; white-space: nowrap; font-family: "SF Pro", "SF Pro Display", ui-sans-serif, system-ui, sans-serif; font-weight: 650; font-variation-settings: 'wdth' 132; text-transform: uppercase; background-color: var(--badge-bg); color: var(--badge-color); }
    /* variants */
    .wpmn-badge--pill { padding: 8px 24px; border-radius: 100px; font-size: 20px; line-height: 32px; letter-spacing: -0.2px; }
    .wpmn-badge--soft { padding: 12px 24px; border-radius: 16px; font-size: 26px; line-height: 40px; letter-spacing: -0.26px; }
    /* type colors — light */
    .wpmn-badge--in_progress    { --badge-bg: #FFF5DB; --badge-color: #D07D00; }
    .wpmn-badge--completed      { --badge-bg: #E9FFEA; --badge-color: #0A9C55; }
    .wpmn-badge--experimental   { --badge-bg: #E9F4FF; --badge-color: #0076E2; }
    .wpmn-badge--deprecated     { --badge-bg: #FFF1F1; --badge-color: #CF2A2A; }
    .wpmn-badge--handoff_ready  { --badge-bg: rgba(115,87,255,0.12); --badge-color: #7357FF; }
    /* type colors — dark */
    [data-theme="dark"] .wpmn-badge--in_progress   { --badge-bg: rgba(255,203,69,0.2);   --badge-color: #FFDD86; }
    [data-theme="dark"] .wpmn-badge--completed     { --badge-bg: rgba(111,218,166,0.2);  --badge-color: #A6E9C8; }
    [data-theme="dark"] .wpmn-badge--experimental  { --badge-bg: rgba(113,187,255,0.2);  --badge-color: #A0D2FF; }
    [data-theme="dark"] .wpmn-badge--deprecated    { --badge-bg: rgba(255,167,167,0.2);  --badge-color: #FFC7C7; }
    [data-theme="dark"] .wpmn-badge--handoff_ready { --badge-bg: rgba(188,175,255,0.2);  --badge-color: #FFFFFF; }

    /* Input */
    .wpmn-input-wrapper { display: flex; flex-direction: column; gap: 6px; width: 100%; }
    .wpmn-input__label { font-family: var(--font-family-base); font-size: var(--font-size-body-label); line-height: var(--font-lh-body-label); font-weight: var(--font-weight-medium); color: var(--input-label-color); }
    .wpmn-input__label--required::after { content: ' *'; color: var(--color-error-primary); }
    .wpmn-input__field-wrap { position: relative; display: flex; align-items: center; width: 100%; }
    .wpmn-input__field { width: 100%; height: 48px; padding: 0 12px; font-family: var(--font-family-base); font-size: var(--font-size-body-small); line-height: var(--font-lh-body-small); font-weight: var(--font-weight-regular); color: var(--input-text-active); background-color: transparent; border: 1px solid var(--input-stroke-default); border-radius: var(--primitive-radius-xs); outline: none; transition: border-color 120ms ease, background-color 120ms ease; box-sizing: border-box; -webkit-appearance: none; }
    .wpmn-input__field::placeholder { color: var(--input-text-default); }
    .wpmn-input--lg .wpmn-input__field { height: 56px; }
    .wpmn-input--sm .wpmn-input__field { height: 40px; }
    .wpmn-input--stroke .wpmn-input__field:hover:not(:disabled) { border-color: var(--input-stroke-hover); }
    .wpmn-input--stroke .wpmn-input__field:focus:not(:disabled) { border-color: var(--input-stroke-active); }
    .wpmn-input--stroke.wpmn-input--error .wpmn-input__field { border-color: var(--input-stroke-error); color: var(--input-text-error); }
    .wpmn-input--stroke.wpmn-input--success .wpmn-input__field { border-color: var(--input-stroke-success); color: var(--input-text-success); }
    .wpmn-input--stroke .wpmn-input__field:disabled { border-color: var(--input-stroke-disable); color: var(--input-text-disable); cursor: not-allowed; }
    .wpmn-input--fill .wpmn-input__field { background-color: var(--input-fill-default); border-color: transparent; }
    .wpmn-input--fill .wpmn-input__field:hover:not(:disabled) { background-color: var(--input-fill-hover); }
    .wpmn-input--fill .wpmn-input__field:focus:not(:disabled) { background-color: var(--input-fill-active); border-color: var(--input-stroke-active); }
    .wpmn-input--fill.wpmn-input--error .wpmn-input__field { background-color: var(--primitive-error-50); border-color: transparent; color: var(--input-text-error); }
    .wpmn-input--fill.wpmn-input--success .wpmn-input__field { background-color: var(--primitive-success-50); border-color: transparent; color: var(--input-text-success); }
    .wpmn-input--fill .wpmn-input__field:disabled { background-color: var(--input-fill-disable); border-color: transparent; color: var(--input-text-disable); cursor: not-allowed; }
    .wpmn-input__field--icon-left { padding-left: 40px; }
    .wpmn-input__field--icon-right { padding-right: 40px; }
    .wpmn-input__field--icon-right-lg { padding-right: 44px; }
    .wpmn-input__field--icon-both { padding-left: 40px; padding-right: 40px; }
    .wpmn-input__icon { position: absolute; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; pointer-events: none; color: var(--input-text-default); }
    .wpmn-input__icon--left { left: 12px; width: 20px; height: 20px; }
    .wpmn-input__icon--right { right: 12px; width: 20px; height: 20px; }
    .wpmn-input__icon--right-error { right: 12px; width: 24px; height: 24px; color: var(--input-text-error); }
    .wpmn-input--success .wpmn-input__icon--right { color: var(--input-text-success); }
    .wpmn-input__hint { font-family: var(--font-family-base); font-size: var(--font-size-body-small); line-height: var(--font-lh-body-small); color: var(--input-hint-color); }
    .wpmn-input__hint--error   { color: var(--input-text-error); }
    .wpmn-input__hint--success { color: var(--input-text-success); }

    /* NavBar */
    .wpmn-navbar { display: flex; align-items: center; justify-content: space-between; padding: 24px 48px; background-color: var(--color-surface-primary); width: 100%; box-sizing: border-box; position: relative; border-bottom: 1px solid var(--color-border-primary); }
    .wpmn-navbar__logo { display: flex; align-items: center; flex-shrink: 0; text-decoration: none; }
    .wpmn-navbar__nav { display: flex; align-items: center; gap: 20px; }
    .wpmn-navbar__links { display: flex; align-items: center; gap: 8px; list-style: none; margin: 0; padding: 0; }
    .wpmn-navbar__link { display: inline-flex; align-items: center; justify-content: center; padding: 10px 12px; font-family: var(--font-family-base); font-size: 16px; line-height: 24px; font-weight: var(--font-weight-regular); color: var(--color-text-secondary); text-decoration: none; white-space: nowrap; border-radius: var(--primitive-radius-xs); transition: color 120ms ease, background-color 120ms ease; }
    .wpmn-navbar__link:hover { color: var(--color-text-primary); background-color: var(--primitive-light-25); }
    .wpmn-navbar__link--active { color: var(--btn-bg-enable); font-weight: var(--font-weight-medium); }
    .wpmn-navbar__cta { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 8px 20px; font-family: var(--font-family-base); font-size: 16px; line-height: 20px; font-weight: var(--font-weight-medium); text-decoration: none; white-space: nowrap; border-radius: var(--primitive-radius-xs); box-sizing: border-box; cursor: pointer; transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; flex-shrink: 0; }
    .wpmn-navbar__cta--primary { background-color: var(--btn-bg-enable); color: var(--color-text-primary-invert); border: none; box-shadow: inset 3px 4px 4px 0px rgba(255,255,255,0.3); }
    .wpmn-navbar__cta--primary:hover { background-color: var(--btn-bg-hovered); }
    .wpmn-navbar__mobile-controls { display: none; }
    .wpmn-navbar__mobile-menu { display: none; }
    .wpmn-navbar__hamburger { display: none; }

    /* Breadcrumbs — WPMN Design System (Figma: node 482-46694) */
    .wpmn-breadcrumbs { display:inline-flex; align-items:center; box-sizing:border-box; }
    .wpmn-breadcrumbs__list { display:inline-flex; align-items:center; list-style:none; margin:0; padding:0; gap:0; }
    .wpmn-breadcrumbs__list-item { display:inline-flex; align-items:center; }
    .wpmn-breadcrumbs__item { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px; border-radius:16.8px; font-family:var(--font-family-base,'Work Sans',sans-serif); font-size:18px; font-weight:500; line-height:20px; color:var(--color-text-secondary,#4e5d78); text-decoration:none; white-space:nowrap; cursor:pointer; transition:color 120ms ease,background-color 120ms ease; user-select:none; }
    .wpmn-breadcrumbs__item--icon { padding-left:20px; padding-right:20px; }
    .wpmn-breadcrumbs__item-icon { display:inline-flex; align-items:center; flex-shrink:0; }
    .wpmn-breadcrumbs__item--active { cursor:default; pointer-events:none; }
    .wpmn-breadcrumbs__sep { display:inline-flex; align-items:center; justify-content:center; width:12px; height:12px; flex-shrink:0; }
    /* sep uses SVG currentColor — inherits color from theme, no separate assets needed */
    /* border */
    .wpmn-breadcrumbs--border { height:64px; border:1.5px solid var(--color-border-primary,#dbdee4); border-radius:16px; overflow:hidden; padding:0 4px; }
    .wpmn-breadcrumbs--border .wpmn-breadcrumbs__item { height:100%; border-radius:16px; color:var(--color-text-secondary,#4e5d78); }
    .wpmn-breadcrumbs--border .wpmn-breadcrumbs__item:hover { color:#1a1aa9; }
    .wpmn-breadcrumbs--border .wpmn-breadcrumbs__item--active { color:var(--color-text-secondary,#4e5d78); }
    /* flat */
    .wpmn-breadcrumbs--flat { height:64px; background-color:#f6f7f8; border-radius:16px; padding:0 4px; }
    .wpmn-breadcrumbs--flat .wpmn-breadcrumbs__item { height:100%; color:var(--color-text-primary,#07090c); }
    .wpmn-breadcrumbs--flat .wpmn-breadcrumbs__item:hover { color:#1a1aa9; }
    .wpmn-breadcrumbs--flat .wpmn-breadcrumbs__item--active { color:#1a1aa9; }
    /* transparent */
    .wpmn-breadcrumbs--transparent { height:64px; }
    .wpmn-breadcrumbs--transparent .wpmn-breadcrumbs__item { color:var(--color-text-primary,#07090c); }
    .wpmn-breadcrumbs--transparent .wpmn-breadcrumbs__item:hover { color:#1a1aa9; }
    .wpmn-breadcrumbs--transparent .wpmn-breadcrumbs__item--active { color:#1a1aa9; }
    /* text */
    .wpmn-breadcrumbs--text .wpmn-breadcrumbs__item { font-size:16px; padding:4px 8px; border-radius:6px; color:var(--color-text-primary,#07090c); }
    .wpmn-breadcrumbs--text .wpmn-breadcrumbs__item:hover { color:#1a1aa9; background:transparent; }
    .wpmn-breadcrumbs--text .wpmn-breadcrumbs__item--active { color:#1a1aa9; font-weight:600; }
    .wpmn-breadcrumbs--text .wpmn-breadcrumbs__sep { width:10px; opacity:0.4; }
    /* dark — border */
    [data-theme="dark"] .wpmn-breadcrumbs--border { border-color:#0f1218; }
    [data-theme="dark"] .wpmn-breadcrumbs--border .wpmn-breadcrumbs__item { color:#fff; }
    [data-theme="dark"] .wpmn-breadcrumbs--border .wpmn-breadcrumbs__item--active { color:#8080ec; }
    [data-theme="dark"] .wpmn-breadcrumbs--border .wpmn-breadcrumbs__item:hover { color:#8080ec; }
    /* dark — flat */
    [data-theme="dark"] .wpmn-breadcrumbs--flat { background-color:rgba(255,255,255,0.07); }
    [data-theme="dark"] .wpmn-breadcrumbs--flat .wpmn-breadcrumbs__item { color:#fff; }
    [data-theme="dark"] .wpmn-breadcrumbs--flat .wpmn-breadcrumbs__item:hover { color:#8080ec; }
    [data-theme="dark"] .wpmn-breadcrumbs--flat .wpmn-breadcrumbs__item--active { color:#8080ec; }
    /* dark — transparent */
    [data-theme="dark"] .wpmn-breadcrumbs--transparent .wpmn-breadcrumbs__item { color:#fff; }
    [data-theme="dark"] .wpmn-breadcrumbs--transparent .wpmn-breadcrumbs__item--active { color:#8080ec; }
    [data-theme="dark"] .wpmn-breadcrumbs--transparent .wpmn-breadcrumbs__item:hover { color:#8080ec; }
    /* dark — text */
    [data-theme="dark"] .wpmn-breadcrumbs--text .wpmn-breadcrumbs__item { color:#fff; }
    [data-theme="dark"] .wpmn-breadcrumbs--text .wpmn-breadcrumbs__item--active { color:#8080ec; }

    /* SocialIcons — WPMN Design System (Figma: node 957-5265) */
    .wpmn-social-icons { display:flex; align-items:center; justify-content:space-between; }
    .wpmn-social-icon-btn { display:inline-flex; align-items:center; justify-content:center; width:var(--si-size,32px); height:var(--si-size,32px); border-radius:6.4px; background:linear-gradient(180deg,rgba(0,0,16,0.05) 0%,rgba(0,0,16,0.02) 100%); text-decoration:none; flex-shrink:0; transition:opacity 120ms ease,transform 120ms ease; }
    .wpmn-social-icon-btn:hover { opacity:0.65; transform:translateY(-1px); }
    .wpmn-social-icon-btn svg { display:block; pointer-events:none; }
    [data-theme="dark"] .wpmn-social-icon-btn { background:linear-gradient(180deg,rgba(255,255,255,0.08) 0%,rgba(255,255,255,0.04) 100%); }
    /* SVG uses currentColor — dark mode color inherited from parent, no filter hack needed */

    /* Footer — WPMN Design System (Figma: node 957-4223) */
    .wpmn-footer { width:100%; background-color:var(--color-surface-primary); padding:96px 120px; display:flex; flex-direction:column; gap:128px; box-sizing:border-box; font-family:var(--font-family-base,'Work Sans',sans-serif); }
    .wpmn-footer__top { display:flex; align-items:flex-start; justify-content:space-between; width:100%; gap:40px; }
    .wpmn-footer__brand { display:flex; flex-direction:column; gap:40px; width:361px; flex-shrink:0; }
    .wpmn-footer__address { font-size:16px; line-height:24px; font-weight:400; color:var(--color-text-primary,#000016); margin:0; }
    .wpmn-footer__social { display:flex; align-items:center; justify-content:space-between; }
    .wpmn-footer__social-btn { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:6.4px; background:linear-gradient(180deg,rgba(0,0,16,0.05) 0%,rgba(0,0,16,0.02) 100%); color:var(--color-text-primary,#000016); text-decoration:none; flex-shrink:0; transition:opacity 120ms ease; }
    .wpmn-footer__social-btn:hover { opacity:0.6; }
    .wpmn-footer__nav { display:flex; flex-direction:column; gap:12px; flex-shrink:0; }
    .wpmn-footer__nav-title { font-size:25px; font-weight:600; line-height:1.2; color:var(--color-text-primary,#07090c); margin:0; padding:10px 10px 10px 16px; white-space:nowrap; }
    .wpmn-footer__nav-list { display:flex; flex-direction:column; gap:8px; list-style:none; margin:0; padding:0; }
    .wpmn-footer__nav-link { display:block; font-size:16px; line-height:24px; font-weight:400; color:var(--color-text-secondary,#4e5d78); text-decoration:none; padding:10px 10px 10px 16px; white-space:nowrap; transition:color 120ms ease; }
    .wpmn-footer__nav-link:hover { color:var(--color-text-primary,#07090c); }
    .wpmn-footer__bottom { display:flex; align-items:center; justify-content:space-between; width:100%; }
    .wpmn-footer__bottom-logo { flex-shrink:0; }
    .wpmn-footer__logo-img { height:32px; width:auto; display:block; }
    .wpmn-footer__logo-text { font-size:16px; font-weight:700; color:var(--color-text-primary); }
    .wpmn-footer__bottom-right { display:flex; align-items:center; gap:32px; }
    .wpmn-footer__copyright { font-size:16px; line-height:1.5; color:#000040; }
    .wpmn-footer__bottom-link { font-size:16px; line-height:1.5; color:#000040; text-decoration:none; transition:opacity 120ms ease; }
    .wpmn-footer__bottom-link:hover { opacity:0.65; }
    [data-theme="dark"] .wpmn-footer__social-btn { background:linear-gradient(180deg,rgba(255,255,255,0.08) 0%,rgba(255,255,255,0.04) 100%); color:var(--color-text-primary,#fff); }
    [data-theme="dark"] .wpmn-footer__copyright, [data-theme="dark"] .wpmn-footer__bottom-link { color:var(--color-text-secondary); }
    @media(max-width:768px) { .wpmn-footer { padding:48px 24px; gap:56px; } .wpmn-footer__top { flex-wrap:wrap; gap:48px; } .wpmn-footer__brand { width:100%; } .wpmn-footer__bottom { flex-direction:column; align-items:flex-start; gap:20px; } }

    /* ── Page layout ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--color-surface-primary); color: var(--color-text-primary); font-family: var(--font-family-base); transition: background 0.25s ease; }

    .app-shell { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px; flex-shrink: 0;
      padding: 32px 20px;
      border-right: 1px solid var(--color-border-primary);
      background: var(--color-surface-primary);
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
      transition: width 200ms ease, padding 200ms ease;
    }
    .sidebar.collapsed {
      width: 0; padding: 32px 0; border-right: none; overflow: hidden;
    }
    .sidebar.collapsed > * { display: none; }
    .sidebar-toggle {
      position: absolute; top: 28px; right: 14px;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border: 1.5px solid var(--color-border-primary); border-radius: 8px;
      background: var(--color-surface-primary); color: var(--color-text-secondary);
      cursor: pointer; transition: color 120ms ease, background-color 120ms ease;
      z-index: 10;
    }
    .sidebar-toggle:hover { color: var(--color-text-primary); background: var(--color-border-primary); }
    .sidebar-toggle--floating {
      position: fixed; top: 16px; left: 16px; z-index: 400;
      box-shadow: var(--shadow-hard-300);
      display: flex !important;
    }
    .sidebar-logo { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; color: var(--btn-bg-enable); margin-bottom: 8px; }
    .sidebar-sub { font-size: 11px; color: var(--color-text-secondary); margin-bottom: 32px; letter-spacing: 0.04em; text-transform: uppercase; }
    .sidebar-section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-secondary); margin: 20px 0 8px; padding: 0 8px; }
    .nav-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--color-text-secondary); margin-bottom: 2px; font-weight: 500; font-size: 14px; transition: all 0.15s; }
    .nav-item:hover { background: var(--color-border-primary); color: var(--color-text-primary); }
    .nav-item.active { background: var(--btn-bg-enable); color: white; }

    .main { flex: 1; padding: 60px 64px; min-width: 0; }
    .page-header { margin-bottom: 64px; }
    .section { margin-bottom: 80px; }
    .section-title { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-secondary); margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--color-border-primary); }
    .card { background: var(--color-surface-primary); border: 1px solid var(--color-border-primary); border-radius: 16px; padding: 32px; margin-bottom: 16px; }

    /* Brand grid */
    .brand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .brand-card {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 16px 12px; border-radius: 12px; cursor: pointer;
      border: 2px solid var(--color-border-primary);
      background: var(--color-surface-primary);
      transition: all 0.2s; text-align: center;
    }
    .brand-card:hover { border-color: var(--color-text-secondary); transform: translateY(-2px); }
    .brand-card.selected { border-color: var(--btn-bg-enable); box-shadow: 0 0 0 3px var(--btn-bg-focused); }
    .brand-dot { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; }
    .brand-name { font-size: 12px; font-weight: 600; color: var(--color-text-primary); line-height: 1.3; }
    .brand-key  { font-size: 10px; color: var(--color-text-secondary); font-family: monospace; }

    /* Color scale */
    .scale-grid { display: flex; gap: 4px; border-radius: 12px; overflow: hidden; }
    .scale-step { flex: 1; height: 48px; position: relative; cursor: default; }
    .scale-step:first-child { border-radius: 8px 0 0 8px; }
    .scale-step:last-child  { border-radius: 0 8px 8px 0; }
    .scale-label { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 9px; color: var(--color-text-secondary); white-space: nowrap; font-weight: 600; }

    /* Row layout for button/badge demo */
    .demo-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
    .demo-row-label { font-size: 11px; font-weight: 700; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; min-width: 80px; }

    /* Typography preview */
    .type-row { display: flex; gap: 24px; align-items: baseline; padding: 20px 0; border-bottom: 1px solid var(--color-border-primary); }
    .type-meta { min-width: 120px; flex-shrink: 0; }
    .type-meta .label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-secondary); }
    .type-meta .value { font-size: 11px; color: var(--color-text-secondary); font-family: monospace; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useId } = React;

    /* ── Error boundary — prevents one bad component from crashing the page ── */
    class CompErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { err: null }; }
      static getDerivedStateFromError(err) { return { err }; }
      componentDidCatch(err, info) { console.error('[DS] Render error:', err, info); }
      render() {
        if (this.state.err) {
          return (
            <div style={{padding:'16px',background:'var(--primitive-error-50)',borderRadius:8,border:'1px solid var(--input-stroke-error)',marginBottom:4}}>
              <p style={{margin:0,fontSize:13,color:'var(--color-error-primary)',fontWeight:600}}>
                ⚠ Render error: {this.state.err.message}
              </p>
              <p style={{margin:'4px 0 0',fontSize:11,color:'var(--color-text-secondary)'}}>
                Check the browser console for details.
              </p>
            </div>
          );
        }
        return this.props.children;
      }
    }

    /* ── Brand definitions ─────────────────────────────────── */
    const BRANDS = [
      { key: 'wpmanagenia',    name: 'WPManageNinja',  color: '#0D5FFF' },
      { key: 'fluentforms',    name: 'FluentForms',    color: '#2B6CFF' },
      { key: 'fluentcrm',      name: 'FluentCRM',      color: '#BA4CDE' },
      { key: 'fluentbooking',  name: 'FluentBooking',  color: '#2653c5' },
      { key: 'fluentcommunity',name: 'FluentCommunity',color: '#485ce0' },
      { key: 'ninjatables',    name: 'Ninja Tables',   color: '#046EC0' },
      { key: 'paymattic',      name: 'Paymattic',      color: '#ff6a00' },
      { key: 'fluentboards',   name: 'FluentBoards',   color: '#F1EB62' },
      { key: 'fluentsmtp',     name: 'FluentSMTP',     color: '#c516c0' },
      { key: 'fluentsupport',  name: 'FluentSupport',  color: '#00B36D' },
      { key: 'fluentaffiliate',name: 'FluentAffiliate',color: '#2C6AE2' },
      { key: 'azonpress',      name: 'AzonPress',      color: '#ffc800' },
      { key: 'wpsocialninja',  name: 'WP Social Ninja',color: '#5B2DD4' },
      { key: 'fluentcart',     name: 'FluentCart',     color: '#0000D9' },
      { key: 'fluentplayer',   name: 'FluentPlayer',   color: '#0163DD' },
      { key: 'fluentmembers',  name: 'FluentMembers',  color: '#824EEB' },
    ];

    const SCALE_STEPS = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950];

    /* ── Small components ──────────────────────────────────── */
    const Button = ({ type='primary', size='md', disabled=false, loading=false, children, onClick }) => {
      const isDisabled = disabled || loading;
      const cls = ['wpmn-btn', `wpmn-btn--${type}`, `wpmn-btn--${size}`, isDisabled ? 'wpmn-btn--disabled' : '', loading ? 'wpmn-btn--loading' : ''].filter(Boolean).join(' ');
      return (
        <button className={cls} disabled={isDisabled} onClick={!isDisabled ? onClick : undefined}>
          {loading && <span className="wpmn-btn__spinner" aria-hidden="true" />}
          <span className="wpmn-btn__label">{children}</span>
        </button>
      );
    };

    const BADGE_LABELS = { in_progress:'IN PROGRESS', completed:'COMPLETED', experimental:'EXPERIMENTAL', deprecated:'DEPRECATED', handoff_ready:'HANDOFF READY' };
    const Badge = ({ variant='pill', type='in_progress', className='', children, ...rest }) => {
      const cls = ['wpmn-badge', `wpmn-badge--${variant}`, `wpmn-badge--${type}`, className].filter(Boolean).join(' ');
      return <span className={cls} {...rest}>{children ?? BADGE_LABELS[type] ?? type}</span>;
    };

    const AlertCircleIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="1.75"/><path d="M12 8v4" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round"/><circle cx="12" cy="16" r="0.75" fill="currentColor" stroke="currentColor" strokeWidth="0.5"/>
      </svg>
    );
    const CheckCircleIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="1.75"/><path d="M7.5 12l3 3 6-6" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
    );

    const Input = ({ variant='stroke', size='md', label, placeholder, hint, error, success, disabled=false }) => {
      const id = useId();
      const hasError = Boolean(error);
      const hasSuccess = Boolean(success) && !hasError;
      const rightIcon = hasError ? <AlertCircleIcon /> : hasSuccess ? <CheckCircleIcon /> : null;
      const wrapClass = ['wpmn-input-wrapper', `wpmn-input--${variant}`, size !== 'md' ? `wpmn-input--${size}` : '', hasError ? 'wpmn-input--error' : '', hasSuccess ? 'wpmn-input--success' : ''].filter(Boolean).join(' ');
      const fieldClass = ['wpmn-input__field', rightIcon ? (hasError ? 'wpmn-input__field--icon-right-lg' : 'wpmn-input__field--icon-right') : ''].filter(Boolean).join(' ');
      return (
        <div className={wrapClass}>
          {label && <label htmlFor={id} className="wpmn-input__label">{label}</label>}
          <div className="wpmn-input__field-wrap">
            <input id={id} className={fieldClass} placeholder={placeholder} disabled={disabled} />
            {rightIcon && <span className={hasError ? 'wpmn-input__icon wpmn-input__icon--right-error' : 'wpmn-input__icon wpmn-input__icon--right'}>{rightIcon}</span>}
          </div>
          {(error || success || hint) && <span className={['wpmn-input__hint', hasError ? 'wpmn-input__hint--error' : '', hasSuccess ? 'wpmn-input__hint--success' : ''].filter(Boolean).join(' ')}>{error || success || hint}</span>}
        </div>
      );
    };

    const ArrowRightIcon = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 12h14" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><path d="M13 6l6 6-6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
    );

    /* Logo component — resolves to logos/{brand}/{variant}-{type}.svg */
    const Logo = ({ brand, variant='logo', type='primary', height=24, width, style={}, className='', alt }) => {
      if (!brand) return null;
      const src = `logos/${brand}/${variant}-${type}.svg`;
      return (
        <img
          src={src}
          alt={alt || brand}
          height={height}
          width={width}
          style={{ display:'block', ...style }}
          className={className}
          onError={e => { e.target.style.opacity = 0.15; }}
        />
      );
    };

    /* Logo variant config: [variantKey, label, bg, textColor] */
    const LOGO_VARIANTS = [
      ['primary',  'Primary',  '#ffffff',                    '#000'],
      ['dark',     'Dark',     '#f6f7f8',                    '#000'],
      ['inverted', 'Inverted', 'var(--primitive-primary-500)','#fff'],
      ['black',    'Black',    '#ffffff',                    '#000'],
      ['white',    'White',    '#07090c',                    '#fff'],
    ];

    /* ── Pages ─────────────────────────────────────────────── */

    const BrandPage = ({ brand, theme }) => {
      const b = BRANDS.find(x => x.key === brand) || BRANDS[0];
      const logoType = theme === 'dark' ? 'white' : 'primary';
      return (
        <div>
          <div className="page-header">
            <div style={{ display:'flex', alignItems:'center', gap:16, marginBottom:12 }}>
              <Logo brand={b.key} variant="icon" type={logoType} height={48} />
              <div>
                <h1 className="text-h4" style={{ margin:0, color:'var(--color-text-primary)' }}>{b.name}</h1>
                <code style={{ fontSize:12, color:'var(--color-text-secondary)' }}>data-brand="{b.key}"</code>
              </div>
            </div>
            <p className="text-body-base" style={{ color:'var(--color-text-secondary)', margin:0 }}>
              Each brand overrides <code>--primitive-primary-*</code> (and optionally <code>--primitive-accent-*</code>). All semantic tokens cascade automatically — no component changes needed.
            </p>
          </div>

          {/* Color scale */}
          <div className="section">
            <div className="section-title">Primary Color Scale</div>
            <div style={{ paddingBottom:32 }}>
              <div className="scale-grid">
                {SCALE_STEPS.map(s => (
                  <div key={s} className="scale-step" style={{ background:`var(--primitive-primary-${s})` }} title={`--primitive-primary-${s}`}>
                    <div className="scale-label">{s}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Buttons */}
          <div className="section">
            <div className="section-title">Buttons — All Types & Sizes</div>
            <div className="card">
              {[['Primary','primary'],['Secondary','secondary'],['Tertiary','tertiary']].map(([label, type]) => (
                <div key={type} className="demo-row">
                  <div className="demo-row-label">{label}</div>
                  {['xl','lg','md','sm','xs'].map(s => <Button key={s} type={type} size={s}>{s.toUpperCase()}</Button>)}
                </div>
              ))}
              <div className="demo-row">
                <div className="demo-row-label">Loading</div>
                {['xl','lg','md','sm','xs'].map(s => <Button key={s} type="primary" size={s} loading>{s.toUpperCase()}</Button>)}
              </div>
              <div className="demo-row" style={{ marginBottom:0 }}>
                <div className="demo-row-label">Disabled</div>
                {['xl','lg','md','sm','xs'].map(s => <Button key={s} type="primary" size={s} disabled>{s.toUpperCase()}</Button>)}
              </div>
            </div>
          </div>

          {/* Badges */}
          <div className="section">
            <div className="section-title">Badges</div>
            <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
              <div style={{ display:'flex', gap:8, flexWrap:'wrap', alignItems:'center' }}>
                <span style={{ fontSize:11, fontWeight:700, color:'var(--color-text-secondary)', textTransform:'uppercase', minWidth:40 }}>Pill</span>
                {['in_progress','completed','experimental','deprecated','handoff_ready'].map(t=>(
                  <Badge key={t} variant="pill" type={t} />
                ))}
              </div>
              <div style={{ display:'flex', gap:8, flexWrap:'wrap', alignItems:'center' }}>
                <span style={{ fontSize:11, fontWeight:700, color:'var(--color-text-secondary)', textTransform:'uppercase', minWidth:40 }}>Soft</span>
                {['in_progress','completed','experimental','deprecated','handoff_ready'].map(t=>(
                  <Badge key={t} variant="soft" type={t} />
                ))}
              </div>
            </div>
          </div>

          {/* Inputs */}
          <div className="section">
            <div className="section-title">Inputs</div>

            {/* Sizes */}
            <div style={{ marginBottom:8, fontSize:12, fontWeight:700, color:'var(--color-text-secondary)', textTransform:'uppercase', letterSpacing:'0.06em' }}>Sizes</div>
            <div className="card" style={{ marginBottom:24 }}>
              <div style={{ display:'flex', flexDirection:'column', gap:20 }}>
                <div style={{ display:'grid', gridTemplateColumns:'80px 1fr', alignItems:'center', gap:16 }}>
                  <span style={{ fontSize:11, fontWeight:700, color:'var(--color-text-secondary)', textTransform:'uppercase', letterSpacing:'0.05em' }}>LG · 56px</span>
                  <Input variant="stroke" size="lg" label="Large" placeholder="56px height" />
                </div>
                <div style={{ display:'grid', gridTemplateColumns:'80px 1fr', alignItems:'center', gap:16 }}>
                  <span style={{ fontSize:11, fontWeight:700, color:'var(--color-text-secondary)', textTransform:'uppercase', letterSpacing:'0.05em' }}>MD · 48px</span>
                  <Input variant="stroke" size="md" label="Medium" placeholder="48px height" />
                </div>
                <div style={{ display:'grid', gridTemplateColumns:'80px 1fr', alignItems:'center', gap:16 }}>
                  <span style={{ fontSize:11, fontWeight:700, color:'var(--color-text-secondary)', textTransform:'uppercase', letterSpacing:'0.05em' }}>SM · 40px</span>
                  <Input variant="stroke" size="sm" label="Small" placeholder="40px height" />
                </div>
              </div>
            </div>

            {/* Stroke variant */}
            <div style={{ marginBottom:8, fontSize:12, fontWeight:700, color:'var(--color-text-secondary)', textTransform:'uppercase', letterSpacing:'0.06em' }}>Stroke Variant — All States</div>

    const RAW_LIB_BASE = 'https://raw.githubusercontent.com/mehdi214designer/wpmn-design-tokens/master/';
    let LIB_BASE = '';
    async function fetchTextLib(path) {
      const res = await fetch(LIB_BASE + path);
      if (!res.ok) throw new Error(`HTTP ${res.status} loading ${path}`);
      return res.text();
    }
    function stripModuleSyntax(code) {
      return code
        .replace(/^import\s[\s\S]*?from\s+['"].*?['"];?\s*$/gm, '')
        .replace(/^import\s+['"].*?['"];?\s*$/gm, '')
        .replace(/^export\s+default\s+/gm, '')
        .replace(/^export\s+/gm, '');
    }

    /* ── Dynamic component loader ───────────────────────────── */
    // Strips import/export syntax, transpiles JSX with Babel, evals into window.DS.
    // Optional dataPath (e.g. Logo's logos.js) is fetched and prepended.
    async function loadComponent(jsxPath, name, dataPath) {
      const sources = [];
      if (dataPath) sources.push(await fetchTextLib(dataPath));
      sources.push(await fetchTextLib(jsxPath));
      let code = sources.map(stripModuleSyntax).join('\n\n');
      // find the main exported name (heuristic: last function/class/const declaration)
      const nameMatch = code.match(/(?:function|class)\s+(\w+)|const\s+(\w+)\s*=/g);
      const exportedName = nameMatch
        ? nameMatch[nameMatch.length - 1].replace(/(?:function|class|const)\s+/, '').replace(/\s*=.*/, '')
        : name;
      const wrapped = `(function(){
        const {useState,useEffect,useId,useMemo,useCallback,useRef,useContext,createContext}=React;
        ${code}
        window.DS = window.DS || {};
        window.DS['${name}'] = typeof ${name} !== 'undefined' ? ${name} : (typeof ${exportedName} !== 'undefined' ? ${exportedName} : undefined);
      })();`;
      const transpiled = Babel.transform(wrapped, { presets: ['react'] }).code;
      // eslint-disable-next-line no-eval
      eval(transpiled);
    }

    /* ── Demo file loader — components/<Name>/demo.jsx ──────── */
    async function loadDemoFile(demoPath, name) {
      const source = stripModuleSyntax(await fetchTextLib(demoPath));
      const wrapped = `(function(){
        const {useState,useEffect,useId}=React;
        ${source}
        window.DS = window.DS || {};
        window.DS.__demos = window.DS.__demos || {};
        window.DS.__demos['${name}'] = typeof Demo !== 'undefined' ? Demo : undefined;
      })();`;
      eval(Babel.transform(wrapped, { presets: ['react'] }).code);
    }

      return (
        <button className={cls} onClick={async () => {
          try {
            const text = await getText();
            await navigator.clipboard.writeText(text);
            setSt('done');
          } catch (e) { console.warn('[DS] copy failed:', e.message); setSt('fail'); }
          setTimeout(() => setSt('idle'), 1500);
        }}>{st === 'done' ? '✓ Copied' : st === 'fail' ? 'Failed' : label}</button>
      );

        ];
        const rowStyle = { display:'flex', flexDirection:'column', gap:8, marginBottom:24 };
        const labelStyle = { fontSize:11, fontWeight:700, color:'var(--color-text-secondary)', textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:12 };
        return (
          <div>
            {['border','flat','transparent','text'].map(v => (
              <div key={v} style={rowStyle}>
                <div style={labelStyle}>{v}</div>
                <window.DS.Breadcrumbs variant={v} items={ITEMS} />
              </div>
            ))}
          </div>
        );
      },
      SocialIcons: () => (
        <div style={{display:'flex',flexDirection:'column',gap:32}}>
          <div>
            <div style={{fontSize:11,fontWeight:700,color:'var(--color-text-secondary)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:16}}>All icons — default size (32px)</div>
            <window.DS.SocialIcons />
          </div>
          <div>
            <div style={{fontSize:11,fontWeight:700,color:'var(--color-text-secondary)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:16}}>Large (48px)</div>
            <window.DS.SocialIcons size={48} />
          </div>
          <div>
            <div style={{fontSize:11,fontWeight:700,color:'var(--color-text-secondary)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:16}}>Subset</div>
            <window.DS.SocialIcons links={[{icon:'facebook',href:'#',label:'Facebook'},{icon:'x',href:'#',label:'X'},{icon:'linkedin',href:'#',label:'LinkedIn'}]} />
          </div>
        </div>
      ),
      Footer: () => (
        <div style={{margin:'-32px',borderRadius:'0 0 16px 16px',overflow:'hidden'}}>
          <window.DS.Footer
            logoSrc="logos/wpmanagenia/logo-primary.svg"
            logoAlt="WPManageNinja"
          />
        </div>
      ),
      Text: () => (
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {['h1','h2','h3','h4','h5','h6'].map(v=>(
            <window.DS.Text key={v} variant={v}>Heading {v.toUpperCase()} — Design System</window.DS.Text>
          ))}
          {['body-large','body-medium','body-base','body-small','body-label','body-mono'].map(v=>(
            <window.DS.Text key={v} variant={v}>Body {v} — The quick brown fox jumps over the lazy dog.</window.DS.Text>
          ))}
        </div>
      ),
    };

    /* ── Lazy mount — render heavy previews only when scrolled into view ── */
    const LazyMount = ({ children, placeholder = 160 }) => {
      const ref = React.useRef(null);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        if (visible || !ref.current) return;
        if (!('IntersectionObserver' in window)) { setVisible(true); return; }
        const io = new IntersectionObserver(entries => {
          entries.forEach(e => { if (e.isIntersecting) { setVisible(true); io.disconnect(); } });
        }, { rootMargin: '400px 0px' });
        io.observe(ref.current);
        return () => io.disconnect();
      }, [visible]);
      return <div ref={ref}>{visible ? children : <div style={{height: placeholder, display:'flex', alignItems:'center', justifyContent:'center', color:'var(--color-text-secondary)', fontSize:13}}>Scroll to load preview…</div>}</div>;
    };

    /* ── Filter chip — multi-select toggle ───────────────────── */
    const FilterChip = ({ label, count, active, onClick }) => (
      <span onClick={onClick}
        style={{
          display:'inline-flex', alignItems:'center', gap:6,
          padding:'7px 14px', borderRadius:99, fontSize:13, cursor:'pointer', userSelect:'none',
          fontWeight: active ? 600 : 400,
          background: active ? 'var(--btn-bg-enable)' : 'transparent',
          color: active ? 'var(--color-text-primary-invert)' : 'var(--color-text-secondary)',
          border: '1.5px solid ' + (active ? 'var(--btn-bg-enable)' : 'var(--color-border-primary)'),
          transition: 'background-color 120ms ease, color 120ms ease, border-color 120ms ease',
          whiteSpace:'nowrap',
        }}>
        {label}{count !== undefined && <span style={{fontSize:11,opacity:0.75}}>{count}</span>}
      </span>
    );

    /* ── Components page — filter rail + tabs + sort + density ── */
    const ComponentsPage = ({ theme, brand, mode = 'components' }) => {
      const [comps, setComps]     = useState([]);
      const [loaded, setLoaded]   = useState({});
      const [htmlMap, setHtmlMap] = useState({});
      const [status, setStatus]   = useState('loading');
      const [tab, setTab]         = useState('All');               // top-level category tab
      const [subs, setSubs]       = useState([]);                  // multi-select subcategories
      const [kinds, setKinds]     = useState([]);                  // multi-select: react | html
      const [q, setQ]             = useState('');
      const [sort, setSort]       = useState('default');
      const [density, setDensity] = useState(1);
      const [catOpen, setCatOpen] = useState(true);
      const [kindOpen, setKindOpen] = useState(true);
      const searchRef             = React.useRef(null);

      useEffect(() => {
        let cancelled = false;
        const init = async () => {
          /* shared cache so switching Components/Sections pages doesn't refetch everything */
          window.__libCache = window.__libCache || { registry: null, html: {}, loaded: {} };
          const cache = window.__libCache;
          if (cache.registry) {
            if (cancelled) return;
            setComps(cache.list);
            setHtmlMap(cache.html);
            setLoaded(cache.loaded);
            setStatus('ready');
            return;
          }
          let registry = null;
          try { registry = JSON.parse(await fetchTextLib('registry.json')); }
          catch (e1) {
            try { LIB_BASE = RAW_LIB_BASE; registry = JSON.parse(await fetchTextLib('registry.json')); }
            catch (e2) { LIB_BASE = ''; }
          }
          let list = [];
          if (registry) {
            list = registry.components.map(c => ({
              name: c.name,
              type: c.type === 'html' ? 'html' : 'react',
              jsx:  c.files && c.files.jsx,
              css:  c.files && c.files.css,
              data: c.files && c.files.data,
              html: c.files && c.files.html,
              meta: c,
            }));
          } else {
            try {
              const res  = await fetch('/api/components');
              const api  = await res.json();
              list = api.map(c => ({ ...c, type: 'react', meta: null }));
            } catch (e3) {
              if (!cancelled) setStatus('error');
              return;
            }
          }
          if (cancelled) return;
          setComps(list);
          for (const comp of list) {
            try {
              if (comp.css) {
                if (!document.querySelector(`style[data-css="${comp.css}"]`)) {
                  const css = await fetchTextLib(comp.css);
                  const tag = document.createElement('style');
                  tag.setAttribute('data-css', comp.css);
                  tag.textContent = css.replace(/@import[^;]+;/g, '');
                  document.head.appendChild(tag);
                }
              }
              if (comp.type === 'html' && comp.html) {
                const html = cache.html[comp.name] || await fetchTextLib(comp.html);
                cache.html[comp.name] = html;
                if (!cancelled) setHtmlMap(prev => ({ ...prev, [comp.name]: html }));
              } else if (comp.jsx && !(window.DS && window.DS[comp.name])) {
                await loadComponent(comp.jsx, comp.name, comp.data);
              }
              if (comp.meta && comp.meta.demo && !COMPONENT_DEMOS[comp.name] &&
                  !(window.DS && window.DS.__demos && window.DS.__demos[comp.name])) {
                try { await loadDemoFile(comp.meta.demo, comp.name); }
                catch (e) { console.warn(`[DS] demo load failed for ${comp.name}:`, e.message); }
              }
              cache.loaded[comp.name] = 'ok';
              if (!cancelled) setLoaded(prev => ({ ...prev, [comp.name]: 'ok' }));
            } catch (e) {
              console.warn(`[DS] Could not load ${comp.name}:`, e.message);
              cache.loaded[comp.name] = 'error';
              if (!cancelled) setLoaded(prev => ({ ...prev, [comp.name]: 'error' }));
            }
          }
          cache.registry = true;
          cache.list = list;
          if (!cancelled) setStatus('ready');
        };
        init();
        return () => { cancelled = true; };
      }, []);

      useEffect(() => {
        const onKey = e => {
          if (e.key === '/' && document.activeElement !== searchRef.current &&
              !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
            e.preventDefault();
            if (searchRef.current) searchRef.current.focus();
          }
          if (e.key === 'Escape' && document.activeElement === searchRef.current) {
            setQ('');
            searchRef.current.blur();
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      if (status === 'loading' && comps.length === 0) return (
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:300,flexDirection:'column',gap:16}}>
          <div style={{width:36,height:36,border:'3px solid var(--color-border-primary)',borderTopColor:'var(--btn-bg-enable)',borderRadius:'50%',animation:'wpmn-spin 0.7s linear infinite'}} />
          <span style={{color:'var(--color-text-secondary)',fontSize:14}}>Discovering components…</span>
        </div>
      );

      if (status === 'error') return (
        <div style={{color:'var(--color-error-primary)',padding:32}}>
          Could not load <code>registry.json</code> (or reach <code>/api/components</code>). Check your connection, or run <code>node scripts/build-registry.mjs</code> and reload.
        </div>
      );

      const catOf = c => (c.meta && c.meta.category) || 'Other';
      const subOf = c => (c.meta && c.meta.subcategory) || 'General';

      // Components tab = atoms (Foundations/Components/Brand). Sections tab = page patterns.
      const isSection = c => catOf(c) === 'Sections';
      const base = comps.filter(c => mode === 'sections' ? isSection(c) : !isSection(c));
      // in sections mode the top tabs are the section groups (subcategories)
      const groupOf = mode === 'sections' ? subOf : catOf;

      // top-level tabs with counts
      const tabCounts = { All: base.length };
      base.forEach(c => { tabCounts[groupOf(c)] = (tabCounts[groupOf(c)] || 0) + 1; });
      const tabs = ['All', ...Object.keys(tabCounts).filter(t => t !== 'All').sort()];

      // subcategory cloud (within active tab) with counts
      const subCounts = {};
      base.forEach(c => {
        if (tab !== 'All' && groupOf(c) !== tab) return;
        subCounts[subOf(c)] = (subCounts[subOf(c)] || 0) + 1;
      });

      const toggle = (arr, setArr, v) =>
        setArr(arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v]);

      const words = q.toLowerCase().split(/\s+/).filter(Boolean);
      const haystack = c => (
        c.name + ' ' + ((c.meta && c.meta.id) || '') + ' ' + catOf(c) + ' ' + subOf(c) + ' ' +
        ((c.meta && c.meta.description) || '') + ' ' +
        ((c.meta && c.meta.tags) ? c.meta.tags.join(' ') : '')
      ).toLowerCase();

      let shown = base.filter(c => {
        if (tab !== 'All' && groupOf(c) !== tab) return false;
        if (subs.length && !subs.includes(subOf(c))) return false;
        if (kinds.length && !kinds.includes(c.type)) return false;
        if (words.length) {
          const hay = haystack(c);
          if (!words.every(w => hay.indexOf(w) !== -1)) return false;
        }
        return true;
      });

      if (sort === 'name-asc')  shown = [...shown].sort((a, b) => a.name.localeCompare(b.name));
      if (sort === 'name-desc') shown = [...shown].sort((a, b) => b.name.localeCompare(a.name));
      if (sort === 'category')  shown = [...shown].sort((a, b) => (catOf(a) + subOf(a) + a.name).localeCompare(catOf(b) + subOf(b) + b.name));

      const activeFilterCount = subs.length + kinds.length + (q ? 1 : 0) + (tab !== 'All' ? 1 : 0);
      const clearAll = () => { setTab('All'); setSubs([]); setKinds([]); setQ(''); };

      const groupLabel = { fontSize:15, fontWeight:600, color:'var(--color-text-primary)', display:'flex', alignItems:'center', justifyContent:'space-between', cursor:'pointer', userSelect:'none', padding:'4px 0' };
      const chev = open => (
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style={{transform: open ? 'rotate(0deg)' : 'rotate(180deg)', transition:'transform 150ms ease'}}>
          <path d="M6 15l6-6 6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      );

      const tabPill = active => ({
        display:'inline-flex', alignItems:'center', gap:8,
        padding:'10px 20px', borderRadius:99, fontSize:14, cursor:'pointer', userSelect:'none',
        fontWeight: active ? 600 : 500,
        background: active ? 'var(--btn-bg-enable)' : 'transparent',
        color: active ? 'var(--color-text-primary-invert)' : 'var(--color-text-primary)',
        border: '1.5px solid ' + (active ? 'var(--btn-bg-enable)' : 'var(--color-border-primary)'),
        transition: 'background-color 120ms ease, color 120ms ease',
        whiteSpace:'nowrap',
      });

      const densityBtn = active => ({
        width:36, height:36, display:'inline-flex', alignItems:'center', justifyContent:'center',
        borderRadius:'var(--radius-xsm)', cursor:'pointer',
        background: active ? 'var(--btn-bg-focused)' : 'transparent',
        color: active ? 'var(--btn-bg-hovered)' : 'var(--color-text-secondary)',
        border:'1.5px solid var(--color-border-primary)',
      });

      const jumpTo = name => {
        const el = document.getElementById('lib-' + name);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      const renderCard = comp => {
        const state    = loaded[comp.name];
        const DemoFn   = COMPONENT_DEMOS[comp.name] || (window.DS && window.DS.__demos && window.DS.__demos[comp.name]);
        const Comp     = window.DS?.[comp.name];
        const meta     = comp.meta;
        const isHtml   = comp.type === 'html';
        const tags     = (meta && meta.tags) || [];
        const wide     = density === 2 && meta && meta.span === 2;

        const copyPrompt = () => fetchTextLib(meta.prompt);
        const copyCode   = async () => {
          const paths = Object.values(meta.files || {});
          const contents = await Promise.all(paths.map(fetchTextLib));
          const header = `/*\n * WPMN Design System — ${comp.name}\n * Requires token CSS loaded first:\n * ${RAW_LIB_BASE}index.css\n */\n\n`;
          return header + contents.map((c, i) => `/* ===== ${paths[i]} ===== */\n\n${c}`).join('\n\n');
        };

        return (
          <div key={comp.name} id={'lib-' + comp.name}
            style={{scrollMarginTop:96, gridColumn: wide ? '1 / -1' : 'auto',
              border:'1.5px solid var(--color-border-primary)', borderRadius:'var(--radius-md)', overflow:'hidden',
              display:'flex', flexDirection:'column', background:'var(--color-surface-primary)'}}>
            {/* preview on top, like the reference */}
            <div style={{borderBottom:'1.5px solid var(--color-border-primary)', padding:32, overflowX:'auto',
              background:'color-mix(in srgb, var(--color-text-primary) 3%, var(--color-surface-primary))'}}>
              {state === 'ok' && isHtml && htmlMap[comp.name] && (
                <div style={{margin:-32}}>
                  <LazyMount placeholder={220}>
                    <CompErrorBoundary key={comp.name + '-html'}><HtmlSection html={htmlMap[comp.name]} /></CompErrorBoundary>
                  </LazyMount>
                </div>
              )}
              {state === 'ok' && !isHtml && DemoFn && (
                <LazyMount placeholder={160}>
                  <CompErrorBoundary key={comp.name + '-demo'}><DemoFn /></CompErrorBoundary>
                </LazyMount>
              )}
              {state === 'ok' && !isHtml && !DemoFn && Comp && <Comp />}
              {state === 'error' && <p style={{color:'var(--color-error-primary)',margin:0,fontSize:13}}>Failed to load — check the console.</p>}
              {!state && (
                <div style={{height:48,display:'flex',alignItems:'center',gap:10,color:'var(--color-text-secondary)'}}>
                  <div style={{width:16,height:16,border:'2px solid currentColor',borderTopColor:'transparent',borderRadius:'50%',animation:'wpmn-spin 0.6s linear infinite'}} />
                  Loading…
                </div>
              )}
            </div>
            {/* info below */}
            <div style={{padding:'16px 22px 20px', display:'flex', flexDirection:'column', gap:8, flex:1}}>
              <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
                <span style={{fontSize:18,fontWeight:600,color:'var(--color-text-primary)'}}>{comp.name}</span>
                <span style={{fontSize:11,color:'var(--color-text-secondary)'}}>{catOf(comp)} / {subOf(comp)}</span>
                <span style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.05em',padding:'2px 8px',borderRadius:99,
                  background:'var(--btn-bg-focused)',color:'var(--btn-bg-hovered)'}}>{isHtml ? 'section' : 'react'}</span>
              </div>
              {meta && meta.description && (
                <p style={{fontSize:13,lineHeight:'20px',color:'var(--color-text-secondary)',margin:0}}>{meta.description}</p>
              )}
              {tags.length > 0 && (
                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                  {tags.map(t => (
                    <span key={t} onClick={() => setQ(t)} title={'Search “' + t + '”'}
                      style={{fontSize:11,padding:'2px 10px',borderRadius:99,cursor:'pointer',
                        border:'1px solid var(--color-border-primary)',color:'var(--color-text-secondary)'}}>{t}</span>
                  ))}
                </div>
              )}
              {meta && (
                <div style={{display:'flex',gap:8,marginTop:6}}>
                  <CopyBtn label="Copy Prompt" getText={copyPrompt} />
                  <CopyBtn label="Copy Code" secondary getText={copyCode} />
                </div>
              )}
            </div>
          </div>
        );
      };

      return (
        <div>
          <div className="page-header">
            <h1 className="text-h4" style={{margin:'0 0 8px',color:'var(--color-text-primary)'}}>{mode === 'sections' ? 'Sections' : 'Components'}</h1>
            <p className="text-body-base" style={{color:'var(--color-text-secondary)',margin:0}}>
              {mode === 'sections'
                ? <>Ready-made page patterns: heroes, grids, pricing, scroll effects, and more. Token-driven, brand-aware, copy-paste ready. <strong>Copy Prompt</strong> gives an AI build spec, <strong>Copy Code</strong> gives the section source.</>
                : <>UI building blocks from the design system: buttons, inputs, navigation, brand assets. <strong>Copy Prompt</strong> gives an AI build spec, <strong>Copy Code</strong> gives the full source.</>}
            </p>
          </div>

          {/* ── top bar: tabs + sort + density ── */}
          <div style={{position:'sticky',top:0,zIndex:40,background:'var(--color-surface-primary)',
            borderBottom:'1.5px solid var(--color-border-primary)',padding:'16px 0 14px',margin:'20px 0 24px',
            display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
            <div style={{display:'flex',gap:8,flexWrap:'wrap',flex:1}}>
              {tabs.map(t => (
                <span key={t} style={tabPill(tab === t)} onClick={() => { setTab(t); setSubs([]); }}>
                  {t} <span style={{fontSize:11,opacity:0.75}}>{tabCounts[t]}</span>
                </span>
              ))}
            </div>
            <span style={{fontSize:13,color:'var(--color-text-secondary)',whiteSpace:'nowrap'}}>Sort by:</span>
            <select value={sort} onChange={e => setSort(e.target.value)}
              style={{height:36,padding:'0 10px',fontFamily:'inherit',fontSize:13,fontWeight:500,
                color:'var(--color-text-primary)',background:'var(--color-surface-primary)',
                border:'1.5px solid var(--color-border-primary)',borderRadius:99,outline:'none',cursor:'pointer'}}>
              <option value="default">Default</option>
              <option value="name-asc">Name A–Z</option>
              <option value="name-desc">Name Z–A</option>
              <option value="category">Category</option>
            </select>
            <span style={{display:'inline-flex',gap:6}}>
              <span style={densityBtn(density === 1)} onClick={() => setDensity(1)} title="List view">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="6" rx="1.5" stroke="currentColor" strokeWidth="2"/><rect x="3" y="14" width="18" height="6" rx="1.5" stroke="currentColor" strokeWidth="2"/></svg>
              </span>
              <span style={densityBtn(density === 2)} onClick={() => setDensity(2)} title="Grid view">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" strokeWidth="2"/><rect x="13" y="3" width="8" height="8" rx="1.5" stroke="currentColor" strokeWidth="2"/><rect x="3" y="13" width="8" height="8" rx="1.5" stroke="currentColor" strokeWidth="2"/><rect x="13" y="13" width="8" height="8" rx="1.5" stroke="currentColor" strokeWidth="2"/></svg>
              </span>
            </span>
          </div>

          {/* ── filter rail + results ── */}
          <div style={{display:'flex',gap:28,alignItems:'flex-start'}}>
            <aside style={{width:230,flexShrink:0,position:'sticky',top:84,
              border:'1.5px solid var(--color-border-primary)',borderRadius:'var(--radius-md)',padding:'18px 18px 22px'}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
                <span style={{fontSize:16,fontWeight:600,color:'var(--color-text-primary)'}}>Filters</span>
                {activeFilterCount > 0 && (
                  <span style={{fontSize:11,fontWeight:600,background:'var(--btn-bg-enable)',color:'var(--color-text-primary-invert)',
                    borderRadius:99,padding:'1px 8px'}}>{activeFilterCount}</span>
                )}
                {activeFilterCount > 0 && (
                  <span onClick={clearAll} style={{marginLeft:'auto',fontSize:12,color:'var(--btn-bg-enable)',cursor:'pointer'}}>Clear</span>
                )}
              </div>

              {/* search inside the rail */}
              <div style={{position:'relative',marginBottom:18}}>
                <input ref={searchRef} value={q} onChange={e => setQ(e.target.value)}
                  placeholder="Search…  ( / )"
                  style={{width:'100%',height:40,padding:'0 32px 0 12px',fontFamily:'inherit',fontSize:13,
                    color:'var(--input-text-active)',border:'1px solid var(--input-stroke-default)',
                    borderRadius:'var(--radius-xsm)',background:'transparent',outline:'none',boxSizing:'border-box'}} />
                {q && <span onClick={() => setQ('')} style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',cursor:'pointer',color:'var(--color-text-secondary)',fontSize:14}}>✕</span>}
              </div>

              <div style={{borderTop:'1.5px solid var(--color-border-primary)',paddingTop:14,marginBottom:6}}>
                <div style={groupLabel} onClick={() => setCatOpen(o => !o)}>Categories {chev(catOpen)}</div>
                {catOpen && (
                  <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:10}}>
                    {Object.keys(subCounts).sort().map(ss => (
                      <FilterChip key={ss} label={ss} count={subCounts[ss]} active={subs.includes(ss)}
                        onClick={() => toggle(subs, setSubs, ss)} />
                    ))}
                  </div>
                )}
                {catOpen && (
                  <div onClick={() => setCatOpen(false)} style={{marginTop:12,fontSize:12,color:'var(--btn-bg-enable)',cursor:'pointer'}}>— Hide</div>
                )}
              </div>

              <div style={{borderTop:'1.5px solid var(--color-border-primary)',paddingTop:14,marginTop:14}}>
                <div style={groupLabel} onClick={() => setKindOpen(o => !o)}>Kind {chev(kindOpen)}</div>
                {kindOpen && (
                  <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:10}}>
                    <FilterChip label="React component" count={base.filter(c=>c.type==='react').length}
                      active={kinds.includes('react')} onClick={() => toggle(kinds, setKinds, 'react')} />
                    <FilterChip label="HTML section" count={base.filter(c=>c.type==='html').length}
                      active={kinds.includes('html')} onClick={() => toggle(kinds, setKinds, 'html')} />
                  </div>
                )}
              </div>
            </aside>

            <div style={{flex:1,minWidth:0}}>

          <div className="main">
            <CompErrorBoundary key={page}>
              {page === 'components' && <ComponentsPage theme={theme} brand={brand} mode="components" />}
              {page === 'sections'   && <ComponentsPage theme={theme} brand={brand} mode="sections" />}
              {page === 'brand'      && <BrandPage brand={brand} theme={theme} />}
              {page === 'allbrands'  && <AllBrandsPage theme={theme} />}
              {page === 'tokens'     && <TokensPage />}
              {page === 'typography'  && <TypographyPage />}
              {page === 'guidelines'  && <GuidelinesPage theme={theme} brand={brand} />}
            </CompErrorBoundary>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <!-- ── Live reload ─────────────────────────────────────────── -->
  <script>
    (function () {
      function connect() {
        const es = new EventSource('/livereload');
        es.onmessage = function (e) {
          if (e.data === 'reload') {
            console.log('[DS] file changed — reloading…');
            location.reload();
          }
        };
        es.onerror = function () {
          es.close();
          // Retry after 2 s (server may have restarted)
          setTimeout(connect, 2000);
        };
      }
      connect();
    })();
  </script>
</body>
</html>
