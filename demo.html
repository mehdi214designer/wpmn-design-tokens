    /* ── App shell ──────────────────────────────────────────── */
    /* ── Icon browser (Hugeicons Pro, live from local node_modules) ──
       Icon path data is fetched from the locally installed package and parsed
       in the browser. Nothing is committed — a clone without the licensed
       package just shows a "not installed" note. */
    var HI_RAW = {};   // name -> Promise<raw .js text | null>
    function hiRawText(meta, name) {
      if (!HI_RAW[name]) {
        HI_RAW[name] = fetch('/' + meta.dir + '/' + name + meta.suffix)
          .then(function (r) { return r.ok ? r.text() : null; })
          .catch(function () { return null; });
      }
      return HI_RAW[name];
    }
    function hiParseVariant(src, variant) {
      var key = '"' + variant + '":';
      var start = src.indexOf(key);
      if (start < 0) return null;
      var i = start + key.length, depth = 0, end = i;
      for (; i < src.length; i++) {
        if (src[i] === '[') depth++;
        else if (src[i] === ']') { depth--; if (depth === 0) { end = i + 1; break; } }
      }
      var els;
      try { els = Function('return ' + src.slice(start + key.length, end))(); }
      catch (e) { return null; }
      var inner = els.map(function (pair) {
        var tag = pair[0], attrs = pair[1] || {};
        var a = Object.keys(attrs).filter(function (k) { return k !== 'key'; })
          .map(function (k) {
            var kebab = k.replace(/[A-Z]/g, function (c) { return '-' + c.toLowerCase(); });
            return kebab + '="' + attrs[k] + '"';
          }).join(' ');
        return '<' + tag + ' ' + a + '/>';
      }).join('');
      return '<svg viewBox="0 0 24 24" fill="none">' + inner + '</svg>';
    }
    /* Resolve a CSS color (hex or var(--token)) to a concrete rgb() string. */
    function hiResolveColor(c) {
      var el = document.createElement('span');
      el.style.color = ''; el.style.color = c; el.style.display = 'none';
      document.body.appendChild(el);
      var rgb = getComputedStyle(el).color;
      document.body.removeChild(el);
      return rgb || c;
    }

    const HiCell = ({ meta, name, variant }) => {
      var [svg, setSvg] = useState(undefined);
      useEffect(function () {
        var alive = true;
        hiRawText(meta, name).then(function (txt) {
          if (!alive) return;
          setSvg(txt ? hiParseVariant(txt, variant) : null);
        });
        return function () { alive = false; };
      }, [name, variant]);
      if (svg) return <span dangerouslySetInnerHTML={{ __html: svg }} />;
      return null;
    };

    const HiModal = ({ meta, name, iconColor, onClose, onCopy }) => {
      return (
        <div className="hi-modal-backdrop" onClick={onClose}>
          <div className="hi-modal" onClick={function (e) { e.stopPropagation(); }}>
            <div className="hi-modal__head">
              <div>
                <div className="hi-modal__title">{name}</div>
                <div className="hi-modal__sub">Click any variant to copy its inline SVG</div>
              </div>
              <button className="hi-modal__close" onClick={onClose} aria-label="Close">✕</button>
            </div>
            <div className="hi-variants" style={{ color: iconColor }}>
              {meta.variants.map(function (v) {
                return (
                  <div key={v} className="hi-variant" onClick={function () { onCopy(name, v); }} title={'Copy ' + v}>
                    <div className="hi-variant__preview"><HiCell meta={meta} name={name} variant={v} /></div>
                    <div className="hi-variant__label">{v}</div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    };

    const HI_STYLE_ORDER = ['stroke', 'solid', 'duotone', 'bulk', 'twotone'];
    const HI_CORNER_ORDER = ['rounded', 'sharp'];
    const HI_NEUTRALS = [
      { label: 'Ink',  value: 'var(--color-text-primary)' },
      { label: 'Gray', value: 'var(--color-text-secondary)' },
    ];

    const IconsPage = () => {
      var [meta, setMeta] = useState(null);
      var [err, setErr] = useState(false);
      var [query, setQuery] = useState('');
      var [style, setStyle] = useState('stroke');
      var [corner, setCorner] = useState('rounded');
      var [limit, setLimit] = useState(120);
      var [detail, setDetail] = useState(null);
      var [toast, setToast] = useState('');
      var [iconColor, setIconColor] = useState('var(--color-text-primary)');
      var [pickerOpen, setPickerOpen] = useState(false);
      var sentinelRef = React.useRef(null);

      useEffect(function () {
        fetch('/api/hugeicons').then(function (r) { return r.json(); }).then(setMeta).catch(function () { setErr(true); });
      }, []);
      useEffect(function () {
        if (!toast) return;
        var t = setTimeout(function () { setToast(''); }, 1600);
        return function () { clearTimeout(t); };
      }, [toast]);
      /* Infinite scroll: grow the limit as the sentinel nears the viewport. */
      useEffect(function () {
        if (!meta || !meta.installed || !meta.names || !meta.names.length) return;
        var qq = query.trim().toLowerCase();
        var filteredLen = qq ? meta.names.filter(function (n) { return n.indexOf(qq) >= 0; }).length : meta.names.length;
        if (limit >= filteredLen) return;
        var el = sentinelRef.current;
        if (!el) return;
        var io = new IntersectionObserver(function (entries) {
          if (entries[0].isIntersecting) setLimit(function (l) { return l + 120; });
        }, { rootMargin: '800px' });
        io.observe(el);
        return function () { io.disconnect(); };
      }, [meta, query, limit]);

      function doCopy(name, variant) {
        hiRawText(meta, name).then(function (txt) {
          var svg = txt ? hiParseVariant(txt, variant) : null;
          if (!svg) { setToast('No ' + variant + ' for ' + name); return; }
          var col = hiResolveColor(iconColor);
          var out = svg.split('currentColor').join(col);
          try { navigator.clipboard.writeText(out); } catch (e) {}
          setToast('Copied ' + name + ' · ' + variant);
        });
      }

      if (err) return <div className="hi-note">Icon browser needs the local dev server (reads the licensed Hugeicons Pro package, not published here). Run it at <code>localhost:8910</code> to preview icons.</div>;
      if (!meta) return <div className="hi-note">Loading icon library…</div>;
      if (!meta.installed || !meta.names.length) return (
        <div>
          <div className="page-header">
            <h1 style={{ fontSize: 32, fontWeight: 800, margin: 0, color: 'var(--color-text-primary)' }}>Icons</h1>
          </div>
          <div className="hi-note">
            The Hugeicons Pro package isn't installed in this checkout, so there's nothing to preview.
            Run <code>npm install</code> (with the Hugeicons license token set) to populate
            <code>node_modules/@hugeicons/react-pro</code>. Icons load live from your local package and are never committed.
          </div>
        </div>
      );

      var vset = {};
      meta.variants.forEach(function (v) { vset[v] = true; });
      var styles = HI_STYLE_ORDER.filter(function (s) { return meta.variants.some(function (v) { return v.split('.')[0] === s; }); });
      var corners = HI_CORNER_ORDER.filter(function (c) { return vset[style + '.' + c]; });
      var activeCorner = corners.indexOf(corner) >= 0 ? corner : corners[0];
      var variant = style + '.' + activeCorner;

      var q = query.trim().toLowerCase();
      var filtered = q ? meta.names.filter(function (n) { return n.indexOf(q) >= 0; }) : meta.names;
      var shown = filtered.slice(0, limit);
      var cap = function (s) { return s.charAt(0).toUpperCase() + s.slice(1); };

      return (
        <div>
          <div className="page-header">
            <h1 style={{ fontSize: 32, fontWeight: 800, margin: 0, color: 'var(--color-text-primary)' }}>Icons</h1>
            <p style={{ margin: '8px 0 0', color: 'var(--color-text-secondary)', fontSize: 15 }}>
              Hugeicons Pro · {meta.names.length.toLocaleString()} icons · loaded live from your local package
            </p>
          </div>

          <div className="hi-toolbar">
            <div className="hi-search">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" strokeWidth="1.75" /><path d="M20 20l-3-3" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" /></svg>
              <input value={query} onChange={function (e) { setQuery(e.target.value); setLimit(120); }} placeholder="Search by name…" />
            </div>
            <div className="hi-picker-wrap">
              <label className="hi-field" style={{ gap: 4 }}><span style={{ fontSize: 10, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--color-text-secondary)' }}>Color</span></label>
              <button className="hi-colorbtn" onClick={function () { setPickerOpen(function (o) { return !o; }); }} title="Icon color">
                <span className="hi-swatch" style={{ background: iconColor }} />
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" /></svg>
              </button>
              {pickerOpen && (
                <React.Fragment>
                  <div className="hi-pop-backdrop" onClick={function () { setPickerOpen(false); }} />
                  <div className="hi-colorpop">
                    <p className="hi-colorpop__label">Neutral</p>
                    <div className="hi-colorpop__row">
                      {HI_NEUTRALS.map(function (n) {
                        return <div key={n.label} className={'hi-dot' + (iconColor === n.value ? ' sel' : '')} style={{ background: n.value }}
                          title={n.label} onClick={function () { setIconColor(n.value); setPickerOpen(false); }} />;
                      })}
                    </div>
                    <p className="hi-colorpop__label">Brand</p>
                    <div className="hi-colorpop__row">
                      {BRANDS.map(function (b) {
                        return <div key={b.key} className={'hi-dot' + (iconColor === b.color ? ' sel' : '')} style={{ background: b.color }}
                          title={b.name} onClick={function () { setIconColor(b.color); setPickerOpen(false); }} />;
                      })}
                    </div>
                  </div>
                </React.Fragment>
              )}
            </div>
            <div className="hi-field">
              <label>Style</label>
              <select className="hi-select" value={style} onChange={function (e) { setStyle(e.target.value); setLimit(120); }}>
                {styles.map(function (s) { return <option key={s} value={s}>{cap(s)}</option>; })}
              </select>
            </div>
            <div className="hi-field">
              <label>Type</label>
              <select className="hi-select" value={activeCorner} onChange={function (e) { setCorner(e.target.value); }}>
                {corners.map(function (c) { return <option key={c} value={c}>{cap(c)}</option>; })}
              </select>
            </div>
            <div className="hi-count"><b>{filtered.length.toLocaleString()}</b> results · <code>{variant}</code></div>
          </div>

          <div className="hi-grid" style={{ color: iconColor }}>
            {shown.map(function (n) {
              return (
                <div key={n} className="hi-card" onClick={function () { setDetail(n); }} title={n + ' — click for all variants'}>
                  <div className="hi-card__preview"><HiCell meta={meta} name={n} variant={variant} /></div>
                  <div className="hi-card__name">{n}</div>
                </div>
              );
            })}
          </div>

          {!shown.length && <div className="hi-note">No icons match “{query}”.</div>}

          {shown.length < filtered.length && (
            <div ref={sentinelRef} className="hi-sentinel">
              <span className="hi-spinner" aria-hidden="true" />
              Loading more… <b>{(filtered.length - shown.length).toLocaleString()}</b> left
            </div>
          )}

          {detail && <HiModal meta={meta} name={detail} iconColor={iconColor} onClose={function () { setDetail(null); }} onCopy={doCopy} />}
          {toast && <div className="hi-toast">{toast}</div>}
        </div>
      );
    };

    /* ── Skill Library ──────────────────────────────────────────
       Lists the Claude Skills that build/maintain this design system.
       Descriptions + "how to use" body are read live from each skill's
       SKILL.md, never hardcoded — download button pulls the packaged
       .skill straight from the repo. */
    const WPMN_SKILLS = [
      { id: 'wpmn-design-system',        file: 'wpmn-design-system.skill',        src: 'skills-src/wpmn-design-system/SKILL.md' },
      { id: 'wpmn-landing-page-design',  file: 'wpmn-landing-page-design.skill',  src: 'skills-src/wpmn-landing-page-design/SKILL.md' },
      { id: 'wpmn-section-import',       file: 'wpmn-section-import.skill',       src: 'skills-src/wpmn-section-import/SKILL.md' },
      { id: 'wpmn-design-qna',           file: 'wpmn-design-qna.skill',           src: 'skills-src/wpmn-design-qna/SKILL.md' },
      { id: 'wpmn-visual',               file: 'wpmn-visual.skill',               src: 'skills/wpmn-visual/SKILL.md' },
      { id: 'wpmn-live-redesign',        file: 'wpmn-live-redesign.skill',        src: 'skills-src/wpmn-live-redesign/SKILL.md' },
      { id: 'wpmn-redesign',             file: 'wpmn-redesign.skill',             src: 'skills-src/wpmn-redesign/SKILL.md' },
    ];

    /* Hugeicons-style stroke.rounded glyphs, one per skill — inline, no
       runtime import, matches the icon canon used across the demo. */
    const SKILL_ICONS = {
      'wpmn-design-system': <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l8 4-8 4-8-4 8-4Z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/><path d="M4 11l8 4 8-4M4 15l8 4 8-4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>,
      'wpmn-landing-page-design': <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4" width="17" height="16" rx="2.5" stroke="currentColor" strokeWidth="1.6"/><path d="M3.5 9h17" stroke="currentColor" strokeWidth="1.6"/><path d="M8 13h8M8 16.5h5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>,
      'wpmn-section-import': <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v11" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/><path d="M8 10l4 4 4-4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/><path d="M4.5 16v2.5A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5V16" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>,
      'wpmn-design-qna': <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 5-3 7.5-7 9-4-1.5-7-4-7-9V6l7-3Z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/><path d="M9 12l2 2 4-4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>,
      'wpmn-visual': <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" stroke="currentColor" strokeWidth="1.6"/><circle cx="9" cy="10" r="1.6" stroke="currentColor" strokeWidth="1.4"/><path d="M4 16.5l4.5-4 3 2.6L16 10l4 5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>,
      'wpmn-live-redesign': <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4" width="17" height="16" rx="2.5" stroke="currentColor" strokeWidth="1.6"/><path d="M3.5 8.5h17" stroke="currentColor" strokeWidth="1.6"/><path d="M9.5 12.3a3 3 0 0 1 5-1.6M14.5 10.7l.3-1.8-1.8.4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/><path d="M14.5 15.7a3 3 0 0 1-5 1.6M9.5 17.3l-.3 1.8 1.8-.4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>,
      'wpmn-redesign': <svg viewBox="0 0 24 24" fill="none"><path d="M7 3.5h7l4 4V19a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5Z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/><path d="M14 3.5V8h4" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/><circle cx="9.5" cy="13" r="1.4" stroke="currentColor" strokeWidth="1.4"/><path d="M9 16.5h6" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>,
    };

    const SkillDetailModal = ({ skill, onClose, onDownload }) => {
      var [text, setText] = useState(null);
      var [err, setErr] = useState(false);

      useEffect(function () {
        var cancelled = false;
        fetchTextLibSafe(skill.src)
          .then(function (t) { if (!cancelled) setText(t); })
          .catch(function () { if (!cancelled) setErr(true); });
        return function () { cancelled = true; };
      }, [skill.src]);

      var parsed = text ? parseSkillFrontmatter(text) : null;

      return (
        <div className="hi-modal-backdrop" onClick={onClose}>
          <div className="hi-modal" onClick={function (e) { e.stopPropagation(); }} style={{ maxWidth: 720 }}>
            <div className="hi-modal__head">
              <div>
                <div className="hi-modal__title">{skill.id}</div>
                <div className="hi-modal__sub">{skill.src}</div>
              </div>
              <button className="hi-modal__close" onClick={onClose} aria-label="Close">✕</button>
            </div>
            {err && <div className="hi-note">Couldn't load <code>{skill.src}</code>.</div>}
            {!err && !parsed && <div className="hi-note">Loading…</div>}
            {parsed && (
              <div>
                <div style={{ display: 'flex', gap: 8, marginBottom: 20 }}>
                  <Button type="primary" size="sm" onClick={function () { onDownload(skill); }}>Download .skill</Button>
                </div>
                <pre style={{ whiteSpace: 'pre-wrap', fontSize: 13, lineHeight: 1.6, color: 'var(--color-text-primary)', fontFamily: 'inherit', margin: 0, maxHeight: '52vh', overflow: 'auto' }}>
                  {parsed.body.trim()}
                </pre>
              </div>
            )}
          </div>
        </div>
      );
    };

    const SkillLibraryPage = () => {
      var [metas, setMetas] = useState({});
      var [detail, setDetail] = useState(null);
      var [toast, setToast] = useState('');

      useEffect(function () {
        WPMN_SKILLS.forEach(function (s) {
          fetchTextLibSafe(s.src).then(function (t) {
            var parsed = parseSkillFrontmatter(t);
            setMetas(function (prev) {
              var next = Object.assign({}, prev);
              next[s.id] = parsed;
              return next;
            });
          }).catch(function () {
            setMetas(function (prev) {
              var next = Object.assign({}, prev);
              next[s.id] = { description: "Couldn't load description." };
              return next;
            });
          });
        });
      }, []);

      useEffect(function () {
        if (!toast) return;
        var t = setTimeout(function () { setToast(''); }, 1600);
        return function () { clearTimeout(t); };
      }, [toast]);

      function downloadSkill(skill) {
        fetchBlobLibSafe(skill.file).then(function (blob) {
          triggerBlobDownload(blob, skill.file);
          setToast('Downloaded ' + skill.file);
        }).catch(function () {
          setToast('Could not download ' + skill.file);
        });
      }

      var cols = 3;
      var totalRows = Math.ceil(WPMN_SKILLS.length / cols);

      return (
        <div>
          <div style={{ textAlign: 'center', marginBottom: 48 }}>
            <span style={{
              display: 'inline-flex', padding: '6px 16px', border: '1px solid var(--color-border-primary)',
              borderRadius: 999, fontSize: 12, fontWeight: 600, color: 'var(--color-text-secondary)', marginBottom: 20,
            }}>Design System</span>
            <h1 style={{ fontSize: 36, fontWeight: 800, margin: '0 0 12px', color: 'var(--color-text-primary)' }}>Skill Library</h1>
            <p style={{ fontSize: 14, color: 'var(--color-text-secondary)', maxWidth: 480, margin: '0 auto' }}>
              The Claude Skills that build and maintain this design system.
            </p>
          </div>

          <div style={{
            border: '1px solid var(--color-border-primary)', borderRadius: 'var(--radius-lg)',
            boxShadow: 'var(--shadow-soft-500, 0 4px 24px rgba(0,0,0,0.05))', overflow: 'hidden',
            display: 'grid', gridTemplateColumns: 'repeat(' + cols + ', 1fr)',
          }}>
            {WPMN_SKILLS.map(function (s, i) {
              var meta = metas[s.id];
              var row = Math.floor(i / cols);
              var isLastInRow = ((i % cols) === cols - 1) || (i === WPMN_SKILLS.length - 1);
              var isLastRow = row === totalRows - 1;
              return (
                <div key={s.id}
                  style={{
                    padding: 40,
                    borderRight: isLastInRow ? 'none' : '1px solid var(--color-border-primary)',
                    borderBottom: isLastRow ? 'none' : '1px solid var(--color-border-primary)',
                  }}>
                  <div style={{
                    width: 44, height: 44, borderRadius: '50%', background: 'var(--color-surface-icon-brand)',
                    display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--color-surface-icon-primary-invert)', marginBottom: 20,
                  }}>
                    <span style={{ width: 22, height: 22, display: 'block' }}>{SKILL_ICONS[s.id]}</span>
                  </div>
                  <div style={{ fontFamily: 'monospace', fontWeight: 800, fontSize: 18, color: 'var(--color-text-primary)', marginBottom: 10 }}>{s.id}</div>
                  <div style={{ fontSize: 13, color: 'var(--color-text-secondary)', lineHeight: 1.6, marginBottom: 20, minHeight: 78 }}>
                    {meta ? meta.description : 'Loading…'}
                  </div>
                  <span
                    onClick={function () { setDetail(s); }}
                    style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 13, fontWeight: 600, color: 'var(--btn-bg-enable)', cursor: 'pointer' }}>
                    View skill
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="1.5"/><path d="M10 8l4 4-4 4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  </span>
                </div>
              );
            })}
          </div>
          {detail && <SkillDetailModal skill={detail} onClose={function () { setDetail(null); }} onDownload={downloadSkill} />}
          {toast && <div className="hi-toast">{toast}</div>}
        </div>
      );
    };

    /* ── Prompt Library ─────────────────────────────────────────
       Lists the prompt.md that ships with every library section
       (from registry.json), so a prompt can be reviewed or pulled
       down without digging through the repo folder by folder. */
    const PromptDetailModal = ({ item, onClose, onDownload }) => {
      var [text, setText] = useState(null);
      var [err, setErr] = useState(false);

      useEffect(function () {
        var cancelled = false;
        fetchTextLibSafe(item.prompt)
          .then(function (t) { if (!cancelled) setText(t); })
          .catch(function () { if (!cancelled) setErr(true); });
        return function () { cancelled = true; };
      }, [item.prompt]);

      return (
        <div className="hi-modal-backdrop" onClick={onClose}>
          <div className="hi-modal" onClick={function (e) { e.stopPropagation(); }} style={{ maxWidth: 720 }}>
            <div className="hi-modal__head">
              <div>
                <div className="hi-modal__title">{item.name}</div>
                <div className="hi-modal__sub">{item.prompt}</div>
              </div>
              <button className="hi-modal__close" onClick={onClose} aria-label="Close">✕</button>
            </div>
            {err && <div className="hi-note">Couldn't load <code>{item.prompt}</code>.</div>}
            {!err && !text && <div className="hi-note">Loading…</div>}
            {text && (
              <div>
                <div style={{ display: 'flex', gap: 8, marginBottom: 20 }}>
                  <Button type="primary" size="sm" onClick={function () { onDownload(item); }}>Download prompt.md</Button>
                </div>
                <pre style={{ whiteSpace: 'pre-wrap', fontSize: 13, lineHeight: 1.6, color: 'var(--color-text-primary)', fontFamily: 'inherit', margin: 0, maxHeight: '52vh', overflow: 'auto' }}>
                  {text.trim()}
                </pre>
              </div>
            )}
          </div>
        </div>
      );
    };

    const PromptLibraryPage = () => {
      var [items, setItems] = useState(null);
      var [err, setErr] = useState(false);
      var [query, setQuery] = useState('');
      var [detail, setDetail] = useState(null);
      var [toast, setToast] = useState('');

      useEffect(function () {
        var cancelled = false;
        async function load() {
          var registry = null;
          try { registry = JSON.parse(await fetchTextLibSafe('registry.json')); }
          catch (e) { registry = null; }
          if (cancelled) return;
          if (!registry) { setErr(true); return; }
          var list = (registry.components || []).filter(function (c) { return c.category === 'Sections' && c.prompt; });
          setItems(list);
        }
        load();
        return function () { cancelled = true; };
      }, []);

      useEffect(function () {
        if (!toast) return;
        var t = setTimeout(function () { setToast(''); }, 1600);
        return function () { clearTimeout(t); };
      }, [toast]);

      function downloadPrompt(item) {
        fetchBlobLibSafe(item.prompt).then(function (blob) {
          triggerBlobDownload(blob, item.id + '-prompt.md');
          setToast('Downloaded ' + item.id + '-prompt.md');
        }).catch(function () {
          setToast('Could not download ' + item.prompt);
        });
      }

      var filtered = items ? items.filter(function (it) {
        if (!query) return true;
        var q = query.toLowerCase();
        return it.name.toLowerCase().indexOf(q) >= 0 || it.id.toLowerCase().indexOf(q) >= 0;
      }) : [];

      return (
        <div>
          <div className="page-header">
            <h1 style={{ fontSize: 32, fontWeight: 800, margin: 0, color: 'var(--color-text-primary)' }}>Prompt Library</h1>
            <p style={{ margin: '8px 0 0', fontSize: 14, color: 'var(--color-text-secondary)', maxWidth: 640 }}>
              The build prompt behind every section in the library. Click one to read it, or download it to rebuild the section elsewhere.
            </p>
          </div>
          {err && <div className="hi-note">Couldn't load <code>registry.json</code>.</div>}
          {!err && !items && <div className="hi-note">Loading…</div>}
          {items && (
            <div>
              <div className="hi-search" style={{ marginBottom: 20, maxWidth: 320 }}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" strokeWidth="1.75" /><path d="M20 20l-3-3" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" /></svg>
                <input value={query} onChange={function (e) { setQuery(e.target.value); }} placeholder="Search by section name…" />
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(260px, 1fr))', gap: 16 }}>
                {filtered.map(function (it) {
                  return (
                    <div key={it.id}
                      onClick={function () { setDetail(it); }}
                      style={{
                        border: '1px solid var(--color-border-primary)', borderRadius: 'var(--radius-sm)',
                        padding: 16, cursor: 'pointer', background: 'var(--color-surface-primary)',
                        display: 'flex', flexDirection: 'column', gap: 6,
                      }}>
                      <div style={{ fontWeight: 700, fontSize: 14, color: 'var(--color-text-primary)' }}>{it.name}</div>
                      <div style={{ fontFamily: 'monospace', fontSize: 11, color: 'var(--color-text-secondary)' }}>{it.id}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
          {detail && <PromptDetailModal item={detail} onClose={function () { setDetail(null); }} onDownload={downloadPrompt} />}
          {toast && <div className="hi-toast">{toast}</div>}
        </div>
      );
    };

    /* ── Plugins & Extensions ───────────────────────────────────
       Lists WPMN's own plugins/extensions, each of which lives in its own
       private GitHub repo. The Download button never touches the repo or a
       token directly — it hits /api/plugin-download?id=<id>, a Vercel
       serverless function that holds GITHUB_TOKEN server-side, resolves the
       id via plugins-registry.json, and streams back a zip of that repo's
       branch (no GitHub Release required). That route only exists on the
       deployed site, not localhost:8910 — see api/plugin-download.js for why. */
    const PLUGIN_ICON = (
      <svg viewBox="0 0 24 24" fill="none"><path d="M9 3v3M15 3v3" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/><path d="M6.5 8h11a1.5 1.5 0 0 1 1.5 1.5v2A5.5 5.5 0 0 1 13.5 17h-3A5.5 5.5 0 0 1 5 11.5v-2A1.5 1.5 0 0 1 6.5 8Z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/><path d="M12 17v2M9 21h6" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>
    );

    const PluginsLibraryPage = () => {
      var [items, setItems] = useState(null);
      var [err, setErr] = useState(false);
      var [toast, setToast] = useState('');

      useEffect(function () {
        var cancelled = false;
        fetchTextLibSafe('plugins-registry.json')
          .then(function (t) { if (!cancelled) setItems(JSON.parse(t)); })
          .catch(function () { if (!cancelled) setErr(true); });
        return function () { cancelled = true; };
      }, []);

      useEffect(function () {
        if (!toast) return;
        var t = setTimeout(function () { setToast(''); }, 2200);
        return function () { clearTimeout(t); };
      }, [toast]);

      function downloadPlugin(plugin) {
        if (!plugin.repo) {
          setToast('"' + plugin.name + '" isn\'t wired up yet — add a repo in plugins-registry.json.');
          return;
        }
        var filename = plugin.id + '.zip';
        fetch('/api/plugin-download?id=' + encodeURIComponent(plugin.id))
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.blob();
          })
          .then(function (blob) {
            triggerBlobDownload(blob, filename);
            setToast('Downloaded ' + filename);
          })
          .catch(function () {
            setToast('Could not download — this only works on the live deployed site, not localhost.');
          });
      }

      return (
        <div>
          <div className="page-header">
            <h1 style={{ fontSize: 32, fontWeight: 800, margin: 0, color: 'var(--color-text-primary)' }}>Plugins & Extensions</h1>
            <p style={{ margin: '8px 0 0', fontSize: 14, color: 'var(--color-text-secondary)', maxWidth: 640 }}>
              Internal WPMN plugins and extensions, each built and versioned in its own private repo. Click download to pull a zip of it.
            </p>
          </div>
          {err && <div className="hi-note">Couldn't load <code>plugins-registry.json</code>.</div>}
          {!err && !items && <div className="hi-note">Loading…</div>}
          {items && (
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: 16 }}>
              {items.map(function (p) {
                var ready = !!p.repo;
                return (
                  <div key={p.id}
                    style={{
                      border: '1px solid var(--color-border-primary)', borderRadius: 'var(--radius-sm)',
                      padding: 24, background: 'var(--color-surface-primary)',
                      display: 'flex', flexDirection: 'column', gap: 12,
                    }}>
                    <div style={{
                      width: 40, height: 40, borderRadius: '50%', background: 'var(--color-surface-icon-brand)',
                      display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--color-surface-icon-primary-invert)',
                    }}>
                      <span style={{ width: 20, height: 20, display: 'block' }}>{PLUGIN_ICON}</span>
                    </div>
                    <div>
                      <div style={{ fontWeight: 700, fontSize: 15, color: 'var(--color-text-primary)' }}>{p.name}</div>
                      <div style={{ fontFamily: 'monospace', fontSize: 11, color: 'var(--color-text-secondary)', marginTop: 2 }}>{p.id}{p.version ? ' · v' + p.version : ''}</div>
                    </div>
                    <div style={{ fontSize: 13, color: 'var(--color-text-secondary)', lineHeight: 1.6, flex: 1 }}>{p.description}</div>
                    <Button type={ready ? 'primary' : 'secondary'} size="sm" onClick={function () { downloadPlugin(p); }}>
                      {ready ? 'Download' : 'Coming soon'}
                    </Button>
                  </div>
                );
              })}
            </div>
          )}
          {toast && <div className="hi-toast">{toast}</div>}
        </div>
      );
    };

    const App = () => {
      const [theme, setTheme] = useState('light');
      const [sidebarOpen, setSidebarOpen] = useState(() => {
        try { return localStorage.getItem('wpmn-ds-sidebar') !== 'closed'; } catch (e) { return true; }
      });
      const toggleSidebar = () => setSidebarOpen(o => {
        try { localStorage.setItem('wpmn-ds-sidebar', o ? 'closed' : 'open'); } catch (e) {}
        return !o;
      });
      const [brand, setBrand] = useState('wpmanagenia');
      const [page, setPage] = useState('brand');

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        if (brand === 'wpmanagenia') {
          document.documentElement.removeAttribute('data-brand');
        } else {
          document.documentElement.setAttribute('data-brand', brand);
        }
      }, [theme, brand]);

      const navItems = [
        { id: 'components',  label: '⚡ Components' },
        { id: 'sections',    label: '🧱 Sections' },
        { id: 'icons',       label: '✦ Icons' },
        { id: 'skills',      label: '🧩 Skill Library' },
        { id: 'prompts',     label: '💬 Prompt Library' },
        { id: 'plugins',     label: '🔌 Plugins & Extensions' },
        { id: 'brand',       label: 'Brand Preview' },
        { id: 'allbrands',   label: 'All Brands' },
        { id: 'tokens',      label: 'Tokens' },
        { id: 'typography',  label: 'Typography' },
        { id: 'guidelines',  label: '📐 Guidelines' },
      ];

      return (
        <div className="app-shell">
          {/* Floating expand button when the sidebar is collapsed */}
          {!sidebarOpen && (
            <button className="sidebar-toggle sidebar-toggle--floating" onClick={toggleSidebar}
              aria-label="Expand sidebar" title="Expand sidebar">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 5h18M3 12h18M3 19h18" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
            </button>
          )}

          {/* Sidebar */}
          <div className={`sidebar${sidebarOpen ? '' : ' collapsed'}`}>
            <button className="sidebar-toggle" onClick={toggleSidebar}
              aria-label="Collapse sidebar" title="Collapse sidebar">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/><path d="M20 4v16" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
            </button>
            <div className="sidebar-logo">WPMN.DS</div>
            <div className="sidebar-sub">Design System Beta</div>

            <div className="sidebar-section-label">Navigation</div>
            {navItems.map(n => (
              <div key={n.id} className={`nav-item ${page === n.id ? 'active' : ''}`} onClick={() => setPage(n.id)}>{n.label}</div>
            ))}

            <div className="sidebar-section-label">Brand</div>
            {BRANDS.map(b => (
              <div key={b.key} className={`nav-item ${brand === b.key ? 'active' : ''}`} style={{ display:'flex', alignItems:'center', gap:8 }} onClick={() => { setBrand(b.key); setPage('brand'); }}>
                <div style={{ width:20, height:20, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
                  <Logo brand={b.key} variant="icon" type={brand === b.key ? 'white' : (theme === 'dark' ? 'white' : 'primary')} height={18} />
                </div>
                <span style={{ flex:1 }}>{b.name}</span>
              </div>
            ))}

            <div style={{ marginTop:24 }}>
              <button
                className="wpmn-btn wpmn-btn--secondary wpmn-btn--sm wpmn-btn--full"
                onClick={() => setTheme(t => t === 'light' ? 'dark' : 'light')}
              >
                {theme === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode'}
              </button>
            </div>
          </div>

          {/* Main content */}
          <div className="main">
            <CompErrorBoundary key={page}>
              {page === 'components' && <ComponentsPage theme={theme} brand={brand} mode="components" />}
              {page === 'sections'   && <ComponentsPage theme={theme} brand={brand} mode="sections" />}
              {page === 'icons'      && <IconsPage />}
              {page === 'skills'     && <SkillLibraryPage />}
              {page === 'prompts'    && <PromptLibraryPage />}
              {page === 'plugins'    && <PluginsLibraryPage />}
              {page === 'brand'      && <BrandPage brand={brand} theme={theme} />}
              {page === 'allbrands'  && <AllBrandsPage theme={theme} />}
              {page === 'tokens'     && <TokensPage />}
              {page === 'typography'  && <TypographyPage />}
              {page === 'guidelines'  && <GuidelinesPage theme={theme} brand={brand} />}
            </CompErrorBoundary>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <!-- ── Live reload ─────────────────────────────────────────── -->
  <script>
    (function () {
      function connect() {
        const es = new EventSource('/livereload');
        es.onmessage = function (e) {
          if (e.data === 'reload') {
            console.log('[DS] file changed — reloading…');
            location.reload();
          }
        };
        es.onerror = function () {
          es.close();
          // Retry after 2 s (server may have restarted)
          setTimeout(connect, 2000);
        };
      }
      connect();
    })();
  </script>
</body>
</html>
