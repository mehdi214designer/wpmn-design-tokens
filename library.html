<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WPMN Component Library</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  /* Shell styles only. Design system tokens are injected at runtime
     (fetched from the repo CSS with @import lines stripped, so
     [data-brand] overrides cascade correctly — workaround for the
     tokens.css double-import, core files untouched). */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font-family-base, 'Work Sans', sans-serif);
    background: var(--color-surface-primary, #fff);
    color: var(--color-text-primary, #07090c);
  }
  #root { height: 100%; }

  .app-shell { display: flex; min-height: 100vh; }

  /* ── Sidebar ─────────────────────────────────────────── */
  .sidebar {
    width: 264px; flex-shrink: 0;
    padding: 24px 16px 48px;
    border-right: 1.5px solid var(--color-border-primary, #dbdee4);
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .sidebar-logo { font-size: 20px; font-weight: 600; padding: 0 12px; }
  .sidebar-logo span { color: var(--btn-bg-enable, #0d5fff); }
  .sidebar-sub { font-size: 12px; color: var(--color-text-secondary, #4e5d78); padding: 2px 12px 0; }
  .sidebar-search {
    width: 100%; height: 40px; padding: 0 12px; margin: 16px 0 4px;
    font-family: inherit; font-size: 14px;
    color: var(--input-text-active, #272e3c);
    border: 1px solid var(--input-stroke-default, #c9ced6);
    border-radius: var(--radius-xsm, 8px);
    background: transparent; outline: none;
    transition: border-color 120ms ease;
  }
  .sidebar-search:focus { border-color: var(--input-stroke-active); }
  .sidebar-search::placeholder { color: var(--input-text-default, #a6aebb); }
  .sidebar-section-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--color-text-secondary, #4e5d78);
    padding: 18px 12px 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; padding: 7px 12px; border-radius: var(--radius-xsm, 8px);
    color: var(--color-text-secondary, #4e5d78);
    cursor: pointer; user-select: none;
    transition: background-color 120ms ease, color 120ms ease;
  }
  .nav-item:hover { background: color-mix(in srgb, var(--color-text-primary, #07090c) 5%, transparent); }
  .nav-item.active { background: var(--btn-bg-enable, #0d5fff); color: var(--color-text-primary-invert, #fff); }
  .nav-item.sub { margin-left: 14px; font-size: 13px; padding: 5px 12px; }
  .nav-item .count { margin-left: auto; font-size: 11px; opacity: 0.7; }
  .brand-dot { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.08); }
  .brand-picker {
    display: flex; align-items: center; gap: 8px;
    margin-top: 8px; padding: 0 12px;
    height: 40px;
    border: 1px solid var(--input-stroke-default, #c9ced6);
    border-radius: var(--radius-xsm, 8px);
    transition: border-color 120ms ease;
  }
  .brand-picker:focus-within { border-color: var(--input-stroke-active); }
  .brand-select {
    flex: 1; min-width: 0; height: 100%;
    font-family: inherit; font-size: 14px;
    color: var(--color-text-primary, #07090c);
    background: transparent; border: none; outline: none; cursor: pointer;
  }
  .brand-select option { color: #07090c; background: #fff; }
  .theme-btn {
    width: 100%; height: 40px; margin-top: 20px;
    font-family: inherit; font-size: 14px; font-weight: 500;
    border: 1.5px solid var(--color-border-primary, #dbdee4);
    border-radius: var(--radius-xsm, 8px);
    background: transparent; color: var(--color-text-primary, #07090c);
    cursor: pointer; transition: background-color 120ms ease;
  }
  .theme-btn:hover { background: color-mix(in srgb, var(--color-text-primary, #07090c) 5%, transparent); }

  /* ── Main ────────────────────────────────────────────── */
  .main { flex: 1; min-width: 0; padding: 32px 40px 120px; }
  .page-header h1 { font-size: 31px; font-weight: 600; margin: 0 0 6px; }
  .page-header p { font-size: 15px; color: var(--color-text-secondary, #4e5d78); margin: 0; max-width: 760px; line-height: 1.55; }
  .result-count { font-size: 13px; color: var(--color-text-secondary, #4e5d78); margin: 20px 0 0; }

  .section { margin-top: 36px; }
  .section-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .section-title { font-size: 20px; font-weight: 600; }
  .section-crumb { font-size: 12px; color: var(--color-text-secondary, #4e5d78); }
  .section-desc { font-size: 13.5px; line-height: 20px; color: var(--color-text-secondary, #4e5d78); margin: 0 0 12px; max-width: 760px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .chips span {
    font-size: 11px; color: var(--color-text-secondary, #4e5d78);
    border: 1px solid var(--color-border-primary, #dbdee4);
    border-radius: 6px; padding: 2px 8px;
  }
  .card {
    border: 1.5px solid var(--color-border-primary, #dbdee4);
    border-radius: var(--radius-md, 16px);
    padding: 32px;
    background: var(--color-surface-primary, #fff);
    overflow-x: auto;
  }
  .card-actions { display: flex; gap: 8px; margin-top: 12px; max-width: 420px; }
  .lib-btn {
    flex: 1; height: 40px; padding: 0 16px;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: inherit; font-size: 14px; font-weight: 500;
    border-radius: var(--radius-xsm, 8px); cursor: pointer;
    transition: background-color 120ms ease, color 120ms ease;
    white-space: nowrap;
  }
  .lib-btn--prompt { background: var(--btn-bg-enable, #0d5fff); color: var(--color-text-primary-invert, #fff); border: none; }
  .lib-btn--prompt:hover { background: var(--btn-bg-hovered); }
  .lib-btn--code { background: transparent; color: var(--btn-bg-enable, #0d5fff); border: 1.5px solid var(--btn-bg-enable, #0d5fff); }
  .lib-btn--code:hover { background: var(--btn-bg-enable); color: var(--color-text-primary-invert, #fff); }
  .lib-btn--copied { background: var(--color-success-primary) !important; border-color: var(--color-success-primary) !important; color: var(--color-text-primary-invert, #fff) !important; }

  .status-box { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; height: 280px; color: var(--color-text-secondary, #4e5d78); font-size: 14px; }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--color-border-primary, #dbdee4); border-top-color: var(--btn-bg-enable, #0d5fff); border-radius: 50%; animation: lib-spin 0.7s linear infinite; }
  @keyframes lib-spin { to { transform: rotate(360deg); } }
  .error-text { color: var(--color-error-primary, #ff3333); }

  @media (max-width: 900px) {
    .sidebar { display: none; }
    .main { padding: 24px 16px 96px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const RAW_BASE = 'https://raw.githubusercontent.com/mehdi214designer/wpmn-design-tokens/master/';
let BASE = '';

/* Brand list + swatch colors (display only) — mirrors demo.html */
const BRAND_LIST = [
  { key: 'wpmanagenia',     name: 'WPManageNinja',   color: '#0D5FFF' },
  { key: 'fluentforms',     name: 'FluentForms',     color: '#2B6CFF' },
  { key: 'fluentcrm',       name: 'FluentCRM',       color: '#BA4CDE' },
  { key: 'fluentbooking',   name: 'FluentBooking',   color: '#2653C5' },
  { key: 'fluentcommunity', name: 'FluentCommunity', color: '#485CE0' },
  { key: 'ninjatables',     name: 'Ninja Tables',    color: '#046EC0' },
  { key: 'paymattic',       name: 'Paymattic',       color: '#FF6A00' },
  { key: 'fluentboards',    name: 'FluentBoards',    color: '#F1EB62' },
  { key: 'fluentsmtp',      name: 'FluentSMTP',      color: '#C516C0' },
  { key: 'fluentsupport',   name: 'FluentSupport',   color: '#00B36D' },
  { key: 'fluentaffiliate', name: 'FluentAffiliate', color: '#2C6AE2' },
  { key: 'azonpress',       name: 'AzonPress',       color: '#FFC800' },
  { key: 'wpsocialninja',   name: 'WP Social Ninja', color: '#5B2DD4' },
  { key: 'fluentcart',      name: 'FluentCart',      color: '#0000D9' },
  { key: 'fluentplayer',    name: 'FluentPlayer',    color: '#0163DD' },
  { key: 'fluentmembers',   name: 'FluentMembers',   color: '#824EEB' },
];

/* ── fetch helpers ─────────────────────────────────────── */
function fetchText(path) {
  return fetch(BASE + path).then(r => {
    if (!r.ok) throw new Error('Failed to fetch ' + path + ' (' + r.status + ')');
    return r.text();
  });
}

function injectStyle(css, id) {
  if (document.querySelector('style[data-css="' + id + '"]')) return;
  const tag = document.createElement('style');
  tag.setAttribute('data-css', id);
  tag.textContent = css;
  document.head.appendChild(tag);
}

/* Token CSS loader — fetches core token files in cascade order and strips
   @import lines. This is what makes [data-brand] switching work: tokens.css
   re-imports primitives.css, which would otherwise re-declare the default
   brand colors AFTER brand-primitives.css and win the cascade. */
function loadTokenCss() {
  const files = ['primitives.css', 'brand-primitives.css', 'tokens.css', 'typography.css'];
  return Promise.all(files.map(fetchText)).then(contents => {
    contents.forEach((css, i) => {
      injectStyle(css.replace(/@import[^;]+;/g, ''), 'tokens-' + files[i]);
    });
  });
}

/* ── component loader (same pattern as demo.html) ──────── */
function stripModules(code) {
  return code
    .replace(/^import\s[\s\S]*?from\s+['"].*?['"];?\s*$/gm, '')
    .replace(/^import\s+['"].*?['"];?\s*$/gm, '')
    .replace(/^export\s+default\s+/gm, '')
    .replace(/^export\s+/gm, '');
}

function loadComponentStyles(comp) {
  const cssPaths = Object.values(comp.files || {}).filter(p => /\.css$/.test(p));
  return Promise.all(cssPaths.map(p => fetchText(p).then(css => injectStyle(css, p))));
}

function evalWrapped(code) {
  const transpiled = Babel.transform(code, { presets: ['react'] }).code;
  (0, eval)(transpiled);
}

function loadComponentScript(comp) {
  const jsPaths = [];
  if (comp.files && comp.files.data) jsPaths.push(comp.files.data);
  if (comp.files && comp.files.jsx) jsPaths.push(comp.files.jsx);
  if (!jsPaths.length) return Promise.resolve();
  return Promise.all(jsPaths.map(fetchText)).then(sources => {
    const code = sources.map(stripModules).join('\n\n');
    const localName = comp.name === 'Icons' ? 'HugeIcons' : comp.name;
    evalWrapped(
      '(function(){' +
      'var useState=React.useState,useEffect=React.useEffect,useId=React.useId,useMemo=React.useMemo,useRef=React.useRef;\n' +
      code + '\n' +
      'window.DS=window.DS||{};' +
      'window.DS["' + comp.name + '"]=typeof ' + localName + '!=="undefined"?' + localName + ':undefined;' +
      '})();'
    );
  });
}

function loadComponentDemo(comp) {
  if (!comp.demo) return Promise.resolve();
  return fetchText(comp.demo).then(source => {
    evalWrapped(
      '(function(){' +
      'var useState=React.useState,useEffect=React.useEffect,useId=React.useId;\n' +
      stripModules(source) + '\n' +
      'window.DS=window.DS||{};window.DS.__demos=window.DS.__demos||{};' +
      'window.DS.__demos["' + comp.name + '"]=typeof Demo!=="undefined"?Demo:undefined;' +
      '})();'
    );
  });
}

/* ── clipboard ─────────────────────────────────────────── */
function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); resolve(); } catch (e) { reject(e); }
    document.body.removeChild(ta);
  });
}

/* ── error boundary ────────────────────────────────────── */
class DemoBoundary extends React.Component {
  constructor(props) { super(props); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (this.state.err) {
      return <p className="error-text" style={{fontSize:13,margin:0}}>Render error: {this.state.err.message}</p>;
    }
    return this.props.children;
  }
}

/* ── UI pieces ─────────────────────────────────────────── */
const CopyButton = ({ label, kind, action }) => {
  const [state, setState] = useState('idle');
  const cls = 'lib-btn lib-btn--' + kind + (state !== 'idle' ? ' lib-btn--copied' : '');
  const text = state === 'done' ? 'Copied!' : state === 'fail' ? 'Failed' : label;
  return (
    <button className={cls} onClick={() => {
      action()
        .then(() => { setState('done'); setTimeout(() => setState('idle'), 1600); })
        .catch(() => { setState('fail'); setTimeout(() => setState('idle'), 1600); });
    }}>{text}</button>
  );
};

const ComponentSection = ({ comp, ready }) => {
  const DemoFn = (window.DS && window.DS.__demos && window.DS.__demos[comp.name]) || null;

  const chips = [];
  const props = comp.props || {};
  Object.keys(props).forEach(key => {
    const p = props[key];
    if (p && p.values && p.values.length > 1 && key !== 'brand') chips.push(key + ': ' + p.values.join(' / '));
  });

  const copyPromptAction = () => fetchText(comp.prompt).then(copyToClipboard);
  const copyCodeAction = () => {
    const paths = Object.values(comp.files || {});
    return Promise.all(paths.map(fetchText)).then(contents => {
      const bundle = contents.map((c, i) => '/* ===== ' + paths[i] + ' ===== */\n\n' + c).join('\n\n');
      const header = '/*\n * WPMN Design System — ' + comp.name +
        '\n * Requires token CSS loaded first:\n * ' + RAW_BASE + 'index.css\n */\n\n';
      return copyToClipboard(header + bundle);
    });
  };

  return (
    <div className="section" id={'comp-' + comp.id}>
      <div className="section-head">
        <span className="section-title">{comp.name}</span>
        <span className="section-crumb">{(comp.category || 'Other') + ' / ' + (comp.subcategory || 'General')}</span>
      </div>
      <p className="section-desc">{comp.description}</p>
      {chips.length > 0 && (
        <div className="chips">{chips.slice(0, 3).map((c, i) => <span key={i}>{c}</span>)}</div>
      )}
      <div className="card">
        {ready && DemoFn && <DemoBoundary key={comp.id}><DemoFn /></DemoBoundary>}
        {ready && !DemoFn && <p style={{fontSize:13,color:'var(--color-text-secondary)',margin:0}}>No demo file — add components/{comp.name}/demo.jsx</p>}
        {!ready && (
          <div style={{display:'flex',alignItems:'center',gap:10,color:'var(--color-text-secondary)',fontSize:13}}>
            <div className="spinner" style={{width:16,height:16,borderWidth:2}} /> Loading…
          </div>
        )}
      </div>
      <div className="card-actions">
        <CopyButton label="Copy Prompt" kind="prompt" action={copyPromptAction} />
        <CopyButton label="Copy Code" kind="code" action={copyCodeAction} />
      </div>
    </div>
  );
};

/* ── App ───────────────────────────────────────────────── */
const App = ({ registry }) => {
  const [theme, setTheme] = useState('light');
  const [brand, setBrand] = useState('wpmanagenia');
  const [q, setQ] = useState('');
  const [cat, setCat] = useState(null);
  const [sub, setSub] = useState(null);
  const [ready, setReady] = useState(false);
  const [loadError, setLoadError] = useState(null);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : '');
    if (theme !== 'dark') document.documentElement.removeAttribute('data-theme');
  }, [theme]);

  useEffect(() => {
    if (brand === 'wpmanagenia') document.documentElement.removeAttribute('data-brand');
    else document.documentElement.setAttribute('data-brand', brand);
  }, [brand]);

  /* load all components + demos once */
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const comps = registry.components;
        await Promise.all(comps.map(loadComponentStyles));
        for (const comp of comps) {
          try {
            await loadComponentScript(comp);
            await loadComponentDemo(comp);
          } catch (e) {
            console.warn('[Library] load failed for ' + comp.name + ':', e.message);
          }
        }
        if (!cancelled) setReady(true);
      } catch (e) {
        if (!cancelled) setLoadError(e.message);
      }
    })();
    return () => { cancelled = true; };
  }, [registry]);

  /* taxonomy */
  const cats = useMemo(() => {
    const out = {};
    registry.components.forEach(c => {
      const cc = c.category || 'Other';
      const ss = c.subcategory || 'General';
      out[cc] = out[cc] || {};
      out[cc][ss] = (out[cc][ss] || 0) + 1;
    });
    return out;
  }, [registry]);

  const shown = registry.components.filter(c => {
    if (cat && (c.category || 'Other') !== cat) return false;
    if (sub && (c.subcategory || 'General') !== sub) return false;
    if (q) {
      const hay = (c.id + ' ' + c.name + ' ' + (c.description || '') + ' ' +
        (c.category || '') + ' ' + (c.subcategory || '')).toLowerCase();
      if (hay.indexOf(q.toLowerCase()) === -1) return false;
    }
    return true;
  });

  return (
    <div className="app-shell">
      <div className="sidebar">
        <div className="sidebar-logo">WPMN <span>Library</span></div>
        <div className="sidebar-sub">AI-friendly component library</div>

        <input className="sidebar-search" placeholder="Search components…" value={q} onChange={e => setQ(e.target.value)} />

        <div className="brand-picker">
          <span className="brand-dot" style={{ background: (BRAND_LIST.find(b => b.key === brand) || BRAND_LIST[0]).color }} />
          <select className="brand-select" value={brand} onChange={e => setBrand(e.target.value)} title="Preview brand">
            {BRAND_LIST.map(b => <option key={b.key} value={b.key}>{b.name}</option>)}
          </select>
        </div>

        <div className="sidebar-section-label">Components</div>
        <div className={'nav-item' + (!cat ? ' active' : '')} onClick={() => { setCat(null); setSub(null); }}>
          All <span className="count">{registry.components.length}</span>
        </div>
        {Object.keys(cats).sort().map(cc => (
          <React.Fragment key={cc}>
            <div className={'nav-item' + (cat === cc && !sub ? ' active' : '')} onClick={() => { setCat(cc); setSub(null); }}>
              {cc} <span className="count">{Object.values(cats[cc]).reduce((a, b) => a + b, 0)}</span>
            </div>
            {Object.keys(cats[cc]).sort().map(ss => (
              <div key={ss} className={'nav-item sub' + (cat === cc && sub === ss ? ' active' : '')}
                onClick={() => { setCat(cc); setSub(ss); }}>
                {ss} <span className="count">{cats[cc][ss]}</span>
              </div>
            ))}
          </React.Fragment>
        ))}

        <button className="theme-btn" onClick={() => setTheme(t => t === 'light' ? 'dark' : 'light')}>
          {theme === 'light' ? 'Dark mode' : 'Light mode'}
        </button>
      </div>

      <div className="main">
        <div className="page-header">
          <h1>Component Library</h1>
          <p>
            Live components rendered from the repo. Switch brand or theme from the sidebar and every
            component re-skins through the token system. <strong>Copy Prompt</strong> gives an AI build
            spec, <strong>Copy Code</strong> gives the full source.
          </p>
          <p className="result-count">{shown.length} of {registry.components.length} components{brand !== 'wpmanagenia' ? ' · brand: ' + brand : ''}</p>
        </div>

        {loadError && <div className="status-box error-text">Component loading failed: {loadError}</div>}
        {shown.length === 0 && <div className="status-box">Nothing matches. Try a different search or filter.</div>}
        {shown.map(comp => <ComponentSection key={comp.id} comp={comp} ready={ready} />)}
      </div>
    </div>
  );
};

/* ── boot ──────────────────────────────────────────────── */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <div className="status-box"><div className="spinner" /> Loading design system…</div>
);

fetchText('registry.json')
  .catch(() => { BASE = RAW_BASE; return fetchText('registry.json'); })   /* file:// fallback */
  .then(text => {
    const registry = JSON.parse(text);
    return loadTokenCss().then(() => registry);
  })
  .then(registry => { root.render(<App registry={registry} />); })
  .catch(err => {
    root.render(
      <div className="status-box error-text">
        Could not load the library — check your connection or serve over HTTP (python3 serve.py). {err.message}
      </div>
    );
  });
</script>
</body>
</html>
