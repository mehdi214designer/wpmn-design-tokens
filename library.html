<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WPMN Component Library</title>
<link rel="stylesheet" href="index.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-family-base, 'Work Sans', sans-serif);
    background: var(--color-surface-primary);
    color: var(--color-text-primary);
  }

  /* ── Top bar ─────────────────────────────────────────── */
  .lib-topbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 16px;
    padding: 16px 32px;
    background: var(--color-surface-primary);
    border-bottom: 1.5px solid var(--color-border-primary);
  }
  .lib-topbar__title { font-size: 20px; font-weight: var(--font-weight-semibold, 600); white-space: nowrap; margin: 0; }
  .lib-topbar__title span { color: var(--btn-bg-enable); }
  .lib-search {
    flex: 1; min-width: 160px; height: 44px; padding: 0 16px;
    font-family: inherit; font-size: 15px;
    color: var(--input-text-active);
    border: 1px solid var(--input-stroke-default);
    border-radius: var(--radius-xsm, 8px);
    background: transparent; outline: none;
    transition: border-color 120ms ease;
  }
  .lib-search:focus { border-color: var(--input-stroke-active); }
  .lib-search::placeholder { color: var(--input-text-default); }
  .lib-select, .lib-toggle {
    height: 44px; padding: 0 14px; font-family: inherit; font-size: 14px;
    font-weight: var(--font-weight-medium, 500);
    border: 1.5px solid var(--color-border-primary);
    border-radius: var(--radius-xsm, 8px);
    background: var(--color-surface-primary); color: var(--color-text-primary);
    cursor: pointer; transition: background-color 120ms ease;
  }
  .lib-select:hover, .lib-toggle:hover { background: color-mix(in srgb, var(--color-text-primary) 5%, transparent); }

  /* ── Layout ──────────────────────────────────────────── */
  .lib-body { display: flex; min-height: calc(100vh - 77px); }

  /* ── Sidebar filters ─────────────────────────────────── */
  .lib-side {
    width: 240px; flex-shrink: 0;
    padding: 28px 20px 64px 32px;
    border-right: 1.5px solid var(--color-border-primary);
  }
  .lib-side__all {
    display: block; width: 100%; text-align: left;
    font-family: inherit; font-size: 14px; font-weight: var(--font-weight-medium, 500);
    padding: 8px 12px; margin-bottom: 16px;
    border: none; border-radius: var(--radius-xsm, 8px);
    background: transparent; color: var(--color-text-secondary);
    cursor: pointer; transition: background-color 120ms ease, color 120ms ease;
  }
  .lib-cat { margin-bottom: 18px; }
  .lib-cat__name {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; text-align: left;
    font-family: inherit; font-size: 14px; font-weight: var(--font-weight-semibold, 600);
    padding: 8px 12px; border: none; border-radius: var(--radius-xsm, 8px);
    background: transparent; color: var(--color-text-primary);
    cursor: pointer; transition: background-color 120ms ease;
  }
  .lib-cat__count { font-size: 12px; font-weight: 400; color: var(--color-text-secondary); }
  .lib-sub {
    display: block; width: calc(100% - 12px); text-align: left; margin-left: 12px;
    font-family: inherit; font-size: 13px; font-weight: 400;
    padding: 6px 12px; border: none; border-radius: var(--radius-xsm, 8px);
    background: transparent; color: var(--color-text-secondary);
    cursor: pointer; transition: background-color 120ms ease, color 120ms ease;
  }
  .lib-side__all:hover, .lib-cat__name:hover, .lib-sub:hover { background: color-mix(in srgb, var(--color-text-primary) 5%, transparent); }
  .lib-side__all.is-active, .lib-sub.is-active, .lib-cat__name.is-active {
    background: var(--btn-bg-focused); color: var(--btn-bg-hovered);
  }

  /* ── Main grid ───────────────────────────────────────── */
  .lib-main { flex: 1; padding: 28px 32px 96px; min-width: 0; }
  .lib-count { font-size: 13px; color: var(--color-text-secondary); margin: 0 0 16px; }
  .lib-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  .lib-card {
    grid-column: span 1;
    border: 1.5px solid var(--color-border-primary);
    border-radius: var(--radius-md, 16px);
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: box-shadow 120ms ease;
  }
  .lib-card:hover { box-shadow: var(--shadow-soft-300); }
  .lib-card--wide { grid-column: span 2; }

  /* preview area */
  .lib-card__preview {
    background: color-mix(in srgb, var(--color-text-primary) 3%, var(--color-surface-primary));
    border-bottom: 1.5px solid var(--color-border-primary);
    padding: 28px; min-height: 140px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .lib-card__zoom { transform-origin: top left; }

  /* info area */
  .lib-card__info { padding: 18px 22px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .lib-card__head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .lib-card__name { font-size: 18px; font-weight: var(--font-weight-semibold, 600); margin: 0; }
  .lib-card__crumb { font-size: 12px; color: var(--color-text-secondary); }
  .lib-card__desc { font-size: 13px; line-height: 20px; color: var(--color-text-secondary); margin: 0; flex: 1; }
  .lib-card__chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .lib-card__chips span {
    font-size: 11px; color: var(--color-text-secondary);
    border: 1px solid var(--color-border-primary);
    border-radius: 6px; padding: 2px 8px;
  }
  .lib-card__actions { display: flex; gap: 8px; margin-top: 4px; }
  .lib-btn {
    flex: 1; height: 40px; padding: 0 12px;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: inherit; font-size: 14px; font-weight: var(--font-weight-medium, 500);
    border-radius: var(--radius-xsm, 8px); cursor: pointer;
    transition: background-color 120ms ease, color 120ms ease;
    white-space: nowrap;
  }
  .lib-btn--prompt { background: var(--btn-bg-enable); color: var(--color-text-primary-invert); border: none; }
  .lib-btn--prompt:hover { background: var(--btn-bg-hovered); }
  .lib-btn--code { background: transparent; color: var(--btn-bg-enable); border: 1.5px solid var(--btn-bg-enable); }
  .lib-btn--code:hover { background: var(--btn-bg-enable); color: var(--color-text-primary-invert); }
  .lib-btn--copied { background: var(--color-success-primary) !important; border-color: var(--color-success-primary) !important; color: var(--color-text-primary-invert) !important; }

  .lib-status { font-size: 14px; color: var(--color-text-secondary); padding: 48px 0; text-align: center; }
  .lib-status--error { color: var(--color-error-primary); }

  @media (max-width: 980px) {
    .lib-side { display: none; }
    .lib-grid { grid-template-columns: 1fr; }
    .lib-card--wide { grid-column: span 1; }
    .lib-topbar { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header class="lib-topbar">
  <h1 class="lib-topbar__title">WPMN <span>Library</span></h1>
  <input type="text" class="lib-search" id="search" placeholder="Search components...">
  <select class="lib-select" id="brandSelect" title="Preview brand"></select>
  <button class="lib-toggle" id="themeToggle">Dark</button>
</header>

<div class="lib-body">
  <aside class="lib-side" id="sidebar"></aside>
  <main class="lib-main">
    <p class="lib-count" id="count"></p>
    <div class="lib-grid" id="grid">
      <div class="lib-status" id="status">Loading components...</div>
    </div>
  </main>
</div>

<script>
(function () {
  var RAW_BASE = 'https://raw.githubusercontent.com/mehdi214designer/wpmn-design-tokens/master/';
  var BASE = '';
  var registry = null;
  var loaded = {};            /* component name -> true when evaluated */
  var roots = {};             /* component id -> React root */
  var state = { q: '', cat: null, sub: null };

  var grid = document.getElementById('grid');
  var sidebar = document.getElementById('sidebar');
  var countEl = document.getElementById('count');
  var statusEl = document.getElementById('status');
  var search = document.getElementById('search');
  var brandSelect = document.getElementById('brandSelect');
  var themeToggle = document.getElementById('themeToggle');

  /* ── helpers ─────────────────────────────────────────── */
  function fetchText(path) {
    return fetch(BASE + path).then(function (r) {
      if (!r.ok) throw new Error('Failed to fetch ' + path + ' (' + r.status + ')');
      return r.text();
    });
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); resolve(); } catch (e) { reject(e); }
      document.body.removeChild(ta);
    });
  }

  function flash(btn, label) {
    var original = btn.textContent;
    btn.textContent = label;
    btn.classList.add('lib-btn--copied');
    setTimeout(function () { btn.textContent = original; btn.classList.remove('lib-btn--copied'); }, 1600);
  }

  /* ── component loader (same pattern as demo.html) ────── */
  function stripModules(code) {
    return code
      .replace(/^import\s[\s\S]*?from\s+['"].*?['"];?\s*$/gm, '')
      .replace(/^import\s+['"].*?['"];?\s*$/gm, '')
      .replace(/^export\s+default\s+/gm, '')
      .replace(/^export\s+/gm, '');
  }

  function loadStyles(comp) {
    var cssPaths = [];
    Object.keys(comp.files || {}).forEach(function (k) {
      if (/\.css$/.test(comp.files[k])) cssPaths.push(comp.files[k]);
    });
    return Promise.all(cssPaths.map(function (p) {
      return fetchText(p).then(function (css) {
        if (document.querySelector('style[data-css="' + p + '"]')) return;
        var tag = document.createElement('style');
        tag.setAttribute('data-css', p);
        tag.textContent = css;
        document.head.appendChild(tag);
      });
    }));
  }

  function loadScript(comp) {
    if (loaded[comp.name]) return Promise.resolve();
    var jsPaths = [];
    if (comp.files && comp.files.data) jsPaths.push(comp.files.data);  /* e.g. logos.js before Logo.jsx */
    if (comp.files && comp.files.jsx) jsPaths.push(comp.files.jsx);
    if (!jsPaths.length) { loaded[comp.name] = true; return Promise.resolve(); }

    return Promise.all(jsPaths.map(fetchText)).then(function (sources) {
      var code = sources.map(stripModules).join('\n\n');
      var localName = comp.name === 'Icons' ? 'HugeIcons' : comp.name;
      var wrapped =
        '(function(){' +
        'var useState=React.useState,useEffect=React.useEffect,useId=React.useId,useMemo=React.useMemo,useRef=React.useRef;\n' +
        code + '\n' +
        'window.DS=window.DS||{};' +
        'window.DS["' + comp.name + '"]=typeof ' + localName + '!=="undefined"?' + localName + ':undefined;' +
        '})();';
      var transpiled = Babel.transform(wrapped, { presets: ['react'] }).code;
      (0, eval)(transpiled);
      loaded[comp.name] = true;
    });
  }

  /* ── preview renderer ────────────────────────────────── */
  function renderPreview(comp, mount) {
    if (!comp.preview || !comp.preview.jsx) {
      mount.innerHTML = '<span style="font-size:13px;color:var(--color-text-secondary)">No preview</span>';
      return;
    }
    try {
      var src =
        '(function(){' +
        'var DS=window.DS||{};' +
        'var Button=DS.Button,Badge=DS.Badge,Input=DS.Input,Text=DS.Text,NavBar=DS.NavBar,Logo=DS.Logo,Footer=DS.Footer,Breadcrumbs=DS.Breadcrumbs,SocialIcons=DS.SocialIcons;' +
        'return (' + comp.preview.jsx + ');' +
        '})()';
      var transpiled = Babel.transform(src, { presets: ['react'] }).code;
      var element = (0, eval)(transpiled);

      var zoom = comp.preview.zoom;
      var target = mount;
      if (zoom) {
        var inner = document.createElement('div');
        inner.className = 'lib-card__zoom';
        inner.style.width = (comp.preview.width || 1200) + 'px';
        inner.style.transform = 'scale(' + zoom + ')';
        var outer = document.createElement('div');
        outer.style.width = '100%';
        outer.style.overflow = 'hidden';
        outer.appendChild(inner);
        mount.innerHTML = '';
        mount.appendChild(outer);
        target = inner;
        /* fix outer height after render so the scale doesn't leave a gap */
        setTimeout(function () {
          outer.style.height = (inner.scrollHeight * zoom) + 'px';
          mount.style.alignItems = 'flex-start';
        }, 120);
      }
      var key = comp.id + (zoom ? '-z' : '');
      if (roots[key]) { try { roots[key].unmount(); } catch (e) {} }
      roots[key] = ReactDOM.createRoot(target);
      roots[key].render(element);
    } catch (err) {
      mount.innerHTML = '<span style="font-size:13px;color:var(--color-error-primary)">Preview failed: ' + err.message + '</span>';
    }
  }

  /* ── copy actions ────────────────────────────────────── */
  function copyPrompt(comp, btn) {
    fetchText(comp.prompt)
      .then(copyToClipboard)
      .then(function () { flash(btn, 'Copied!'); })
      .catch(function () { flash(btn, 'Failed'); });
  }

  function copyCode(comp, btn) {
    var files = comp.files || {};
    var paths = Object.keys(files).map(function (k) { return files[k]; });
    Promise.all(paths.map(fetchText)).then(function (contents) {
      var bundle = contents.map(function (c, i) {
        return '/* ===== ' + paths[i] + ' ===== */\n\n' + c;
      }).join('\n\n');
      var header = '/*\n * WPMN Design System — ' + comp.name +
        '\n * Requires token CSS loaded first:\n * ' + RAW_BASE + 'index.css\n */\n\n';
      return copyToClipboard(header + bundle);
    })
    .then(function () { flash(btn, 'Copied!'); })
    .catch(function () { flash(btn, 'Failed'); });
  }

  /* ── sidebar ─────────────────────────────────────────── */
  function buildSidebar() {
    var cats = {};
    registry.components.forEach(function (c) {
      var cat = c.category || 'Other';
      var sub = c.subcategory || 'General';
      cats[cat] = cats[cat] || {};
      cats[cat][sub] = (cats[cat][sub] || 0) + 1;
    });

    sidebar.innerHTML = '';
    var all = document.createElement('button');
    all.className = 'lib-side__all' + (!state.cat ? ' is-active' : '');
    all.textContent = 'All components (' + registry.components.length + ')';
    all.addEventListener('click', function () { state.cat = null; state.sub = null; refresh(); });
    sidebar.appendChild(all);

    Object.keys(cats).sort().forEach(function (cat) {
      var wrap = document.createElement('div');
      wrap.className = 'lib-cat';

      var total = Object.keys(cats[cat]).reduce(function (n, s) { return n + cats[cat][s]; }, 0);
      var head = document.createElement('button');
      head.className = 'lib-cat__name' + (state.cat === cat && !state.sub ? ' is-active' : '');
      head.innerHTML = cat + ' <span class="lib-cat__count">' + total + '</span>';
      head.addEventListener('click', function () { state.cat = cat; state.sub = null; refresh(); });
      wrap.appendChild(head);

      Object.keys(cats[cat]).sort().forEach(function (sub) {
        var btn = document.createElement('button');
        btn.className = 'lib-sub' + (state.cat === cat && state.sub === sub ? ' is-active' : '');
        btn.textContent = sub + ' (' + cats[cat][sub] + ')';
        btn.addEventListener('click', function () { state.cat = cat; state.sub = sub; refresh(); });
        wrap.appendChild(btn);
      });

      sidebar.appendChild(wrap);
    });
  }

  /* ── cards ───────────────────────────────────────────── */
  function chipSummary(comp) {
    var bits = [];
    var props = comp.props || {};
    Object.keys(props).forEach(function (key) {
      var p = props[key];
      if (p && p.values && p.values.length > 1 && key !== 'state' && key !== 'brand') {
        bits.push(key + ': ' + p.values.join(' / '));
      }
    });
    return bits.slice(0, 3);
  }

  function matches(comp) {
    if (state.cat && (comp.category || 'Other') !== state.cat) return false;
    if (state.sub && (comp.subcategory || 'General') !== state.sub) return false;
    if (state.q) {
      var hay = (comp.id + ' ' + comp.name + ' ' + (comp.description || '') + ' ' +
        (comp.category || '') + ' ' + (comp.subcategory || '')).toLowerCase();
      if (hay.indexOf(state.q) === -1) return false;
    }
    return true;
  }

  function refresh() {
    buildSidebar();
    grid.innerHTML = '';
    var shown = registry.components.filter(matches);
    countEl.textContent = shown.length + ' of ' + registry.components.length + ' components';

    if (!shown.length) {
      grid.innerHTML = '<div class="lib-status">Nothing matches. Try a different search or filter.</div>';
      return;
    }

    shown.forEach(function (comp) {
      var card = document.createElement('div');
      card.className = 'lib-card' + (comp.span === 2 ? ' lib-card--wide' : '');

      var preview = document.createElement('div');
      preview.className = 'lib-card__preview';
      card.appendChild(preview);

      var info = document.createElement('div');
      info.className = 'lib-card__info';

      var head = document.createElement('div');
      head.className = 'lib-card__head';
      var name = document.createElement('h2');
      name.className = 'lib-card__name';
      name.textContent = comp.name;
      var crumb = document.createElement('span');
      crumb.className = 'lib-card__crumb';
      crumb.textContent = (comp.category || 'Other') + ' / ' + (comp.subcategory || 'General');
      head.appendChild(name);
      head.appendChild(crumb);

      var desc = document.createElement('p');
      desc.className = 'lib-card__desc';
      desc.textContent = comp.description || '';

      var chips = document.createElement('div');
      chips.className = 'lib-card__chips';
      chipSummary(comp).forEach(function (m) {
        var s = document.createElement('span');
        s.textContent = m;
        chips.appendChild(s);
      });

      var actions = document.createElement('div');
      actions.className = 'lib-card__actions';
      var promptBtn = document.createElement('button');
      promptBtn.className = 'lib-btn lib-btn--prompt';
      promptBtn.textContent = 'Copy Prompt';
      promptBtn.addEventListener('click', function () { copyPrompt(comp, promptBtn); });
      var codeBtn = document.createElement('button');
      codeBtn.className = 'lib-btn lib-btn--code';
      codeBtn.textContent = 'Copy Code';
      codeBtn.addEventListener('click', function () { copyCode(comp, codeBtn); });
      actions.appendChild(promptBtn);
      actions.appendChild(codeBtn);

      info.appendChild(head);
      info.appendChild(desc);
      info.appendChild(chips);
      info.appendChild(actions);
      card.appendChild(info);
      grid.appendChild(card);

      renderPreview(comp, preview);
    });
  }

  /* ── top bar controls ────────────────────────────────── */
  search.addEventListener('input', function () {
    state.q = search.value.trim().toLowerCase();
    refresh();
  });

  themeToggle.addEventListener('click', function () {
    var html = document.documentElement;
    var dark = html.getAttribute('data-theme') === 'dark';
    if (dark) { html.removeAttribute('data-theme'); themeToggle.textContent = 'Dark'; }
    else { html.setAttribute('data-theme', 'dark'); themeToggle.textContent = 'Light'; }
  });

  function buildBrandSelect() {
    (registry.brands || []).forEach(function (b) {
      var opt = document.createElement('option');
      opt.value = b;
      opt.textContent = b;
      brandSelect.appendChild(opt);
    });
    brandSelect.value = 'wpmanagenia';
    brandSelect.addEventListener('change', function () {
      document.documentElement.setAttribute('data-brand', brandSelect.value);
    });
  }

  /* ── boot ────────────────────────────────────────────── */
  fetchText('registry.json')
    .catch(function () {
      BASE = RAW_BASE; /* opened via file:// — fall back to GitHub raw */
      return fetchText('registry.json');
    })
    .then(function (text) {
      registry = JSON.parse(text);
      buildBrandSelect();

      var comps = registry.components;
      statusEl.textContent = 'Loading ' + comps.length + ' components...';

      /* styles first (cheap), then scripts sequentially to keep eval order stable */
      return Promise.all(comps.map(loadStyles)).then(function () {
        return comps.reduce(function (chain, comp) {
          return chain.then(function () {
            return loadScript(comp).catch(function (err) {
              console.warn('Load failed for ' + comp.name + ':', err.message);
            });
          });
        }, Promise.resolve());
      });
    })
    .then(function () { refresh(); })
    .catch(function (err) {
      grid.innerHTML = '<div class="lib-status lib-status--error">Could not load the library — check your connection or serve over HTTP (python3 serve.py). ' + err.message + '</div>';
    });
})();
</script>
</body>
</html>
